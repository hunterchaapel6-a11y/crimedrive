  const i0=((x-r)/VG)|0, i1=((x+r)/VG)|0, j0=((y-r)/VG)|0, j1=((y+r)/VG)|0;
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const a = vgrid.get(i+','+j);
    if(a) for(const v of a){ if(v.__nv===st) continue; v.__nv=st; _near.push(v); }
  }
  return _near;
}

class Vehicle{
  constructor(x,y,a,type,mode,color){
    const s = SPECS[type]||SPECS.sedan;
    this.type=type; this.spec=s; this.mode=mode||'traffic';
    this.x=x; this.y=y; this.a=a; this.vx=0; this.vy=0;
    this.w=s.w; this.h=s.h; this.color=color||pick(BODY_COLORS);
    this.maxHp=s.hp; this.hp=s.hp;
    this.throttle=0; this.steer=0; this.brake=0; this.hand=false;
    this.vf=0; this.vr=0; this.drift=0; this.skidT=0; this.wrecked=false;
    this.ni=nearestNodeI(x); this.nj=nearestNodeJ(y); this.dir=0;
    this.cruise = rr(62,92); this.wait=0; this.honk=0; this.stuck=0;
    this.lightPhase = rnd()*TAU; this.smokeT=0; this.boostFlame=0;
    this.parked = (mode==='parked'); this.driverFled=false;
    this.engineOn = mode!=='parked';
    this.turnSign = 0; this.bumpCool=0;
    this.uid=++VEH_UID; this.omega=0;
    if(this.spec.trailer){
      /* start the trailer straight behind the hook, then let syncTrailer pin it */
      const back=this.w*0.5+1+trailerReach(this);
      this.tax=x-Math.cos(a)*back; this.tay=y-Math.sin(a)*back;
      this.hvx=this.hvy=0;
      syncTrailer(this);
    }
  }
  get speed(){ return Math.hypot(this.vx,this.vy); }
  corners(out){
    const c=Math.cos(this.a), s=Math.sin(this.a), hw=this.w/2, hh=this.h/2;
    out[0]=this.x+c*hw-s*hh; out[1]=this.y+s*hw+c*hh;
    out[2]=this.x+c*hw+s*hh; out[3]=this.y+s*hw-c*hh;
    out[4]=this.x-c*hw+s*hh; out[5]=this.y-s*hw-c*hh;
    out[6]=this.x-c*hw-s*hh; out[7]=this.y-s*hw+c*hh;
    return out;
  }
  damage(amt, cause){
    if(amt<=0 || this.hp<=0) return;
    this.hp = Math.max(0, this.hp-amt);
    if(this.hp<=0 && !this.wrecked){
      this.wrecked=true; this.hp=0;
      burst(this.x,this.y, 18, '#ffb020', 70);
      burst(this.x,this.y, 10, '#ff4b3e', 50);
      shake(4);
      if(this===player.car) Audio0.crash(0.5);
    }
  }
  applyPower(){
    if(this.mode!=='player') return {accel:this.spec.accel, max:this.spec.max, grip:this.spec.grip, turn:this.spec.turn};
    const u = player.up;
    let accel = this.spec.accel*(1+u.engine*0.10);
    let max = this.spec.max*(1+u.engine*0.09);
    let grip = this.spec.grip*(1+u.tires*0.10);
    let turn = this.spec.turn*(1+u.tires*0.045);
    if(player.flats>0){
      const f = player.flats===1 ? [0.74,0.80,0.86] : [0.52,0.60,0.70];
      grip*=f[0]; max*=f[1]; turn*=f[2]; accel*=f[1];
    }
    if(player.boosting){ accel*=2.15; max*=1.34; }
    return {accel,max,grip,turn};
  }
  update(dt){
    const P = this.applyPower();
    const c=Math.cos(this.a), s=Math.sin(this.a);
    let vf = this.vx*c + this.vy*s;
    let vr = -this.vx*s + this.vy*c;

    if(this.wrecked){ this.throttle=0; this.brake=0.4; }
    /* engine */
    const th = this.throttle;
    if(th>0) vf += P.accel*th*dt*(vf<0?1.7:1);
    else if(th<0) vf += -this.spec.accel*0.62*(-th)*dt*(vf>0?1.7:1);
    /* drag + rolling resistance */
    const mx = th>=0 ? P.max : this.spec.rev;
    vf -= vf*Math.abs(vf)/(mx*mx)*P.accel*dt;
    vf -= vf*0.55*dt;
    if(this.brake>0){ const b=this.spec.brake*this.brake*dt; if(Math.abs(vf)<=b) vf=0; else vf-=sign(vf)*b; }
    if(this.hand){ const b=this.spec.brake*0.45*dt; if(Math.abs(vf)<=b) vf=0; else vf-=sign(vf)*b; }

    /* steering */
    const spdF = clamp(Math.abs(vf)/34, 0, 1);
    const turnRate = P.turn * (1 - clamp(Math.abs(vf)/(P.max*1.9),0,0.42));
    this.omega = this.steer * turnRate * spdF * sign(vf||1);
    this.a += this.omega * dt;
    this.a = (this.a+TAU*4)%TAU;

    /* lateral grip -> drift */
    let grip = P.grip * weather.grip;
    if(this.hand) grip *= 0.17;
    if(this.mode==='player' && player.inPuddle) grip *= 0.42;
    if(Math.abs(vf)>P.max*0.55 && Math.abs(this.steer)>0.6) grip *= 0.82;
    vr -= vr*clamp(grip*dt,0,1);

    this.vf=vf; this.vr=vr;
    this.drift = clamp((Math.abs(vr)-6)/26,0,1);
    const nc=Math.cos(this.a), ns=Math.sin(this.a);
    this.vx = nc*vf - ns*vr;
    this.vy = ns*vf + nc*vr;
    this.x += this.vx*dt; this.y += this.vy*dt;

    /* skid marks + smoke */
    if(this.drift>0.18 && Math.abs(vf)>22){
      this.skidT -= dt;
      if(this.skidT<=0){
        this.skidT = 0.022;
        addSkid(this.x-nc*this.w*0.32 - ns*this.h*0.38, this.y-ns*this.w*0.32 + nc*this.h*0.38, this.a);
        addSkid(this.x-nc*this.w*0.32 + ns*this.h*0.38, this.y-ns*this.w*0.32 - nc*this.h*0.38, this.a);
        if(rnd()<0.5) puff(this.x-nc*this.w*0.4, this.y-ns*this.w*0.4, '#cfd6e0', 8);
      }
    }
    if(this.wrecked || this.hp<this.maxHp*0.34){
      this.smokeT-=dt;
      if(this.smokeT<=0){ this.smokeT = this.wrecked?0.07:0.2; puff(this.x-nc*this.w*0.4, this.y-ns*this.w*0.4, this.wrecked?'#3a3a3a':'#6a6a6a', 10); }
    }
    /* burnt-out shells cool off, then fade and leave a scorch behind */
    if(this.wrecked){
      this.deadT=(this.deadT||0)+dt;
      if(this.deadT>18) this.ghost=clamp(1-(this.deadT-18)/6,0,1);
    }
    collideWorld(this, dt);
    if(this.spec.trailer){ updateTrailerPhysics(this); collideTrailer(this); }
    this.bumpCool = Math.max(0,this.bumpCool-dt);
  }
}

/* ---- semi trailer ----
   The trailer nose is coupled to a hook on the back of the truck by a short
   drawbar. The trailer axle is dragged behind the hook on a fixed-length
   rigid link, so the trailer tracks the cab exactly (no spring, no lag) and
   swings out when the truck turns. It is a solid body of its own: it collides
   with buildings, trees, other vehicles, props and people, and hits are passed
   back to the truck it is hooked to. */
const TR_GAP = 5;            /* drawbar length between the trailer nose and the hook pin */
const TR_JACK = 1.2;         /* how far the trailer may fold against the cab (rad) */
let VEH_UID = 0;
function hasTrailer(v){ return !!v.spec.trailer && !(v.ghost!==undefined && v.ghost<0.05); }
function trailerReach(v){ return TR_GAP + v.spec.trailer.w*0.86; }      /* hook pin -> trailer axle */
/* re-pin the trailer to the truck's hook. Safe to call any number of times. */
function syncTrailer(v){
  const tl=v.spec.trailer.w;
  const hx=v.x-Math.cos(v.a)*(v.w*0.5+1), hy=v.y-Math.sin(v.a)*(v.w*0.5+1);
  const dx=hx-v.tax, dy=hy-v.tay;
  let ang = (dx*dx+dy*dy>0.0001) ? Math.atan2(dy,dx) : v.a;
  const fold=angDiff(v.a,ang);
  if(fold>TR_JACK) ang=v.a+TR_JACK; else if(fold<-TR_JACK) ang=v.a-TR_JACK;
  const ca=Math.cos(ang), sa=Math.sin(ang), L=trailerReach(v), cd=TR_GAP+tl*0.5;
  v.tax=hx-ca*L; v.tay=hy-sa*L;
  v.trailerA=ang; v.hookX=hx; v.hookY=hy;
  v.trailerX=hx-ca*cd; v.trailerY=hy-sa*cd;
}
function updateTrailerPhysics(v){
  /* hook velocity = cab velocity + the swing of the rear end as the cab turns */
  const rx=-Math.cos(v.a)*(v.w*0.5+1), ry=-Math.sin(v.a)*(v.w*0.5+1);
  v.hvx=v.vx-v.omega*ry; v.hvy=v.vy+v.omega*rx;
  syncTrailer(v);
}
/* how fast is the trailer moving at a world point? (hook end follows the cab,
   axle end can only roll along the trailer's own length) */
const _tv={x:0,y:0};
function trailerVelAt(v,px,py){
  const e0=Math.cos(v.trailerA), e1=Math.sin(v.trailerA);
  const s=clamp(((v.hookX-px)*e0+(v.hookY-py)*e1)/trailerReach(v),0,1);
  const al=v.hvx*e0+v.hvy*e1;
  _tv.x=v.hvx*(1-s)+e0*al*s; _tv.y=v.hvy*(1-s)+e1*al*s;
  return _tv;
}
/* move a whole rig (cab + trailer) rigidly */
function shiftVehicle(v,dx,dy){
  v.x+=dx; v.y+=dy;
  if(v.spec.trailer){ v.tax+=dx; v.tay+=dy; }
}
/* separating-axis test for two oriented boxes. On a hit, _sat.nx/ny is the
   unit normal pointing from box A toward box B and _sat.pen the overlap depth. */
const _sat={nx:0,ny:0,pen:0};
function satOBB(ax,ay,aa,ahl,ahh, bx_,by_,ba,bhl,bhh){
  const ac=Math.cos(aa), as_=Math.sin(aa), bc=Math.cos(ba), bs=Math.sin(ba);
  const dx=bx_-ax, dy=by_-ay;
  let best=1e9, bnx=0, bny=0;
  for(let k=0;k<4;k++){
    let lx,ly;
    if(k===0){ lx=ac; ly=as_; } else if(k===1){ lx=-as_; ly=ac; }
    else if(k===2){ lx=bc; ly=bs; } else { lx=-bs; ly=bc; }
    const ra=ahl*Math.abs(ac*lx+as_*ly)+ahh*Math.abs(-as_*lx+ac*ly);
    const rb=bhl*Math.abs(bc*lx+bs*ly)+bhh*Math.abs(-bs*lx+bc*ly);
    const dist=dx*lx+dy*ly;
    const ov=ra+rb-Math.abs(dist);
    if(ov<=0) return false;
    if(ov<best){ best=ov; if(dist<0){ bnx=-lx; bny=-ly; } else { bnx=lx; bny=ly; } }
  }
  _sat.nx=bnx; _sat.ny=bny; _sat.pen=best;
  return true;
}
/* trailer vs buildings and trees. The trailer first swings about its hook to
   get clear; if that isn't enough the whole rig gets shoved back. */
function collideTrailer(v){
  const t=v.spec.trailer, hl=t.w*0.5, hh=t.h*0.5;
  const tv=trailerVelAt(v,v.trailerX,v.trailerY);
  const tvx=tv.x, tvy=tv.y;
  let hitPower=0, hnx=0, hny=0;
  for(let it=0; it<4; it++){
    const tx=v.trailerX, ty=v.trailerY, ta=v.trailerA;
    blocksNear(tx,ty,hl+hh+8,_bl);
    let best=0, nx=0, ny=0;
    const c=Math.cos(ta), s=Math.sin(ta);
    for(const b of _bl){
      for(const bd of b.buildings){
        if(satOBB(tx,ty,ta,hl,hh, bd.x+bd.w*0.5,bd.y+bd.h*0.5,0,bd.w*0.5,bd.h*0.5) && _sat.pen>best){
          best=_sat.pen; nx=_sat.nx; ny=_sat.ny;
        }
      }
      if(b.trees.length){
        for(const tr of b.trees){
          const dx=tr.x-tx, dy=tr.y-ty;
          const lx=dx*c+dy*s, ly=-dx*s+dy*c;
          const r=tr.r*0.62;
          const qx=clamp(lx,-hl,hl), qy=clamp(ly,-hh,hh);
          const ex=lx-qx, ey=ly-qy, d2=ex*ex+ey*ey;
          if(d2>=r*r) continue;
          let pen,lnx,lny;
          if(d2>0.0001){ const d=Math.sqrt(d2); pen=r-d; lnx=ex/d; lny=ey/d; }
          else { lnx=0; lny=ly>=0?1:-1; pen=r+hh-Math.abs(ly); }
          if(pen>best){ best=pen; nx=lnx*c-lny*s; ny=lnx*s+lny*c; }
        }
      }
    }
    if(best<=0.01) break;
    /* (nx,ny) points from the trailer toward the obstacle */
    const px=-nx*best*1.02, py=-ny*best*1.02;
    const vn=tvx*nx+tvy*ny;                    /* > 0 : driving into it */
    if(vn>hitPower){ hitPower=vn; hnx=nx; hny=ny; }
    if(it<2){ v.tax+=px; v.tay+=py; syncTrailer(v); }
    else {
      shiftVehicle(v,px,py); syncTrailer(v);
      if(vn>0){ v.vx-=vn*nx*1.3; v.vy-=vn*ny*1.3; }
    }
  }
  if(hitPower>16){
    v.damage((hitPower-16)*0.30,'wall');
    if(hitPower>34) sparks(v.trailerX+hnx*hh, v.trailerY+hny*hh, 6);
    if(v===player.car){
      shake(clamp(hitPower*0.09,0,6)); Audio0.crash(clamp(hitPower/260,0.05,0.4));
      player.combo=0; player.comboT=0;
    }
  }
}
/* is a world point inside this vehicle - cab or trailer? */
function vehicleHitsPoint(v,x,y,pad){
  let dx=x-v.x, dy=y-v.y, c=Math.cos(v.a), s=Math.sin(v.a);
  if(Math.abs(dx*c+dy*s)<v.w/2+pad && Math.abs(-dx*s+dy*c)<v.h/2+pad) return true;
  if(hasTrailer(v)){
    const t=v.spec.trailer;
    dx=x-v.trailerX; dy=y-v.trailerY; c=Math.cos(v.trailerA); s=Math.sin(v.trailerA);
    if(Math.abs(dx*c+dy*s)<t.w/2+pad && Math.abs(-dx*s+dy*c)<t.h/2+pad) return true;
  }
  return false;
}

/* ---- collisions ---- */
const _cor=[0,0,0,0,0,0,0,0], _bl=[];
function collideWorld(v, dt){
  const cor = v.corners(_cor);
  const r = Math.max(v.w,v.h);
  blocksNear(v.x, v.y, r+4, _bl);
  let hitPower=0, nx=0, ny=0;
  for(const b of _bl){
    for(const bd of b.buildings){
      for(let k=0;k<4;k++){
        const px=cor[k*2], py=cor[k*2+1];
        if(px>bd.x && px<bd.x+bd.w && py>bd.y && py<bd.y+bd.h){
          const dl=px-bd.x, drr=bd.x+bd.w-px, dt2=py-bd.y, db=bd.y+bd.h-py;
          const m=Math.min(dl,drr,dt2,db);
          let ox=0,oy=0;
          if(m===dl) ox=-m; else if(m===drr) ox=m; else if(m===dt2) oy=-m; else oy=m;
          v.x+=ox*1.02; v.y+=oy*1.02;
          const len=Math.hypot(ox,oy)||1; const ux=ox/len, uy=oy/len;
          const vn = v.vx*ux + v.vy*uy;
          if(vn<0){
            v.vx -= vn*ux*1.5; v.vy -= vn*uy*1.5;
            hitPower = Math.max(hitPower, -vn); nx=ux; ny=uy;
            /* torque */
            const rx = px-v.x, ry = py-v.y;
            v.a += (rx*uy - ry*ux)*0.0018*(-vn);
          }
        }
      }
    }
  }
  /* trees are solid now - clip one and you feel it */
  for(const b of _bl){
    if(!b.trees.length) continue;
    for(const t of b.trees){
      const tr=t.r*0.62 + v.h*0.42;
      const dx=v.x-t.x, dy=v.y-t.y, d2=dx*dx+dy*dy;
      if(d2<tr*tr && d2>0.0001){
        const d=Math.sqrt(d2), ux=dx/d, uy=dy/d;
        v.x=t.x+ux*tr; v.y=t.y+uy*tr;
        const vn=v.vx*ux+v.vy*uy;
        if(vn<0){
          v.vx-=vn*ux*1.35; v.vy-=vn*uy*1.35;
          hitPower=Math.max(hitPower,-vn*0.8); nx=ux; ny=uy;
          if(-vn>30){ for(let q=0;q<4;q++) parts.push({x:t.x+rr(-t.r,t.r),y:t.y+rr(-t.r,t.r),vx:rr(-20,20),vy:rr(-20,20),r:rr(1,2),gr:0,life:1,max:rr(0.5,1.1),col:'#437a3d',type:1}); }
        }
      }
    }
  }
  if(hitPower>16){
    const dmg = (hitPower-16)*0.30;
    v.damage(dmg,'wall');
    if(hitPower>34){ sparks(v.x+nx*6, v.y+ny*6, 6); }
    if(v===player.car){
      shake(clamp(hitPower*0.09,0,6)); Audio0.crash(clamp(hitPower/260,0.05,0.4));
      player.combo=0; player.comboT=0;
    }
  }
  /* world bounds */
  const m=8;
  if(v.x<m){ v.x=m; v.vx=Math.abs(v.vx)*0.3; }
  if(v.x>WORLD-m){ v.x=WORLD-m; v.vx=-Math.abs(v.vx)*0.3; }
  if(v.y<m){ v.y=m; v.vy=Math.abs(v.vy)*0.3; }
  if(v.y>WORLD-m){ v.y=WORLD-m; v.vy=-Math.abs(v.vy)*0.3; }
}

/* shared crash response. (ux,uy) points A -> B; avx/avy and bvx/bvy are the
   speeds at the two contact points (a trailer moves differently from its cab). */
function resolveContact(A,B,ux,uy,pen,avx,avy,bvx,bvy,fx,fy,mA,mB,kA,kB){
  /* mA/mB: effective mass when a trailer takes the hit (trailer + cargo);
     kA/kB: share of the impulse that reaches the cab (trailer tyres soak up the rest) */
  const ma=mA||A.spec.mass, mb=mB||B.spec.mass, tot=ma+mb;
  if(kA===undefined) kA=1; if(kB===undefined) kB=1;
  shiftVehicle(A,-ux*pen*(mb/tot),-uy*pen*(mb/tot));
  shiftVehicle(B, ux*pen*(ma/tot), uy*pen*(ma/tot));
  const vn=(bvx-avx)*ux+(bvy-avy)*uy;
  if(vn>0) return;
  let e=1.35;
  const playerHit = (A===player.car||B===player.car);
  const bumper = playerHit && player.bumperT>0;
  if(bumper) e=3.2;
  const jimp = -(1+e)*vn/(1/ma+1/mb);
  A.vx-=jimp*ux/ma*kA; A.vy-=jimp*uy/ma*kA;
  B.vx+=jimp*ux/mb*kB; B.vy+=jimp*uy/mb*kB;
  const power=-vn;
  if(power>10){
    const dmgA=(power-10)*0.20*(bumper&&A!==player.car?2.4:1);
    const dmgB=(power-10)*0.20*(bumper&&B!==player.car?2.4:1);
    A.damage(bumper&&A===player.car?dmgA*0.25:dmgA);
    B.damage(bumper&&B===player.car?dmgB*0.25:dmgB);
    sparks(fx,fy, bumper?10:4);
    if(playerHit){
      const other = A===player.car?B:A;
      shake(clamp(power*0.07,0,5));
      Audio0.crash(clamp(power/240,0.05,0.4));
      if(bumper && other.bumpCool<=0){
        other.bumpCool=0.6;
        burst(other.x,other.y,14,'#ffb020',90);
        other.vx*=2.1; other.vy*=2.1; other.a+=rr(-1.2,1.2);
        other.damage(55);
        addScore(150,'BUMPER SLAM');
        Audio0.sweep(420,90,0.25,0.18,'square');
      } else {
        player.combo=0; player.comboT=0;
      }
      if(other.mode==='police' && power>18){ commitCrime('POLICE_VEHICLE_HIT'); }
    }
  }
}
/* T's trailer against B's cab (or B's own trailer) */
function trailerHit(T,B,useBTrailer){
  const tl=T.spec.trailer.w, th=T.spec.trailer.h;
  let bx_,by_,ba,bhl,bhh;
  if(useBTrailer){ bx_=B.trailerX; by_=B.trailerY; ba=B.trailerA; bhl=B.spec.trailer.w*0.5; bhh=B.spec.trailer.h*0.5; }
  else { bx_=B.x; by_=B.y; ba=B.a; bhl=B.w*0.5; bhh=B.h*0.5; }
  const dx=bx_-T.trailerX, dy=by_-T.trailerY;
  const reach=tl*0.5+th*0.5+bhl+bhh+2;
  if(dx*dx+dy*dy>reach*reach) return;
  if(!satOBB(T.trailerX,T.trailerY,T.trailerA,tl*0.5,th*0.5, bx_,by_,ba,bhl,bhh)) return;
  const ux=_sat.nx, uy=_sat.ny, pen=_sat.pen;
  /* contact point: nearest spot on the trailer's spine to the other body */
  const c=Math.cos(T.trailerA), s=Math.sin(T.trailerA);
  const al=clamp(dx*c+dy*s,-tl*0.5,tl*0.5);
  const fx=T.trailerX+c*al, fy=T.trailerY+s*al;
  const tv=trailerVelAt(T,fx,fy); const avx=tv.x, avy=tv.y;
  let bvx=B.vx, bvy=B.vy;
  if(useBTrailer){ const bv=trailerVelAt(B,bx_,by_); bvx=bv.x; bvy=bv.y; }
  resolveContact(T,B,ux,uy,pen,avx,avy,bvx,bvy,(fx+bx_)*0.5,(fy+by_)*0.5,
                 T.spec.mass*1.8, useBTrailer?B.spec.mass*1.8:0, 0.45, useBTrailer?0.45:1);
}
function trailerVsVehicles(){
  for(const T of vehicles){
    if(!hasTrailer(T)) continue;
    const list=nearVehicles(T.trailerX,T.trailerY,T.spec.trailer.w*0.5+34);
    for(const B of list){
      if(B===T) continue;
      trailerHit(T,B,false);
      if(hasTrailer(B) && T.uid<B.uid) trailerHit(T,B,true);
    }
  }
}
function vehicleVsVehicle(){
  for(let i=0;i<vehicles.length;i++){
    const A=vehicles[i];
    const ra = (A.w+A.h)*0.27;
    const list = nearVehicles(A.x,A.y,46);
    for(const B of list){
      if(B===A) continue;
      const rb=(B.w+B.h)*0.27, rsum=ra+rb;
      const dx=B.x-A.x, dy=B.y-A.y, d2=dx*dx+dy*dy;
      if(d2>rsum*rsum || d2<0.0001) continue;
      const d=Math.sqrt(d2), ux=dx/d, uy=dy/d, pen=rsum-d;
      resolveContact(A,B,ux,uy,pen,A.vx,A.vy,B.vx,B.vy,(A.x+B.x)/2,(A.y+B.y)/2);
    }
  }
  trailerVsVehicles();
}

/* ----------------------------- AI drivers -------------------------------- */
/* Two lanes each way. Right turns and through traffic hug the kerb, left
   turners sit in the inside lane - so junctions sort themselves out. */
const LANE_IN = 7, LANE_OUT = 17;
function laneOffset(dir, lane){
  const d=DIRS[dir], L = lane ? LANE_OUT : LANE_IN;
  return [-d[1]*L, d[0]*L];
}
function turnFrom(from,to){ if(to===from) return 0; return ((to-from+4)%4)===1 ? 1 : -1; }
/* pick the exit a driver will take at the node it is currently heading toward */
function rollTurn(v){
  const opts=[];
  for(let k=0;k<4;k++){
    if((k+2)%4===v.dir) continue;                       /* no U-turns */
    const ni=v.ni+DIRS[k][0], nj=v.nj+DIRS[k][1];
    if(ni<0||nj<0||ni>COLS||nj>ROWS) continue;
    opts.push({k,w:(k===v.dir?6.5:1.5)});
  }
  if(!opts.length) return (v.dir+2)%4;
  let tot=0; for(const o of opts) tot+=o.w;
  let r=rnd()*tot;
  for(const o of opts){ r-=o.w; if(r<=0) return o.k; }
  return opts[0].k;
}
function advanceNode(v){
  let k = v.plannedDir;
  if(k===undefined || k===null || (k+2)%4===v.dir) k = rollTurn(v);
  const ni=v.ni+DIRS[k][0], nj=v.nj+DIRS[k][1];
  if(ni<0||nj<0||ni>COLS||nj>ROWS) k = rollTurn(v);
  v.turnSign = turnFrom(v.dir,k);
  v.dir=k;
  v.ni=clamp(v.ni+DIRS[k][0],0,COLS); v.nj=clamp(v.nj+DIRS[k][1],0,ROWS);
  v.stopNode=null; v.stopWait=0;
  /* plan the next junction now so we can pick the right lane on the way in */
  v.plannedDir = rollTurn(v);
  v.signal = turnFrom(v.dir, v.plannedDir);
  v.lane = v.signal===-1 ? 0 : 1;                        /* 0 inside, 1 kerbside */
}
function advanceNodeToward(v,tx,ty){
  const pi=nearestNodeI(tx), pj=nearestNodeJ(ty);
  let best=null, bestScore=1e9;
  for(let k=0;k<4;k++){
    const ni=v.ni+DIRS[k][0], nj=v.nj+DIRS[k][1];
    if(ni<0||nj<0||ni>COLS||nj>ROWS) continue;
    let s = Math.abs(ni-pi)+Math.abs(nj-pj);
    if((k+2)%4===v.dir) s += 2.5;
    s += rnd()*0.35;
    if(s<bestScore){ bestScore=s; best={k,ni,nj}; }
  }
  if(!best){ advanceNode(v); return; }
  v.dir=best.k; v.ni=best.ni; v.nj=best.nj;
}
/* How far ahead is the nearest thing worth lifting off for?
   Returns 0 when the road is clear, otherwise the gap in world units. */
function pathBlocked(v){
  const c=Math.cos(v.a), s=Math.sin(v.a);
  const look = 22 + Math.abs(v.vf)*0.40;
  const halfW = (v.h)*0.52;
  let best=0;
  const list=nearVehicles(v.x,v.y,look+26);
  for(const o of list){
    if(o===v) continue;
    const dx=o.x-v.x, dy=o.y-v.y;
    const f = dx*c+dy*s, l = -dx*s+dy*c;
    if(f>1 && f<look && Math.abs(l)<halfW+o.h*0.52){ if(!best||f<best) best=f; }
    /* a trailer is part of the obstacle too */
    if(hasTrailer(o)){
      const tc=Math.cos(o.trailerA), ts=Math.sin(o.trailerA), thl=o.spec.trailer.w*0.5;
      for(let q=-1;q<=1;q++){
        const px=o.trailerX+tc*thl*0.75*q-v.x, py=o.trailerY+ts*thl*0.75*q-v.y;
        const f2=px*c+py*s, l2=-px*s+py*c;
        if(f2>1 && f2<look && Math.abs(l2)<halfW+o.spec.trailer.h*0.52){ if(!best||f2<best) best=f2; }
      }
    }
  }
  /* anybody on foot in front of the bonnet gets right of way */
  const lookP = Math.min(look, 44);
  for(const p of peds){
    const dx=p.x-v.x, dy=p.y-v.y;
    if(dx*dx+dy*dy > (lookP+8)*(lookP+8)) continue;
    const f = dx*c+dy*s, l = -dx*s+dy*c;
    if(f>1 && f<lookP && Math.abs(l)<halfW+5){ if(!best||f<best) best=f; }
  }
  if(player.onFoot){
    const dx=player.x-v.x, dy=player.y-v.y;
    if(dx*dx+dy*dy < (lookP+8)*(lookP+8)){
      const f = dx*c+dy*s, l = -dx*s+dy*c;
      if(f>1 && f<lookP && Math.abs(l)<halfW+5){ if(!best||f<best) best=f; }
    }
  }
  /* solid street furniture */
  const props=nearProps(v.x,v.y,look+8);
  for(let n=0;n<props.length;n++){
    const pr=props[n];
    if(pr.down || !pr.k.solid) continue;
    const dx=pr.x-v.x, dy=pr.y-v.y;
    const f = dx*c+dy*s, l = -dx*s+dy*c;
    if(f>1 && f<look && Math.abs(l)<halfW+pr.k.r){ if(!best||f<best) best=f; }
  }
  return best;
}
/* Is a level crossing barrier down across this driver's path? */
function crossingBlock(v){
  if(!city.crossings.length) return 0;
  const d=DIRS[v.dir];
  if(d[1]===0) return 0;                       /* only N/S traffic meets the line */
  const ry=city.rail.y;
  const ahead=(ry-v.y)*d[1];
  if(ahead<0 || ahead>110) return 0;
  for(const c of city.crossings){
    if(Math.abs(c.x-v.x)>ROAD*0.6) continue;
    if(c.down>0.2) return Math.max(2, ahead-14);
    return 0;
  }
  return 0;
}
function aiTraffic(v,dt){
  const tx0=nodeX(v.ni), ty0=nodeY(v.nj);
  if(v.lane===undefined) v.lane=1;
  const d=DIRS[v.dir];
  const along=(tx0-v.x)*d[0]+(ty0-v.y)*d[1];
  if(along<12) advanceNode(v);

  /* aim at the lane centre, easing toward the junction centre as we arrive */
  const off=laneOffset(v.dir, v.lane);
  const blend = clamp((along-ROAD*0.5)/40, 0, 1);
  const tx=tx0+off[0]*blend, ty=ty0+off[1]*blend;
  const want=Math.atan2(ty-v.y, tx-v.x);
  const df=angDiff(v.a,want);
  v.steer=clamp(df*2.4,-1,1);

  let target=v.cruise*(weather.kind==='rain'||weather.kind==='storm'?0.78:1);
  if(weather.kind==='fog') target*=0.82;
  if(Math.abs(df)>0.55) target*=0.45;

  /* junction control */
  const stopDist = along - (ROAD*0.5+4);
  v.approach = stopDist;
  let holding=false;
  if(stopDist>-8 && stopDist<110){
    const st=lightFor(v.ni,v.nj,v.dir);
    if(st==='red') holding=true;
    else if(st==='amber') holding = stopDist > Math.abs(v.vf)*0.52;
    else if(st==='stop'){
      const key=v.ni+','+v.nj;
      if(v.stopNode!==key){
        holding=true;
        if(stopDist<4 && Math.abs(v.vf)<7){
          v.stopWait=(v.stopWait||0)+dt;
          if(v.stopWait>0.55){ v.stopNode=key; v.stopWait=0; holding=false; }
        }
      }
    }
  }
  if(holding) target=Math.min(target, Math.max(0, stopDist*2.2));

  const cb=crossingBlock(v);
  if(cb) target=Math.min(target, Math.max(0,(cb-10)*2.2));

  const blockDist=pathBlocked(v);
  if(blockDist){ target=Math.min(target, Math.max(0,(blockDist-15)*3.0)); }

  if(v.vf<target){ v.throttle=1; v.brake=0; }
  else { v.throttle=0; v.brake=v.vf>target*1.12?0.75:0; }
  v.hand=false;

  /* indicate for the turn ahead */
  v.indicate = (v.signal && along<86) ? v.signal : 0;
  if(v.indicate) v.blink=(v.blink||0)+dt;

  /* leaning on the horn when someone dawdles in front */
  if(blockDist && blockDist<22 && Math.abs(v.vf)<10){
    v.honkT=(v.honkT||0)+dt;
    if(v.honkT>1.6 && !holding && !cb){ v.honkT=-rr(2,5); v.honk=0.5; Audio0.horn(v.x,v.y,v.type); }
  } else v.honkT=0;
  if(v.honk>0) v.honk-=dt;

  if(v.vf<5 && target<6 && !holding && !cb) v.stuck+=dt; else v.stuck=Math.max(0,v.stuck-dt*0.7);
  if(v.stuck>3.2){ v.throttle=-1; v.steer=v.turnSign||0.6; if(v.stuck>4.2) v.stuck=0; }
}
/* --------------------------- wanted & pursuit ---------------------------- */
/* The search zone is the ring on the minimap showing where they last had eyes
   on you. Police behavior follows the current wanted level, while crime pressure
   itself fades as incidents age out of the rolling window. */
const search = { active:false, x:0, y:0, r:0, t:0, flash:0 };
const spikes = [];
const cops = [];

/* -------------------------------------------------------------------------
   CRIME WEIGHT / POINT ACCUMULATION
   -------------------------------------------------------------------------
   Crimes no longer map 1:1 to stars. Every incident has a severity weight,
   incidents remain relevant for a rolling window, and repeating the same
   offense inside that window compounds its contribution. This makes a
   one-off minor offense different from a sustained violent spree.
*/
const CRIME_WINDOW = 24;
const CRIME_REPEAT_BONUS = 0.28;
const CRIME_REPEAT_CAP = 5;
const HEAT_THRESHOLDS = [0,3,7,13,21,32,46]; /* 6 wanted levels */
const crimeEvents = [];
const CRIME_POINTS = Object.freeze({
  FIREARM_DISCHARGE: 1.25,
  ASSAULT_CIVILIAN: 1.10,
  HOMICIDE_CIVILIAN: 5.00,
  HOMICIDE_GANG: 3.80,
  VEHICULAR_INJURY: 1.00,
  VEHICULAR_HOMICIDE: 5.50,
  PROPERTY_DAMAGE: 0.90,
  VEHICLE_DAMAGE: 0.85,
  POLICE_VEHICLE_HIT: 1.80,
  OFFICER_ASSAULT: 2.50,
  OFFICER_HOMICIDE: 8.00,
  ROBBERY_START: 1.75,
  ROBBERY_COMPLETE: 5.00,
  ROBBERY_PRESSURE: 0.22,
  CARJACK: 2.50,
  POLICE_CARJACK: 7.00,
  WINDOW_SMASH: 1.00,
  HOTWIRE: 0.65,
  CARJACK_FAIL: 1.25,
  MISSION_PURSUIT: 3.00
});

function pruneCrimeEvents(t=now){
  const cutoff=t-CRIME_WINDOW;
  while(crimeEvents.length && crimeEvents[0].t<cutoff) crimeEvents.shift();
}
function crimePressure(t=now){
  pruneCrimeEvents(t);
  let total=0;
  for(const e of crimeEvents){
    const age=Math.max(0,t-e.t);
    const freshness=clamp(1-age/CRIME_WINDOW,0,1);
    total += e.points*freshness;
  }
  return clamp(total,0,HEAT_THRESHOLDS[HEAT_THRESHOLDS.length-1]-0.001);
}
function updateCrimePressure(){
  player.heat=crimePressure();
  return player.heat;
}
function crimeLevelForPressure(p){
  let level=0;
  for(let i=1;i<HEAT_THRESHOLDS.length;i++) if(p>=HEAT_THRESHOLDS[i]) level=i;
  return level;
}
function wantedLevel(){
  return crimeLevelForPressure(player.heat);
}
function commitCrime(kind,scale=1,label){
  const base=CRIME_POINTS[kind]===undefined ? 1 : CRIME_POINTS[kind];
  const points=Math.max(0,base*scale);
  if(points<=0) return 0;
  pruneCrimeEvents();

  const repeats=crimeEvents.reduce((n,e)=>n+(e.kind===kind?1:0),0);
  const repeatMult=1+Math.min(CRIME_REPEAT_CAP,repeats)*CRIME_REPEAT_BONUS;
  const finalPoints=points*repeatMult;
  const before=wantedLevel();
  crimeEvents.push({t:now,kind,points:finalPoints});
  player.heat=crimePressure();
  const after=wantedLevel();

  if(after>before){
    Audio0.blip(880,0.1,'square',0.12);
    setTimeout(()=>Audio0.blip(660,0.14,'square',0.12),90);
    float(player.x,player.y-28,'WANTED '+after,PAL.bad);
  } else if(label && finalPoints>=2.5){
    float(player.x,player.y-28,label,PAL.bad);
  }
  return finalPoints;
}
function clearCrimeLedger(){
  crimeEvents.length=0;
  player.heat=0;
}
function reduceCrimePressure(points){
  let left=Math.max(0,points);
  pruneCrimeEvents();
  for(let i=0;i<crimeEvents.length && left>0;i++){
    const e=crimeEvents[i];
    const take=Math.min(e.points,left);
    e.points-=take;
    left-=take;
  }
  for(let i=crimeEvents.length-1;i>=0;i--) if(crimeEvents[i].points<=0.001) crimeEvents.splice(i,1);
  updateCrimePressure();
}
function copSightRange(){
  let r = 200 + wantedLevel()*28;
  if(weather.kind==='fog') r*=0.5;
  else if(weather.kind==='storm') r*=0.74;
  else if(weather.kind==='rain') r*=0.86;
  if(darknessNow()>0.5) r*=0.8;
  if(!player.onFoot && player.car && player.car.speed<6) r*=0.85;
  return r;
}
function copCanSee(x,y){
  const r=copSightRange();
  if(dist2(x,y,player.x,player.y) > r*r) return false;
  return lineClear(x,y,player.x,player.y);
}
function updateSearch(dt){
  if(wantedLevel()<=0){ search.active=false; search.r=0; return; }
  let spotted=false;
  for(const v of vehicles){ if(v.mode==='police' && !v.wrecked && copCanSee(v.x,v.y)){ spotted=true; break; } }
  if(!spotted) for(const c of cops){ if(dist2(c.x,c.y,player.x,player.y)<170*170 && lineClear(c.x,c.y,player.x,player.y)){ spotted=true; break; } }
  search.spotted=spotted;
  const w=wantedLevel();
  const baseR=[0,88,102,120,142,165,188][Math.min(6,w)];
  const maxR=[0,150,185,225,270,320,380][Math.min(6,w)];
  if(spotted){
    search.active=true; search.x=player.x; search.y=player.y; search.t=0;
    search.r = lerp(search.r || baseR, baseR, 1-Math.pow(0.02,dt));
  } else if(search.active){
    search.t+=dt;
    search.r = Math.min(maxR, search.r + dt*(12+w*4));
  }
  search.flash=(search.flash+dt*2.6)%1;
}
function inSearchZone(){
  return search.active && dist2(player.x,player.y,search.x,search.y) < search.r*search.r;
}

function aiPolice(v,dt){
  v.lightPhase+=dt*9;
  if(v.driverOut){                                   /* officer is out on foot */
    v.throttle=0; v.brake=1; v.steer=0; v.hand=true;
    return;
  }
  const w=wantedLevel();
  const seeing = copCanSee(v.x,v.y);
  let px, py;
  if(seeing){ px=player.x; py=player.y; v.blindT=0; }
  else if(search.active){
    /* sweep around the last known position instead of magically homing in */
    v.sweepA = (v.sweepA===undefined? rnd()*TAU : v.sweepA + dt*0.7);
    v.blindT=(v.blindT||0)+dt;
    px = search.x + Math.cos(v.sweepA)*search.r*0.55;
    py = search.y + Math.sin(v.sweepA)*search.r*0.55;
  } else { px=player.x; py=player.y; }

  const dd=dist(v.x,v.y,px,py);
  v.hand=false;

  /* bail out whenever they get close; arrests are handled by the on-foot cop */
  if(w>=1 && seeing && !v.driverOut && cops.length<6){
    const dp=dist(v.x,v.y,player.x,player.y);
    if(dp<88){
      v.nearT=(v.nearT||0)+dt;
      if(v.nearT>1.15){ deployCop(v); v.nearT=0; }
    } else v.nearT=0;
  } else v.nearT=0;

  /* drop a spike strip up the road at three stars and above */
  if(w>=3 && !player.onFoot && player.car && seeing && spikes.length<3){
    v.spikeT=(v.spikeT||rr(6,14))-dt;
    if(v.spikeT<=0 && dist(v.x,v.y,player.x,player.y)<340){ layStrip(); v.spikeT=rr(11,20); }
  }

  if(seeing && dd<220 && lineClear(v.x,v.y,px,py)){
    /* ---------------------------------------------------------------
       Car chases use positioning, not bumper-seeking. Police try to
       get alongside or pull ahead and then hold that position. A direct
       ram is an explicit tactic only at 5-6 stars.
       --------------------------------------------------------------- */
    if(!player.onFoot && player.car && !player.car.wrecked){
      const c=player.car;
      const pc=Math.cos(c.a), ps=Math.sin(c.a);
      const sideX=-ps, sideY=pc;
      const pspd=c.speed;
      const dp=dist(v.x,v.y,c.x,c.y);
      const relX=v.x-c.x, relY=v.y-c.y;
      const relForward=relX*pc+relY*ps;
      const relSide=relX*sideX+relY*sideY;

      /* Pick a positioning maneuver every few seconds. The maneuver is
         deliberately biased toward the player's front/side instead of the rear. */
      v.maneuverT=(v.maneuverT||0)-dt;
      if(v.maneuverT<=0 || !v.maneuver){
        const frontGap=54+clamp(pspd*0.28,0,28);
        if(relForward>34 && Math.abs(relSide)<30){
          v.maneuver=rnd()<0.5?'sideL':'sideR';
        } else if(Math.abs(relSide)>42){
          v.maneuver='front';
        } else {
          const roll=rnd();
          v.maneuver=roll<0.48?'front':(roll<0.74?'sideL':'sideR');
        }
        v.maneuverT=rr(2.4,4.2);
        if(w>=5 && !v.ramCooldown && rnd() < (w>=6?0.32:0.18)){
          v.maneuver='ram';
          v.ramPhase='approach';
          v.ramT=rr(3.5,5.5);
          v.maneuverT=v.ramT;
        }
      }

      let tx,ty,targetSpeed;
      const frontGap=54+clamp(pspd*0.28,0,28);
      const sideGap=34+clamp(pspd*0.12,0,12);
      if(v.maneuver==='ram' && w>=5){
        /* Ram sequence: first shed speed, then make a short controlled lunge. */
        v.ramT=(v.ramT||4.5)-dt;
        if(v.ramPhase==='approach'){
          tx=c.x+pc*52; ty=c.y+ps*52;
          targetSpeed=Math.max(30,Math.min(v.cruise,pspd+4));
          if(dp<78){
            targetSpeed=Math.min(targetSpeed,Math.max(22,pspd*0.60));
            v.brake = v.vf>targetSpeed ? 1 : 0.25;
            if(v.vf<=targetSpeed+4) v.ramPhase='lunge';
          }
          if(v.ramT<=0) v.maneuver='front';
        }
        if(v.ramPhase==='lunge'){
          tx=c.x; ty=c.y;
          targetSpeed=Math.max(48,pspd+18);
          v.brake=0;
          v.throttle=1;
          v.ramLungeT=(v.ramLungeT||0.72)-dt;
          if(dp<28 || v.ramLungeT<=0){
            v.ramCooldown=rr(4.5,7.5);
            v.maneuver='front';
            v.maneuverT=rr(1.8,3.2);
            v.ramPhase=null; v.ramLungeT=0;
          }
        }
      }
      if(v.ramCooldown) v.ramCooldown=Math.max(0,v.ramCooldown-dt);

      if(v.maneuver!=='ram'){
        if(v.maneuver==='front'){
          tx=c.x+pc*frontGap;
          ty=c.y+ps*frontGap;
          /* Once the cop has made the pass, match speed instead of clipping
             the player's rear bumper. */
          targetSpeed = relForward < frontGap ? Math.min(v.cruise,pspd+18) : Math.max(24,pspd-4);
        } else {
          const sg=v.maneuver==='sideL'? -sideGap : sideGap;
          tx=c.x+pc*10+sideX*sg;
          ty=c.y+ps*10+sideY*sg;
          targetSpeed=Math.max(24,Math.min(v.cruise,pspd+8));
        }

        /* Hard close-range guard: ordinary pursuit cars brake rather than
           converting a chase into an accidental rear-end hit. */
        if(dp<36){
          targetSpeed=Math.min(targetSpeed,Math.max(18,pspd*0.72));
          if(v.vf>targetSpeed+3) v.brake=1;
        }
      }

      const want=Math.atan2(ty-v.y,tx-v.x);
      const df=angDiff(v.a,want);
      v.steer=clamp(df*2.55,-1,1);
      v.brake = Math.max(v.brake||0, v.vf>targetSpeed*1.12 ? 0.75 : 0);
      if(v.brake>0.8) v.throttle=0;
      else if(v.vf<targetSpeed) v.throttle=1;
      else v.throttle=0;

      /* Keep side/front formations from parking on the player's exact path. */
      if(v.maneuver!=='ram' && dp<24){
        const away=angDiff(v.a,Math.atan2(v.y-c.y,v.x-c.x));
        v.steer=clamp(away*2.2,-1,1);
        v.brake=1;
        v.throttle=0;
      }

      v.ni=nearestNodeI(v.x); v.nj=nearestNodeJ(v.y);
      v.plannedDir=null;
    } else {
      /* On foot, close directly so the officer can deploy and arrest the player. */
      const want=Math.atan2(py-v.y,px-v.x);
      const df=angDiff(v.a,want);
      v.steer=clamp(df*2.6,-1,1);
      const target=player.onFoot ? 58 : v.cruise;
      v.throttle=v.vf<target?1:0;
      v.brake=v.vf>target*1.15?0.6:0;
      v.ni=nearestNodeI(v.x); v.nj=nearestNodeJ(v.y);
      v.plannedDir=null;
    }
  } else {
    const tx0=nodeX(v.ni), ty0=nodeY(v.nj);
    const d=DIRS[v.dir];
    const along=(tx0-v.x)*d[0]+(ty0-v.y)*d[1];
    if(along<14) advanceNodeToward(v,px,py);
    const off=laneOffset(v.dir,1);
    const want=Math.atan2(ty0+off[1]*0.4-v.y, tx0+off[0]*0.4-v.x);
    const df=angDiff(v.a,want);
    v.steer=clamp(df*2.5,-1,1);
    const blockDist=pathBlocked(v);
    let target=v.cruise*(seeing?1:0.8);
    if(blockDist && blockDist<18) target=Math.max(0,(blockDist-12)*3);
    if(Math.abs(df)>0.6) target*=0.55;
    v.throttle=v.vf<target?1:0;
    v.brake=v.vf>target*1.15?0.6:0;
  }
  if(v.vf<5) v.stuck+=dt; else v.stuck=Math.max(0,v.stuck-dt);
  if(v.stuck>2.6){ v.throttle=-1; v.steer=v.turnSign||0.6; if(v.stuck>4.2) v.stuck=0; }

  /* return fire from the car at four stars once they're alongside */
  if(w>=4 && seeing && !player.onFoot){
    v.fireT=(v.fireT||rr(0.6,1.8))-dt;
    const dp=dist(v.x,v.y,player.x,player.y);
    if(v.fireT<=0 && dp<170){
      v.fireT=rr(0.5,1.2);
      copShoot(v.x,v.y, player.x, player.y, v.type==='army'?16:10, 0.12);
    }
  }
}

/* a strip laid across the road just ahead of where the player is heading */
function layStrip(){
  const c=player.car; if(!c) return;
  const ahead = 150 + c.speed*0.9;
  let tx = c.x + Math.cos(c.a)*ahead, ty = c.y + Math.sin(c.a)*ahead;
  tx=clamp(tx,ROAD,WORLD-ROAD); ty=clamp(ty,ROAD,WORLD-ROAD);
  /* snap onto the nearest carriageway and lie across it */
  const i=nearestNodeI(tx), j=nearestNodeJ(ty);
  const dxr=Math.abs(tx-nodeX(i)), dyr=Math.abs(ty-nodeY(j));
  let sx,sy,sa;
  if(dxr<dyr){ sx=nodeX(i); sy=ty; sa=Math.PI/2; }
  else { sx=tx; sy=nodeY(j); sa=0; }
  spikes.push({x:sx,y:sy,a:sa,life:16,armed:1});
  float(sx,sy-16,'SPIKES AHEAD',PAL.bad);
  Audio0.blip(210,0.18,'square',0.1);
}
function updateSpikes(dt){
  for(let i=spikes.length-1;i>=0;i--){
    const s=spikes[i];
    s.life-=dt;
    if(s.life<=0 || dist2(s.x,s.y,player.x,player.y)>900*900){ spikes.splice(i,1); continue; }
    if(!s.armed) continue;
    const half=ROAD*0.5;
    for(const v of vehicles){
      if(v.wrecked || v.type==='moto' && v!==player.car) continue;
      const dx=v.x-s.x, dy=v.y-s.y;
      const along = s.a===0 ? dy : dx;
      const across = s.a===0 ? dx : dy;
      if(Math.abs(along)<5 && Math.abs(across)<half && v.speed>18){
        if(v===player.car){
          if(player.flats<2){
            player.flats=Math.min(2,player.flats+1+(v.speed>90?1:0));
            setBanner('TYRES SHREDDED','Find a garage',PAL.bad);
            shake(6); Audio0.tirePop();
            for(let k=0;k<3;k++) sparks(v.x+rr(-6,6),v.y+rr(-6,6),5);
          }
        } else if(v.mode==='traffic'){
          v.flat=true; v.cruise*=0.55;
        }
        s.armed=0;
        break;
      }
    }
  }
}
function lineClear(x0,y0,x1,y1){
  const steps=6;
  for(let k=1;k<=steps;k++){
    const t=k/steps, x=lerp(x0,x1,t), y=lerp(y0,y1,t);
    blocksNear(x,y,2,_bl);
    for(const b of _bl) for(const bd of b.buildings)
      if(x>bd.x&&x<bd.x+bd.w&&y>bd.y&&y<bd.y+bd.h) return false;
  }
  return true;
}

/* ---------------------------- pedestrians -------------------------------- */
const peds=[];
const PED_COLORS=['#d8d2c4','#e0a37a','#8a6f5a','#c4c9d6','#a8b8c8','#d69a9a','#9ad6b0','#e8d78a'];
const GANGS=[
  {name:'VIPERS', col:'#3f9e5a', skin:'#2f7a44'},
  {name:'KINGS',  col:'#8c53b5', skin:'#6b3f8c'},
  {name:'ROJOS',  col:'#c4423a', skin:'#96322c'}
];
class Ped{
  constructor(b,gang){
    this.blk=b; this.corner=ri(0,3); this.rev = rnd()<0.5?-1:1;
    const p=this.ringPoint(this.corner);
    this.x=p[0]; this.y=p[1];
    this.speed=rr(11,19); this.a=0; this.state='walk'; this.t=0;
    this.col=pick(PED_COLORS); this.shirt=pick(['#3f6fb0','#b04f4f','#4fb06f','#b0a04f','#7f4fb0','#2f2f3f','#c47a3a']);
    this.bob=rnd()*TAU; this.down=0; this.alert=0;
    this.tx=this.x; this.ty=this.y;
    this.hp=34; this.cash=ri(4,38); this.seed=ri(0,999);
    this.gang = gang||null;
    if(this.gang){ this.shirt=this.gang.col; this.hp=56; this.cash=ri(30,110); this.speed=rr(14,21); this.armed=rnd()<0.5; }
    this.nextCorner();
  }
  ringPoint(k){
    const b=this.blk, m=5;
    const x0=b.x+m, y0=b.y+m, x1=b.x+b.w-m, y1=b.y+b.h-m;
    return [[x0,y0],[x1,y0],[x1,y1],[x0,y1]][((k%4)+4)%4];
  }
  nextCorner(){
    if(rnd()<0.08) this.rev*=-1;
    this.corner=((this.corner+this.rev)%4+4)%4;
    const p=this.ringPoint(this.corner);
    const jitter=rr(-3,3);
    this.tx=p[0]+jitter; this.ty=p[1]+jitter;
  }
  startCross(){
    const b=this.blk;
    const side=ri(0,3);
    const ni=b.i+DIRS[side][0], nj=b.j+DIRS[side][1];
    const k=blockIdx(ni,nj); if(k<0){ return; }
    const nb=city.blocks[k];
    this.state='cross'; this.crossTo=nb;
    this.tx = clamp(this.x, nb.x+6, nb.x+nb.w-6);
    this.ty = clamp(this.y, nb.y+6, nb.y+nb.h-6);
    if(side===0) this.tx=nb.x+6; else if(side===2) this.tx=nb.x+nb.w-6;
    if(side===1) this.ty=nb.y+6; else if(side===3) this.ty=nb.y+nb.h-6;
  }
  update(dt){
    if(this.state==='dead'){ this.deadT=(this.deadT||0)+dt; return; }
    this.bob+=dt*6;
    if(this.alert>0) this.alert-=dt;
    if(this.state==='down'){
      this.down-=dt;
      if(this.down<=0){ this.state='walk'; this.nextCorner(); }
      return;
    }
    /* dodge cars */
    const list=nearVehicles(this.x,this.y,42);
    let fear=null, fd=1e9;
    for(const v of list){
      if(v.speed<14) continue;
      const d2=dist2(v.x,v.y,this.x,this.y);
      if(d2<34*34 && d2<fd){
        const dx=this.x-v.x, dy=this.y-v.y;
        const f=dx*Math.cos(v.a)+dy*Math.sin(v.a);
        if(f>-6){ fear=v; fd=d2; }
      }
    }
    if(fear){
      if(this.state!=='panic'){ this.state='panic'; this.t=rr(0.8,1.6); this.alert=1.1; }
      const dx=this.x-fear.x, dy=this.y-fear.y, l=Math.hypot(dx,dy)||1;
      const px=-Math.sin(fear.a), py=Math.cos(fear.a);
      const s=sign(dx*px+dy*py)||1;
      this.tx=this.x+(px*s*26+dx/l*14); this.ty=this.y+(py*s*26+dy/l*14);
    } else if(this.state==='panic' && this.flee){
      /* running from gunfire rather than a bumper */
      const dx=this.x-this.flee.x, dy=this.y-this.flee.y, l=Math.hypot(dx,dy)||1;
      this.tx=this.x+dx/l*40; this.ty=this.y+dy/l*40;
    }
    if(this.state==='panic'){ this.t-=dt; if(this.t<=0 && !fear){ this.state='walk'; this.flee=null; this.snapBlock(); this.nextCorner(); } }
    if(this.state==='walk' && rnd()<0.0016) this.startCross();

    const dx=this.tx-this.x, dy=this.ty-this.y, d=Math.hypot(dx,dy);
    const sp=this.speed*(this.state==='panic'?2.3:(this.state==='cross'?1.5:1));
    const ox=this.x, oy=this.y;
    if(d>1.2){
      this.x+=dx/d*sp*dt; this.y+=dy/d*sp*dt;
      this.a=Math.atan2(dy,dx);
    } else {
      if(this.state==='cross'){ this.blk=this.crossTo; this.state='walk'; this.snapBlock(); this.nextCorner(); }
      else if(this.state==='walk') this.nextCorner();
    }
    this.pushOut(ox,oy);
  }
  /* walls are walls - walk around them, not through them */
  pushOut(ox,oy){
    blocksNear(this.x,this.y,5,_bl);
    for(const b of _bl) for(const bd of b.buildings){
      if(this.x>bd.x-1.5 && this.x<bd.x+bd.w+1.5 && this.y>bd.y-1.5 && this.y<bd.y+bd.h+1.5){
        const dl=this.x-(bd.x-1.5), dr=(bd.x+bd.w+1.5)-this.x;
        const dt2=this.y-(bd.y-1.5), db=(bd.y+bd.h+1.5)-this.y;
        const m=Math.min(dl,dr,dt2,db);
        if(m===dl) this.x=bd.x-1.5; else if(m===dr) this.x=bd.x+bd.w+1.5;
        else if(m===dt2) this.y=bd.y-1.5; else this.y=bd.y+bd.h+1.5;
        /* wedged against a wall: pick a fresh destination rather than grinding */
        if(dist2(this.x,this.y,ox,oy)<0.02){
          this.wedge=(this.wedge||0)+1;
          if(this.wedge>10){
            this.x=ox; this.y=oy; this.wedge=0;
            this.corner=(this.corner+1)%4;
            this.nextCorner();
          }
        } else this.wedge=0;
      }
    }
    for(const t of (this.blk.trees||[])){
      const dx=this.x-t.x, dy=this.y-t.y, d2=dx*dx+dy*dy, rr0=t.r*0.55;
      if(d2<rr0*rr0 && d2>0.001){ const d=Math.sqrt(d2); this.x=t.x+dx/d*rr0; this.y=t.y+dy/d*rr0; }
    }
  }
  snapBlock(){
    const b=this.blk;
    this.x=clamp(this.x,b.x+3,b.x+b.w-3); this.y=clamp(this.y,b.y+3,b.y+b.h-3);
    let best=0,bd=1e9;
    for(let k=0;k<4;k++){ const p=this.ringPoint(k), d=dist2(p[0],p[1],this.x,this.y); if(d<bd){bd=d;best=k;} }
    this.corner=best;
  }
  knock(v){
    if(this.state==='down'||this.state==='dead') return;
    const spd=Math.hypot(v.vx,v.vy);
    const l=spd||1;
    this.x+=v.vx/l*7; this.y+=v.vy/l*7;
    if(spd>72){                                  /* hit hard enough to be fatal */
      this.a=Math.atan2(v.vy,v.vx);
      killPed(this, v===player.car, true);
      return;
    }
    this.state='down'; this.down=rr(2,3.4); this.alert=1.4;
    this.hp-=spd*0.34;
    addBlood(this.x,this.y,3);
    puff(this.x,this.y,'#d8d2c4',8);
    if(this.hp<=0){ this.a=Math.atan2(v.vy,v.vx); killPed(this, v===player.car, true); }
  }
}
function hurtPed(p,dmg,ang,byPlayer){
  if(p.state==='dead') return;
  p.hp-=dmg;
  p.alert=1.8;
  addBlood(p.x,p.y,4);
  if(p.state!=='panic'){ p.state='panic'; p.t=rr(2.4,4); p.flee={x:player.x,y:player.y}; }
  if(ang!==undefined){ p.x+=Math.cos(ang)*1.6; p.y+=Math.sin(ang)*1.6; }
  if(p.hp<=0){ p.a=ang===undefined?p.a:ang; killPed(p, !!byPlayer, false); }
  else if(byPlayer) commitCrime('ASSAULT_CIVILIAN');
}
function killPed(p, byPlayer, byCar){
  if(p.state==='dead') return;
  p.state='dead'; p.deadT=0;
  addBlood(p.x,p.y, byCar?14:9, true);
  Audio0.thud(byCar);
  if(byPlayer){
    player.kills++;
    commitCrime(byCar ? 'VEHICULAR_HOMICIDE' : (p.gang?'HOMICIDE_GANG':'HOMICIDE_CIVILIAN'));
    addScore(p.gang?120:45, p.gang?'GANG DOWN':'DOWN');
    if(p.cash>0) dropCash(p.x,p.y,p.cash);
    if(p.armed && rnd()<0.6) dropAmmo(p.x,p.y,'PISTOL',ri(6,14));
    float(p.x,p.y-14, byCar?'HIT AND RUN':'DOWN', PAL.bad);
    /* witnesses call it in */
    scarePedsNear(p.x,p.y,110);
  }
  if(mission && mission.type==='HITMAN' && mission.mark===p){ mission.markDead=true; }
}

/* ------------------------------- cops on foot ---------------------------- */
class Cop{
  constructor(car){
    this.car=car;
    const off=car.h/2+6;
    this.x=car.x-Math.sin(car.a)*off; this.y=car.y+Math.cos(car.a)*off;
    this.a=car.a; this.hp=64; this.state='chase'; this.fireT=rr(0.5,1.2);
    this.walkT=0; this.speed=rr(30,38); this.seed=ri(0,999); this.swat=car.type!=='police';
    if(this.swat) this.hp=110;
  }
  update(dt){
    const dp=dist(this.x,this.y,player.x,player.y);
    const carD=this.car?dist(this.x,this.y,this.car.x,this.car.y):1e9;
    const w=wantedLevel();

    /* chasing on foot only works while the target is in reach of the car */
    if(this.state==='chase' && this.car && !this.car.wrecked && (carD>150 || (dp>190 && carD>80))) this.state='return';
    if(this.state==='return' && dp<70 && carD<40) this.state='chase';

    let tx,ty;
    if(this.state==='return'){
      if(!this.car || this.car.wrecked){ this.state='chase'; tx=player.x; ty=player.y; }
      else {
        tx=this.car.x; ty=this.car.y;
        if(carD<9){ this.car.driverOut=false; this.car.nearT=0; this.dead=true; return; }
      }
    } else { tx=player.x; ty=player.y; }

    const dx=tx-this.x, dy=ty-this.y, d=Math.hypot(dx,dy)||1;
    const hold = this.state==='chase' && w>=3 && dp<95 && lineClear(this.x,this.y,player.x,player.y);
    const sp = this.state==='return' ? this.speed*1.25 : (hold? this.speed*0.25 : this.speed);
    this.x+=dx/d*sp*dt; this.y+=dy/d*sp*dt;
    this.a=Math.atan2(dy,dx);
    this.walkT+=dt*(sp/9);

    /* don't walk through walls either */
    blocksNear(this.x,this.y,5,_bl);
    for(const b of _bl) for(const bd of b.buildings){
      if(this.x>bd.x-2&&this.x<bd.x+bd.w+2&&this.y>bd.y-2&&this.y<bd.y+bd.h+2){
        const dl=this.x-(bd.x-2), dr=(bd.x+bd.w+2)-this.x, dt2=this.y-(bd.y-2), db=(bd.y+bd.h+2)-this.y;
        const m=Math.min(dl,dr,dt2,db);
        if(m===dl)this.x=bd.x-2; else if(m===dr)this.x=bd.x+bd.w+2;
        else if(m===dt2)this.y=bd.y-2; else this.y=bd.y+bd.h+2;
      }
    }

    if(this.state==='chase'){
      if(w<=2 && player.heat>0){
        if(player.onFoot){
          if(dp<20 && lineClear(this.x,this.y,player.x,player.y)) this.bustT=(this.bustT||0)+dt; else this.bustT=0;
          if(this.bustT>3.0){ busted(); return; }
        } else if(dp<22 && lineClear(this.x,this.y,player.x,player.y)){
          this.pullT=(this.pullT||0)+dt;
          if(this.pullT>1.35){
            const car=player.car; if(car){
              player.onFoot=true; player.x=car.x-Math.sin(car.a)*(car.h/2+8); player.y=car.y+Math.cos(car.a)*(car.h/2+8); player.a=car.a;
              car.mode='parked'; car.parked=true; car.engineOn=false; car.throttle=0; car.brake=1;
              Audio0.engine(0,0); float(player.x,player.y,'PULLED OUT',PAL.bad);
            }
            this.pullT=0; this.bustT=0;
          }
        } else this.pullT=0;
      } else if(w>=3 && dp<135 && lineClear(this.x,this.y,player.x,player.y)){
        this.fireT-=dt;
        if(this.fireT<=0){
          this.fireT=rr(0.45,1.05);
          copShoot(this.x,this.y,player.x,player.y, this.swat?15:11, 0.10);
          this.muzzle=0.07;
        }
      }
    }
    if(this.muzzle>0) this.muzzle-=dt;
  }
}
function deployCop(v){
  v.driverOut=true;
  const c=new Cop(v);
  cops.push(c);
  float(v.x,v.y-16,'OUT OF THE CAR!',PAL.bad);
  Audio0.blip(300,0.1,'square',0.08);
}
function killCop(c){
  addBlood(c.x,c.y,12,true);
  addScore(160,'OFFICER DOWN');
  commitCrime('OFFICER_HOMICIDE');
  if(c.car) c.car.driverOut=false;
  dropAmmo(c.x,c.y, c.swat?'SMG':'PISTOL', ri(8,20));
  const i=cops.indexOf(c); if(i>=0) cops.splice(i,1);
  Audio0.thud(false);
}
function updateCops(dt){
  for(let i=cops.length-1;i>=0;i--){
    const c=cops[i];
    c.update(dt);
    if(c.dead || dist2(c.x,c.y,player.x,player.y)>900*900){
      if(c.car) c.car.driverOut=false;
      cops.splice(i,1);
    }
  }
}

/* --------------------------- destructible props -------------------------- */
function hurtProp(pr,dmg,vx,vy,byPlayer){
  if(pr.down) return;
  pr.hp-=dmg;
  const k=pr.k;
  if(k.glass && rnd()<0.6) addDebris(pr.x,pr.y,'#bfe0ff',3,60);
  if(pr.hp>0){
    pr.shake=0.25;
    Audio0.thunk(k.r);
    return;
  }
  pr.down=1; pr.vx=vx*0.5; pr.vy=vy*0.5; pr.spin=rr(-7,7);
  if(byPlayer) commitCrime('PROPERTY_DAMAGE',Math.max(0.6,k.r/4.5));
  const pts=k.pts;
  if(byPlayer) addScore(pts, 'SMASH');
  addDebris(pr.x,pr.y,k.col, Math.min(14,4+Math.round(k.r*1.6)), 40+k.r*9);
  if(k.glass) addDebris(pr.x,pr.y,'#bfe0ff',6,90);
  if(k.litter) for(let i=0;i<5;i++) addDebris(pr.x,pr.y,pick(['#b8b3ac','#8a7350','#6a6a6a']),1,70);
  if(k.straw) addDebris(pr.x,pr.y,'#e0c877',10,70);
  if(k.splinter) addDebris(pr.x,pr.y,'#a38a63',8,80);
  if(k.cash) for(let i=0;i<2;i++) dropCash(pr.x+rr(-6,6),pr.y+rr(-6,6),ri(3,12));
  if(k.spray){ pr.spray=6; }
  if(k.boom){ explode(pr.x,pr.y, k.boom>1?58:30, k.boom>1?90:44); }
  else Audio0.crash(clamp(k.r*0.05,0.06,0.3));
}
function explode(x,y,radius,dmg){
  burst(x,y,26,'#ffb020',150);
  burst(x,y,16,'#ff4b3e',110);
  burst(x,y,10,'#3a3a3a',60);
  addDebris(x,y,'#55524a',12,140);
  shake(dist(x,y,player.x,player.y)<200?7:3);
  Audio0.boom();
  for(const v of vehicles){
    const d=dist(v.x,v.y,x,y);
    if(d<radius){ const f=(1-d/radius); v.damage(dmg*f); const a=Math.atan2(v.y-y,v.x-x); v.vx+=Math.cos(a)*160*f; v.vy+=Math.sin(a)*160*f; }
  }
  for(const p of peds){
    const d=dist(p.x,p.y,x,y);
    if(d<radius && p.state!=='dead'){ hurtPed(p, dmg*(1-d/radius)*1.4, Math.atan2(p.y-y,p.x-x), true); }
  }
  for(const c of cops){
    const d=dist(c.x,c.y,x,y);
    if(d<radius){ c.hp-=dmg*(1-d/radius)*1.2; if(c.hp<=0) killCop(c); }
  }
  for(const pr of city.props){
    if(pr.down) continue;
    const d=dist(pr.x,pr.y,x,y);
    if(d<radius*0.8 && d>0.5) hurtProp(pr, dmg*(1-d/radius), (pr.x-x)*2, (pr.y-y)*2);
  }
  const dpl=dist(player.x,player.y,x,y);
  if(dpl<radius){
    const f=1-dpl/radius;
    if(player.onFoot){ player.hp-=dmg*f; if(player.hp<=0) wasted('BLAST'); }
    else if(player.car) player.car.damage(dmg*f*0.8);
  }
}
function updateProps(dt){
  for(const pr of city.props){
    if(!pr.down && !(pr.shake>0) && !(pr.spray>0)) continue;  /* most are untouched */
    if(pr.shake>0) pr.shake-=dt;
    if(pr.spray>0){
      pr.spray-=dt;
      if(rnd()<0.6) parts.push({x:pr.x,y:pr.y-2,vx:rr(-30,30),vy:rr(-70,-30),r:rr(1,2.2),gr:2,life:1,max:0.5,col:'#9fd8ff',type:1});
    }
    if(!pr.down) continue;
    if(pr.fade>0 && pr.down){
      pr.x+=pr.vx*dt; pr.y+=pr.vy*dt;
      pr.vx-=pr.vx*3.4*dt; pr.vy-=pr.vy*3.4*dt;
      pr.a+=pr.spin*dt; pr.spin-=pr.spin*2.6*dt;
      pr.fade-=dt*0.055;
      if(pr.fade<0) pr.fade=0;
    }
  }
}
/* vehicles ploughing through street furniture */
function plowProps(v,cx,cy,a,w,h,spd){
  const reach=Math.max(w,h)*0.6+8;
  const list=nearProps(cx,cy,reach);
  const c=Math.cos(a), sn=Math.sin(a);
  for(let n=0;n<list.length;n++){
    const pr=list[n];
    if(pr.down) continue;
    const dx=pr.x-cx, dy=pr.y-cy;
    const f=dx*c+dy*sn, l=-dx*sn+dy*c;
    if(Math.abs(f)<w/2+pr.k.r && Math.abs(l)<h/2+pr.k.r){
      if(pr.k.solid && spd<40){
        /* heavy stuff shoves back instead of flying */
        const d=Math.hypot(dx,dy)||1;
        v.vx-=dx/d*spd*0.34; v.vy-=dy/d*spd*0.34;
        v.damage(spd*0.06);
        hurtProp(pr, spd*0.5, v.vx*0.2, v.vy*0.2, v===player.car);
      } else {
        hurtProp(pr, spd*1.4, v.vx*0.55, v.vy*0.55, v===player.car);
        if(v===player.car){
          v.damage(pr.k.solid? spd*0.10 : spd*0.02);
          if(pr.k.solid) shake(2);
        }
      }
    }
  }
}
function propCollisions(){
  for(const v of vehicles){
    if(v.mode==='parked' && v.speed<4) continue;
    const spd=v.speed;
    if(spd<8) continue;
    plowProps(v,v.x,v.y,v.a,v.w,v.h,spd);
    if(hasTrailer(v)) plowProps(v,v.trailerX,v.trailerY,v.trailerA,v.spec.trailer.w,v.spec.trailer.h,spd);
  }
  /* player on foot bumping into solid furniture */
  if(player.onFoot){
    const list=nearProps(player.x,player.y,14);
    for(let n=0;n<list.length;n++){
      const pr=list[n];
      if(pr.down||!pr.k.solid) continue;
      const dx=player.x-pr.x, dy=player.y-pr.y, d2=dx*dx+dy*dy, r=pr.k.r+2;
      if(d2<r*r && d2>0.001){ const d=Math.sqrt(d2); player.x=pr.x+dx/d*r; player.y=pr.y+dy/d*r; }
    }
  }
}

function pedCollisions(){
  for(const p of peds){
    if(p.state==='down'||p.state==='dead') continue;
    const list=nearVehicles(p.x,p.y,26);
    for(const v of list){
      const dx=p.x-v.x, dy=p.y-v.y;
      const c=Math.cos(v.a), s=Math.sin(v.a);
      const f=dx*c+dy*s, l=-dx*s+dy*c;
      if(vehicleHitsPoint(v,p.x,p.y,3)){
        if(v.speed>18){
          const wasAlive = p.state!=='dead';
          p.knock(v);
          if(v===player.car && wasAlive){
            player.combo=0; player.comboT=0;
            if(p.state!=='dead'){ commitCrime('VEHICULAR_INJURY'); float(p.x,p.y-10,'WATCH OUT!',PAL.bad); Audio0.blip(160,0.16,'square',0.1); }
          }
        } else {
          const d=Math.hypot(dx,dy)||1; p.x+=dx/d*0.8; p.y+=dy/d*0.8;
        }
      }
    }
  }
}

function addSkid(x,y,a){ if(skids.length>520) skids.shift(); skids.push({x,y,a,life:1}); }
function float(x,y,text,col){ floats.push({x,y,text,col,life:1,vy:-16}); }
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){

  }
  for(let i=skids.length-1;i>=0;i--){ skids[i].life-=dt*0.045; if(skids[i].life<=0) skids.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.y+=f.vy*dt; f.vy+=26*dt; f.life-=dt*0.85; if(f.life<=0) floats.splice(i,1); }
}
