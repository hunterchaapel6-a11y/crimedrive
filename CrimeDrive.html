function drawBuildings(frontOnly){
  const ccx=cam.x, ccy=cam.y;
  const px = player.x, py=player.y;
  for(let j=Math.floor((VY-ROAD)/CELL)-1;j<=Math.ceil((VY+VH)/CELL);j++)
  for(let i=Math.floor((VX-ROAD)/CELL)-1;i<=Math.ceil((VX+VW)/CELL);i++){
    const k=blockIdx(i,j); if(k<0) continue;
    const b=city.blocks[k];
    for(const bd of b.buildings){
      if(!inView(bd.x+bd.w/2, bd.y+bd.h/2, Math.max(bd.w,bd.h)+70)) continue;
      const cx=bd.x+bd.w/2, cy=bd.y+bd.h/2;
      const lean = bd.hgt*0.62;
      let dx = clamp((cx-ccx)/(BW*0.5)*lean, -bd.w*0.48, bd.w*0.48);
      let dy = clamp((cy-ccy)/(BH*0.5)*lean, -bd.h*0.48, bd.h*0.48);
      const depthFront = (bd.y+bd.h) > py;
      if(frontOnly !== depthFront) continue;
      const hidePlayer = px>bd.x-3 && px<bd.x+bd.w+3 && py>bd.y-3 && py<bd.y+bd.h+3;
      bx.globalAlpha = hidePlayer?0.45:1;
      const x0=bd.x, y0=bd.y, x1=bd.x+bd.w, y1=bd.y+bd.h;
      const side=shade(bd.col,-0.28), side2=shade(bd.col,-0.12);
      /* ground contact shadow */
      bx.fillStyle='rgba(0,0,0,0.30)';
      bx.fillRect(x0-1,y0-1,bd.w+2,bd.h+2);
      /* 4 walls */
      quad(bx,x0,y0,x1,y0,x1+dx,y0+dy,x0+dx,y0+dy, dy>0?side2:side);
      quad(bx,x0,y1,x1,y1,x1+dx,y1+dy,x0+dx,y1+dy, dy<0?side2:side);
      quad(bx,x0,y0,x0,y1,x0+dx,y1+dy,x0+dx,y0+dy, dx>0?side2:side);
      quad(bx,x1,y0,x1,y1,x1+dx,y1+dy,x1+dx,y0+dy, dx<0?side2:side);
      /* windows, only on the two walls actually facing the camera */
      drawWindows(bd, x0,y0,x1,y0, dx,dy, dy<=0);
      drawWindows(bd, x0,y1,x1,y1, dx,dy, dy>=0);
      drawWindows(bd, x0,y0,x0,y1, dx,dy, dx<=0);
      drawWindows(bd, x1,y0,x1,y1, dx,dy, dx>=0);
      /* roof */
      bx.fillStyle=bd.top; bx.fillRect(x0+dx,y0+dy,bd.w,bd.h);
      bx.fillStyle=shade(bd.top,-0.16);
      bx.fillRect(x0+dx,y0+dy,bd.w,1); bx.fillRect(x0+dx,y0+dy,1,bd.h);
      bx.fillStyle=shade(bd.top,0.12);
      bx.fillRect(x0+dx+2,y0+dy+2,bd.w-4,1);
      /* roof details */
      const s=bd.seed;
      if(bd.w>26&&bd.h>22){
        bx.fillStyle=shade(bd.top,-0.3);
        bx.fillRect(x0+dx+6+(s%7), y0+dy+5+(s%5), 8, 6);
        bx.fillStyle=shade(bd.top,0.2);
        bx.fillRect(x0+dx+bd.w-14-(s%5), y0+dy+bd.h-12, 7, 5);
      }
      if(bd.garage){
        /* lit fascia so you can spot a mod shop from down the street */
        const sw=Math.min(bd.w-6, 54);
        const sx0=x0+dx+(bd.w-sw)/2, sy0=y0+dy+3;
        bx.fillStyle='#0d1220'; bx.fillRect(sx0, sy0, sw, 9);
        bx.fillStyle=PAL.neon; bx.fillRect(sx0, sy0, sw, 1.4); bx.fillRect(sx0, sy0+7.6, sw, 1.4);
        drawText(bx,'MOD SHOP', sx0+sw/2, sy0+2, 1, PAL.neon, 'center');
        /* roller shutter on the side the apron is on */
        const gs=bd.gside;
        bx.fillStyle='#2a303c';
        if(gs===0) bx.fillRect(x1-2, y0+bd.h*0.25, 3, bd.h*0.5);
        else if(gs===2) bx.fillRect(x0-1, y0+bd.h*0.25, 3, bd.h*0.5);
        else if(gs===1) bx.fillRect(x0+bd.w*0.25, y1-2, bd.w*0.5, 3);
        else bx.fillRect(x0+bd.w*0.25, y0-1, bd.w*0.5, 3);
        bx.fillStyle=PAL.amber;
        if(gs===0) bx.fillRect(x1-2, y0+bd.h*0.25, 3, 1);
        else if(gs===2) bx.fillRect(x0-1, y0+bd.h*0.25, 3, 1);
        else if(gs===1) bx.fillRect(x0+bd.w*0.25, y1-2, bd.w*0.5, 1);
        else bx.fillRect(x0+bd.w*0.25, y0+0, bd.w*0.5, 1);
      }
      if(bd.label){
        /* shop and service fascias */
        const sw=Math.min(bd.w-6, textW(bd.label,1)+12);
        const sx0=x0+dx+(bd.w-sw)/2, sy0=y0+dy+3;
        const sc0 = bd.service==='hospital'?'#ff4b3e' : bd.service==='police'?'#2b55ff'
                  : bd.shop==='jewel'?'#3ff2e0' : bd.shop==='weapon'?'#ff4b3e' : '#ffb020';
        bx.fillStyle='#0d1220'; bx.fillRect(sx0, sy0, sw, 9);
        bx.fillStyle=sc0; bx.fillRect(sx0, sy0, sw, 1.4); bx.fillRect(sx0, sy0+7.6, sw, 1.4);
        drawText(bx, bd.label, sx0+sw/2, sy0+2, 1, sc0, 'center');
      }
      bx.globalAlpha=1;
    }
  }
}
function drawWindows(bd,ax,ay,bx2,by2,dx,dy,skip){
  if(skip) return;
  if(Math.abs(dx)+Math.abs(dy)<4) return;
  const len=Math.hypot(bx2-ax,by2-ay);
  if(len<12) return;
  const n=clamp(Math.floor(len/10),1,5);
  const dark=darknessNow();
  for(let w=0;w<n;w++){
    const t0=(w+0.28)/n, t1=(w+0.72)/n;
    const p0x=lerp(ax,bx2,t0), p0y=lerp(ay,by2,t0);
    const p1x=lerp(ax,bx2,t1), p1y=lerp(ay,by2,t1);
    const lit = dark>0.25 && (((bd.seed+w*31)%10)<4);
    const col = lit ? (((bd.seed+w)%3)?'#ffd98a':'#bfe0ff') : 'rgba(30,34,44,0.55)';
    for(let row=0;row<2;row++){
      const a0=0.18+row*0.4, a1=0.42+row*0.4;
      quad(bx, p0x+dx*a0,p0y+dy*a0, p1x+dx*a0,p1y+dy*a0, p1x+dx*a1,p1y+dy*a1, p0x+dx*a1,p0y+dy*a1, col);
    }
  }
}

/* --------------------------- entity drawing ------------------------------- */
function drawVehicle(v, dk){
  const w=v.w, h=v.h;
  const cls=v.spec.cls;
  if(!inView(v.x,v.y,cls==='semi'?140:60)) return;

  /* semi trailers: solid box on its own axle, coupled to the truck's hook by a drawbar */
  if(cls==='semi'){
    syncTrailer(v);
    const tl=v.spec.trailer.w, th=v.spec.trailer.h;
    const tg = v.ghost===undefined?1:clamp(v.ghost,0,1);
    if(tg>0){
      bx.globalAlpha=tg;
      const tcx=v.trailerX, tcy=v.trailerY;
      bx.save(); bx.translate(tcx+2.5,tcy+3.5); bx.rotate(v.trailerA);
      bx.fillStyle='rgba(0,0,0,0.30)'; bx.fillRect(-tl/2,-th/2,tl,th); bx.fillRect(tl/2,-1,TR_GAP+1,2); bx.restore();
      bx.save(); bx.translate(tcx,tcy); bx.rotate(v.trailerA);
      bx.fillStyle='#15171c';
      for(const wx of [-tl*0.30,-tl*0.42]){ bx.fillRect(wx-2.5,-th/2-0.5,5,2); bx.fillRect(wx-2.5,th/2-1.5,5,2); }
      const tc = v.wrecked?'#3a3a40':(v.trailerCol||(v.trailerCol=pick(['#d9d2c4','#b8b3ac','#5a6272','#2fa6a0','#c4423a'])));
      bx.fillStyle=tc; bx.fillRect(-tl/2,-th/2,tl,th);
      bx.fillStyle=shade(tc,0.16); bx.fillRect(-tl/2+1,-th/2+1,tl-2,1.4);
      bx.fillStyle=shade(tc,-0.30); bx.fillRect(-tl/2+1,th/2-2.4,tl-2,1.4);
      bx.fillStyle=shade(tc,-0.18);
      for(let t=-tl/2+4;t<tl/2-2;t+=6) bx.fillRect(t,-th/2+1.6,1,th-3.2);
      bx.fillStyle= (v.brake>0.25||v.hand)?'#ff5a4a':'#93382e';
      bx.fillRect(-tl/2,-th/2+1,1.6,2.2); bx.fillRect(-tl/2,th/2-3.2,1.6,2.2);
      /* drawbar: A-frame arms from the trailer nose to the hook pin, air lines alongside */
      const hx=tl/2+TR_GAP;
      bx.fillStyle='#d24a3a'; bx.fillRect(tl/2-0.4,-2.4,TR_GAP,0.7);
      bx.fillStyle='#e0b13a'; bx.fillRect(tl/2-0.4,1.7,TR_GAP,0.7);
      bx.strokeStyle='#22262f'; bx.lineWidth=1.3;
      bx.beginPath(); bx.moveTo(tl/2-0.5,-th*0.30); bx.lineTo(hx,-0.5); bx.moveTo(tl/2-0.5,th*0.30); bx.lineTo(hx,0.5); bx.stroke();
      bx.lineWidth=1;
      bx.fillStyle='#3a404c'; bx.fillRect(tl/2+0.5,-0.7,TR_GAP-0.5,1.4);
      /* coupling eye that drops over the truck's hook pin */
      bx.fillStyle='#b9c0cc'; bx.fillRect(hx-1.7,-1.7,3.4,3.4);
      bx.fillStyle='#14171d'; bx.fillRect(hx-0.7,-0.7,1.4,1.4);
      bx.restore();
      bx.globalAlpha=1;
    }
  }

  const ghost = v.ghost===undefined?1:clamp(v.ghost,0,1);
  if(ghost<=0) return;
  bx.globalAlpha=ghost;
  bx.save(); bx.translate(v.x+2.5, v.y+3.5); bx.rotate(v.a);
  bx.fillStyle='rgba(0,0,0,0.30)'; bx.fillRect(-w/2,-h/2,w,h); bx.restore();

  bx.save(); bx.translate(Math.round(v.x*2)/2, Math.round(v.y*2)/2); bx.rotate(v.a);
  const col = v.wrecked ? '#3a3a40' : v.color;
  const st=clamp(v.steer,-1,1)*0.42;

  if(cls==='moto'){
    /* two wheels, a rider and not much else */
    bx.fillStyle='#15171c';
    bx.save(); bx.translate(w*0.34,0); bx.rotate(st); bx.fillRect(-2.6,-1,5.2,2); bx.restore();
    bx.fillRect(-w*0.42-2.6,-1,5.2,2);
    bx.fillStyle=col; bx.fillRect(-w*0.3,-h/2,w*0.62,h);
    bx.fillStyle=shade(col,0.2); bx.fillRect(-w*0.3,-h/2,w*0.62,1);
    bx.fillStyle='#2b3040'; bx.fillRect(-w*0.12,-h/2-1.6,w*0.3,h+3.2);
    bx.fillStyle='#e8b98a'; bx.fillRect(-w*0.06,-1.4,2.6,2.8);
    bx.fillStyle='#1b2030'; bx.fillRect(-w*0.06,-1.4,2.6,1.2);
    bx.fillStyle= (dk>0.28||weather.rainAmt>0.3)?'#fff4c8':'#d9d4b4';
    bx.fillRect(w/2-2,-1.1,2,2.2);
    bx.fillStyle=(v.brake>0.25||v.hand||v.vf<0)?'#ff5a4a':'#93382e';
    bx.fillRect(-w/2,-1,1.6,2);
    bx.restore();
    bx.globalAlpha=1;
    drawVehicleExtras(v,w,h);
    return;
  }

  /* wheels */
  bx.fillStyle='#15171c';
  const flatFL = (v===player.car && player.flats>0);
  const flatSq = flatFL ? 0.6 : 0;
  bx.save(); bx.translate(w*0.30,-h/2+0.5); bx.rotate(st); bx.fillRect(-2.5,-1+flatSq*0.3,5,2-flatSq*0.6); bx.restore();
  bx.save(); bx.translate(w*0.30, h/2-0.5); bx.rotate(st); bx.fillRect(-2.5,-1+flatSq*0.3,5,2-flatSq*0.6); bx.restore();
  bx.fillRect(-w*0.34-2.5,-h/2-0.5,5,2);
  bx.fillRect(-w*0.34-2.5, h/2-1.5,5,2);
  if(cls==='semi'||cls==='bus'){
    bx.fillRect(-w*0.10-2.5,-h/2-0.5,5,2);
    bx.fillRect(-w*0.10-2.5, h/2-1.5,5,2);
  }

  /* body */
  bx.fillStyle=col; bx.fillRect(-w/2,-h/2,w,h);
  bx.fillStyle=shade(col,0.18); bx.fillRect(-w/2+1,-h/2+1,w-2,1.5);
  bx.fillStyle=shade(col,-0.30); bx.fillRect(-w/2+1,h/2-2.5,w-2,1.5);
  bx.fillStyle=shade(col,-0.45); bx.fillRect(-w/2,-h/2,1,h);

  if(cls==='truck'||cls==='van'||cls==='semi'){
    bx.fillStyle=shade(col,0.10); bx.fillRect(-w/2+1,-h/2+1.5,w*0.52,h-3);
    bx.fillStyle='#22283a'; bx.fillRect(w*0.16,-h/2+2,w*0.16,h-4);
    bx.fillStyle='#7fb8e8'; bx.fillRect(w*0.30,-h/2+2,w*0.08,h-4);
    if(cls==='truck'){
      bx.fillStyle=shade(col,-0.2);
      for(let t=-w/2+3;t<-w*0.06;t+=5) bx.fillRect(t,-h/2+2,1,h-4);
    }
  } else if(cls==='bus'){
    bx.fillStyle='#22283a';
    for(let t=-w/2+4;t<w/2-6;t+=6) bx.fillRect(t,-h/2+2,4,h-4);
    bx.fillStyle='#7fb8e8'; bx.fillRect(w*0.36,-h/2+2,w*0.06,h-4);
    bx.fillStyle=shade(col,0.22); bx.fillRect(-w/2,-h/2+4.6,w,1.6);
  } else if(cls==='super'){
    /* long nose, tiny cabin, big rear wing */
    bx.fillStyle='#181c26'; bx.fillRect(-w*0.10,-h/2+2.2,w*0.30,h-4.4);
    bx.fillStyle='#9fd0ff'; bx.fillRect(w*0.14,-h/2+2.6,w*0.05,h-5.2);
    bx.fillStyle=shade(col,0.24); bx.fillRect(w*0.22,-h/2+1.4,w*0.2,h-2.8);
    bx.fillStyle=shade(col,-0.38); bx.fillRect(-w*0.44,-h/2-1,w*0.10,h+2);
    bx.fillStyle=shade(col,-0.2); bx.fillRect(-w*0.30,-h/2+1,1.4,h-2);
  } else if(cls==='muscle'){
    bx.fillStyle='#22283a'; bx.fillRect(-w*0.22,-h/2+2,w*0.40,h-4);
    bx.fillStyle='#7fb8e8'; bx.fillRect(w*0.12,-h/2+2.5,w*0.06,h-5);
    bx.fillStyle='#1b1f27'; bx.fillRect(w*0.20,-h*0.22,w*0.14,h*0.44);
    bx.fillStyle=shade(col,-0.4);
    bx.fillRect(-w/2+1,-h/2+1,w*0.12,h-2);
  } else if(cls==='luxury'){
    bx.fillStyle='#1b2030'; bx.fillRect(-w*0.24,-h/2+2,w*0.46,h-4);
    bx.fillStyle='#9fd0ff'; bx.fillRect(w*0.14,-h/2+2.5,w*0.06,h-5);
    bx.fillStyle=shade(col,0.3); bx.fillRect(-w/2+1,-h/2+1,w-2,0.9);
    bx.fillStyle='#d8c98a'; bx.fillRect(w/2-3.4,-h/2+1,1,h-2);
  } else if(cls==='swat'||cls==='army'){
    bx.fillStyle=shade(col,-0.25); bx.fillRect(-w/2+1,-h/2+1.5,w*0.5,h-3);
    bx.fillStyle='#14181f'; bx.fillRect(w*0.12,-h/2+2.4,w*0.2,h-4.8);
    bx.fillStyle='#39434f'; bx.fillRect(w*0.30,-h/2+2.4,w*0.06,h-4.8);
    bx.fillStyle=shade(col,0.14);
    bx.fillRect(-w*0.10,-h/2+1,1.6,h-2); bx.fillRect(-w*0.30,-h/2+1,1.6,h-2);
    if(cls==='army'){ bx.fillStyle='#6b7355'; bx.fillRect(-w*0.24,-h*0.2,w*0.2,h*0.4); }
  } else {
    bx.fillStyle='#22283a'; bx.fillRect(-w*0.20,-h/2+2,w*0.42,h-4);
    bx.fillStyle='#7fb8e8'; bx.fillRect(w*0.15,-h/2+2.5,w*0.07,h-5);
    bx.fillStyle='#4f7ba8'; bx.fillRect(-w*0.22,-h/2+2.5,w*0.05,h-5);
    bx.fillStyle=shade(col,0.06); bx.fillRect(-w*0.06,-h/2+2,w*0.14,h-4);
  }
  if(v.type==='taxi'){
    bx.fillStyle='#16181c';
    for(let s0=-h/2+1;s0<h/2-1;s0+=3) bx.fillRect(-w*0.44, s0, 2, 1.5);
    bx.fillStyle='#ffd24a'; bx.fillRect(-w*0.06,-1.5,4,3);
  }

  /* head and tail lamps - the player's can be knocked out individually */
  const hl = v.engineOn && (dk>0.28||weather.rainAmt>0.3||v.mode==='police');
  const isP = v===player.car;
  const lampL = v.engineOn && (!isP || player.headlight[0]);
  const lampR = v.engineOn && (!isP || player.headlight[1]);
  bx.fillStyle = lampL ? (hl?'#fff4c8':'#d9d4b4') : '#4a4438';
  bx.fillRect(w/2-2,-h/2+1,2,2.2);
  bx.fillStyle = lampR ? (hl?'#fff4c8':'#d9d4b4') : '#4a4438';
  bx.fillRect(w/2-2,h/2-3.2,2,2.2);
  const braking = v.brake>0.25 || v.hand || (v.vf<0);
  bx.fillStyle = braking?'#ff5a4a':'#93382e';
  bx.fillRect(-w/2,-h/2+1,1.6,2.2); bx.fillRect(-w/2,h/2-3.2,1.6,2.2);
  if(cls==='semi'){
    /* hitch bracket and hook pin on the rear of the cab */
    bx.fillStyle='#20242c'; bx.fillRect(-w/2-2,-2.6,3.6,5.2);
    bx.fillStyle='#4a5160'; bx.fillRect(-w/2-2,-2.6,3.6,0.8); bx.fillRect(-w/2-2,1.8,3.6,0.8);
    bx.fillStyle='#e6e9f0'; bx.fillRect(-w/2-1.9,-1,1.8,2);
    bx.fillStyle='#8e96a6'; bx.fillRect(-w/2-1.9,-1,0.7,2);
  }

  /* indicators: left side is -h/2, right is +h/2 in local space */
  if(v.indicate && Math.floor((v.blink||0)*3)%2===0){
    bx.fillStyle='#ffb020';
    const sy = v.indicate>0 ? h/2-3.2 : -h/2+1;
    bx.fillRect(w/2-3.6, sy, 1.6, 2.2);
    bx.fillRect(-w/2+2, sy, 1.6, 2.2);
  }
  /* hazards on a broken-down or flat-tyred car */
  if(v.flat && Math.floor(now*3)%2===0){
    bx.fillStyle='#ffb020';
    bx.fillRect(w/2-3.6,-h/2+1,1.6,2.2); bx.fillRect(w/2-3.6,h/2-3.2,1.6,2.2);
  }

  /* light bar */
  if(v.mode==='police'){
    const on=Math.floor(v.lightPhase/1.4)%2===0;
    bx.fillStyle='#d8dde6'; bx.fillRect(-w*0.10,-h/2+0.5,3,h-1);
    bx.fillStyle= on?'#ff3b30':'#5a1c18'; bx.fillRect(-w*0.10,-h/2+0.5,3,(h-1)/2);
    bx.fillStyle= on?'#2b55ff':'#17204a'; bx.fillRect(-w*0.10,0,3,(h-1)/2);
    bx.fillStyle='#e9eef7'; bx.fillRect(-w*0.42,-h/2+1,w*0.2,1.5);
  }
  /* bounty target marker */
  if(v.bounty){
    bx.fillStyle=MTYPE.BOUNTY.col;
    bx.fillRect(-w*0.08,-h/2-2.6,3,1.6);
  }
  /* smashed driver's-side window from a wanted-level car break-in */
  if(v.driverWindowBroken && !v.wrecked){
    bx.fillStyle='rgba(5,8,14,0.88)'; bx.fillRect(-w*0.08,-h/2+1,w*0.30,h-2);
    bx.strokeStyle='rgba(210,220,235,0.8)'; bx.lineWidth=0.7;
    bx.beginPath(); bx.moveTo(w*0.03,-h/2+2); bx.lineTo(-w*0.03,0); bx.lineTo(w*0.10,h/2-2); bx.moveTo(-w*0.01,0); bx.lineTo(w*0.12,-h*0.35); bx.stroke(); bx.lineWidth=1;
  }
  /* damage */
  const dmg = 1-v.hp/v.maxHp;
  if(dmg>0.35){
    bx.fillStyle='rgba(28,26,30,0.55)';
    const s0=(v.seedd||(v.seedd=Math.floor(rnd()*97)));
    bx.fillRect(-w/2+ (s0%5), -h/2+1+(s0%3), 3+dmg*4, 2+dmg*3);
    if(dmg>0.6) bx.fillRect(w/2-4-(s0%4), h/2-4, 3, 3);
  }
  bx.restore();
  bx.globalAlpha=1;
  drawVehicleExtras(v,w,h);
}
/* Player-only trimmings drawn in local space after the body. */
function drawVehicleExtras(v,w,h){
  if(v!==player.car) return;
  bx.save(); bx.translate(Math.round(v.x*2)/2, Math.round(v.y*2)/2); bx.rotate(v.a);
  if(player.bumperT>0){
    bx.fillStyle = (Math.floor(now*7)%2)?'#ffb020':'#ff6a20';
    bx.fillRect(w/2-0.5,-h/2,1.5,h);
  }
  if(player.boosting){
    bx.fillStyle='#7fd8ff'; bx.fillRect(-w/2-3,-1.5,3,3);
    bx.fillStyle='#ffffff'; bx.fillRect(-w/2-1.5,-0.8,2,1.6);
  }
  bx.restore();
  /* the driver's arm and muzzle flash when shooting out of the window */
  if(!player.onFoot && WEAPONS[player.weapon].cls==='gun' && WEAPONS[player.weapon].oneHand){
    const a=player.aimA;
    bx.fillStyle='#2b2f38';
    bx.fillRect(v.x+Math.cos(a)*(w*0.34)-1, v.y+Math.sin(a)*(w*0.34)-1, 2.6, 2);
    if(player.muzzle>0){
      bx.fillStyle='#fff3c0';
      bx.fillRect(v.x+Math.cos(a)*(w*0.5)-1.4, v.y+Math.sin(a)*(w*0.5)-1.4, 3, 3);
    }
  }
}
function drawPed(p){
  if(!inView(p.x,p.y,16)) return;
  if(p.state==='dead'){
    /* sprawled where they fell, fading out with the blood */
    const fade = clamp(1-(p.deadT||0)/30, 0.25, 1);
    bx.globalAlpha=fade;
    bx.save(); bx.translate(p.x,p.y); bx.rotate(p.a+Math.PI/2);
    bx.fillStyle='rgba(0,0,0,0.25)'; bx.fillRect(-3.5,-2.5,8,5);
    bx.fillStyle=shade(p.shirt,-0.25); bx.fillRect(-3,-1.8,6,3.6);
    bx.fillStyle=shade(p.col,-0.2); bx.fillRect(3,-1.6,2.8,3.2);
    bx.fillStyle='#1f232d'; bx.fillRect(-5,-1.4,2,1.3); bx.fillRect(-5,0.2,2,1.3);
    bx.restore();
    bx.globalAlpha=1;
    return;
  }
  const down0 = p.state==='down';
  bx.fillStyle='rgba(0,0,0,0.28)';
  bx.fillRect(p.x-2, p.y+1, 4, 2);
  if(down0){
    bx.save(); bx.translate(p.x,p.y); bx.rotate(p.a+Math.PI/2);
    bx.fillStyle=p.shirt; bx.fillRect(-3,-1.5,6,3);
    bx.fillStyle=p.col; bx.fillRect(3,-1.5,2.5,3);
    bx.restore();
    return;
  }
  const bobY = Math.sin(p.bob)*0.7;
  const legs = Math.sin(p.bob*1.6);
  bx.fillStyle='#2b2f3a';
  bx.fillRect(p.x-2, p.y+1+legs*0.6, 1.6, 2.4);
  bx.fillRect(p.x+0.4, p.y+1-legs*0.6, 1.6, 2.4);
  bx.fillStyle=p.shirt;
  bx.fillRect(p.x-2.2, p.y-2.4+bobY, 4.4, 4);
  if(p.gang){
    /* colours on the shoulders so crews read at a glance */
    bx.fillStyle=p.gang.skin;
    bx.fillRect(p.x-2.2, p.y-2.4+bobY, 4.4, 1.2);
    bx.fillRect(p.x-2.2, p.y+0.4+bobY, 4.4, 1.2);
  }
  bx.fillStyle=p.col;
  bx.fillRect(p.x-1.6, p.y-5+bobY, 3.2, 3);
  bx.fillStyle='rgba(0,0,0,0.3)';
  bx.fillRect(p.x-1.6, p.y-5+bobY, 3.2, 1);
  if(p.vip){
    /* the mark wears a target */
    const ph=Math.sin(now*4)*1.5;
    bx.fillStyle=MTYPE.HITMAN.col;
    bx.fillRect(p.x-0.8, p.y-12+ph, 2, 3.4);
    bx.fillRect(p.x-1.8, p.y-9+ph, 4, 1.4);
  }
  if(p.alert>0){
    bx.fillStyle=PAL.bad;
    bx.fillRect(p.x-0.5, p.y-11, 1.6, 3.4); bx.fillRect(p.x-0.5, p.y-6.6, 1.6, 1.4);
  }
}
function drawPlayerFoot(){
  const p=player;
  bx.fillStyle='rgba(0,0,0,0.32)'; bx.fillRect(p.x-2.5,p.y+1,5,2.4);
  const legs=Math.sin(p.walkT*2)*0.8;
  bx.fillStyle='#232838';
  bx.fillRect(p.x-2.2,p.y+1+legs*0.7,1.8,2.6);
  bx.fillRect(p.x+0.4,p.y+1-legs*0.7,1.8,2.6);
  bx.fillStyle=PAL.neon;
  bx.fillRect(p.x-2.5,p.y-2.6,5,4.2);
  bx.fillStyle='#1b2030'; bx.fillRect(p.x-2.5,p.y-2.6,5,1);
  if(player.vest>0){
    bx.fillStyle='#39434f'; bx.fillRect(p.x-2.5,p.y-2.0,5,2.6);
    bx.fillStyle='#4c5764'; bx.fillRect(p.x-2.5,p.y-2.0,5,0.8);
  }
  bx.fillStyle='#e8b98a';
  bx.fillRect(p.x-1.8,p.y-5.6,3.6,3.2);
  bx.fillStyle='#2c3244'; bx.fillRect(p.x-1.8,p.y-5.6,3.6,1.2);

  /* whatever is in your hands, pointed where you're aiming */
  const W=WEAPONS[player.weapon];
  const a=player.aimA;
  const cx=p.x+Math.cos(a)*3.4, cy=p.y+Math.sin(a)*3.4;
  if(W.cls==='gun'){
    const len = W.name==='RIFLE'?6 : W.name==='SHOTGUN'?5.4 : W.name==='SMG'?4.2 : 3;
    bx.save(); bx.translate(cx,cy); bx.rotate(a);
    bx.fillStyle='#2b2f38'; bx.fillRect(0,-0.8,len,1.7);
    bx.fillStyle='#4a4f59'; bx.fillRect(0,-0.8,len,0.6);
    if(W.name==='SHOTGUN'||W.name==='RIFLE'){ bx.fillStyle='#6b5a3e'; bx.fillRect(-2,-0.8,2,1.7); }
    bx.restore();
    if(player.muzzle>0){
      bx.fillStyle='#fff3c0';
      bx.fillRect(p.x+Math.cos(a)*(len+4)-1.6, p.y+Math.sin(a)*(len+4)-1.6, 3.4, 3.4);
      bx.fillStyle='#ffb020';
      bx.fillRect(p.x+Math.cos(a)*(len+6)-1, p.y+Math.sin(a)*(len+6)-1, 2, 2);
    }
  } else if(player.weapon==='BAT'){
    const sw = player.swingT>0 ? (1-player.swingT/0.18)*1.5-0.75 : 0;
    bx.save(); bx.translate(p.x,p.y); bx.rotate(a+sw);
    bx.fillStyle='#8a7350'; bx.fillRect(3,-0.7,7,1.6);
    bx.fillStyle='#a38a63'; bx.fillRect(7,-1.1,3.4,2.4);
    bx.restore();
  } else if(player.swingT>0){
    bx.fillStyle='#e8b98a';
    bx.fillRect(p.x+Math.cos(a)*5-1, p.y+Math.sin(a)*5-1, 2.4, 2.4);
  }
  /* facing pip */
  bx.fillStyle=PAL.white;
  bx.fillRect(p.x+Math.cos(p.a)*4-0.5, p.y+Math.sin(p.a)*4-0.5, 1.4,1.4);
}
/* A small crosshair wherever the mouse is pointing. */
function drawCrosshair(){
  if(!mouse.active || player.wheelOpen) return;
  if(WEAPONS[player.weapon].cls!=='gun') return;
  const x=mouse.wx, y=mouse.wy;
  const col = (player.ammo[player.weapon]|0)>0 ? PAL.neon : PAL.bad;
  bx.fillStyle=col;
  bx.fillRect(x-5,y-0.5,3.4,1.2); bx.fillRect(x+1.6,y-0.5,3.4,1.2);
  bx.fillRect(x-0.5,y-5,1.2,3.4); bx.fillRect(x-0.5,y+1.6,1.2,3.4);
}
function drawParticles(){
  for(const p of parts){
    bx.globalAlpha=clamp(p.life,0,1)*(p.type===0?0.55:0.95);
    bx.fillStyle=p.col;
    const r=Math.max(0.6,p.r);
    bx.fillRect(p.x-r/2,p.y-r/2,r,r);
  }
  bx.globalAlpha=1;
}
function drawFloats(){
  for(const f of floats){
    bx.globalAlpha=clamp(f.life*1.4,0,1);
    drawText(bx,f.text,f.x+1,f.y+1,1,'#000','center');
    drawText(bx,f.text,f.x,f.y,1,f.col,'center');
  }
  bx.globalAlpha=1;
}
function drawMarkers(){
  for(const m of markers){
    if(!inView(m.x,m.y,30)) continue;
    const T=MTYPE[m.type];
    m.phase+=0.03;
    const pulse=0.6+Math.sin(m.phase*2)*0.4;
    bx.globalAlpha=0.30+pulse*0.25;
    bx.fillStyle=T.col; circle(m.x,m.y,13+pulse*3);
    bx.globalAlpha=1;
    const bob = Math.sin(m.phase*2)*1.5;
    bx.save(); bx.translate(m.x,m.y+bob); bx.rotate(m.phase);
    bx.fillStyle=T.col; bx.fillRect(-5,-5,10,10);
    bx.fillStyle='#10131b'; bx.fillRect(-3,-3,6,6);
    bx.restore();

    /* Keep the mission letter attached to the hovering marker.  It stays
       upright for readability, but follows the same position/bob as the
       rotating icon instead of being rendered at the old ground position. */
    drawText(bx,T.icon,m.x,m.y-2.6+bob,0.75,T.col,'center');

/* ------------------------------ lighting ---------------------------------- */
/* -------------------------------------------------------------------------
   Dynamic car-headlight visibility polygons.
   Each headlight casts a fan of rays.  Rays aimed at obstacle corners are
   included in the fan, so buildings/trees/solid props produce the long,
   angular shadow shapes rather than a single three-ray approximation.
   ------------------------------------------------------------------------- */
const HEADLIGHT_HALF_ANGLE = 0.34;
const HEADLIGHT_RAY_EPS = 0.00065;

function rayRectDistance(x,y,c,s,bd,maxDist){
  const minX=bd.x, maxX=bd.x+bd.w, minY=bd.y, maxY=bd.y+bd.h;
  let tmin=-Infinity, tmax=Infinity;

  if(Math.abs(c)<1e-8){
    if(x<minX || x>maxX) return Infinity;
  }else{
    let t1=(minX-x)/c, t2=(maxX-x)/c;
    if(t1>t2){ const q=t1;t1=t2;t2=q; }
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2);
  }
  if(Math.abs(s)<1e-8){
    if(y<minY || y>maxY) return Infinity;
  }else{
    let t1=(minY-y)/s, t2=(maxY-y)/s;
    if(t1>t2){ const q=t1;t1=t2;t2=q; }
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2);
  }

  if(tmax<0 || tmin>tmax) return Infinity;
  const hit=tmin>=0?tmin:tmax;
  return hit>=0 && hit<=maxDist ? hit : Infinity;
}

function rayCircleDistance(x,y,c,s,cx,cy,r,maxDist){
  const ox=x-cx, oy=y-cy;
  const b=ox*c+oy*s;
  const cc=ox*ox+oy*oy-r*r;
  const disc=b*b-cc;
  if(disc<0) return Infinity;
  const q=Math.sqrt(disc);
  const t0=-b-q, t1=-b+q;
  let hit=t0>=0?t0:t1;
  return hit>=0 && hit<=maxDist ? hit : Infinity;
}

function headlightObstacles(x,y,len){
  const out=[];
  blocksNear(x,y,len+8,_bl);
  for(const b of _bl){
    for(const bd of b.buildings){
      /* Only retain geometry close enough to affect this beam. */
      const cx=clamp(x,bd.x,bd.x+bd.w), cy=clamp(y,bd.y,bd.y+bd.h);
      if(dist2(x,y,cx,cy)<= (len+8)*(len+8)) out.push({type:0,bd});
    }
    for(const t of b.trees||[]){
      if(dist2(x,y,t.x,t.y)<= (len+t.r+8)*(len+t.r+8))
        out.push({type:1,x:t.x,y:t.y,r:t.r+1.5});
    }
    if(b.fountain && dist2(x,y,b.fountain.x,b.fountain.y)<=
       (len+b.fountain.r+8)*(len+b.fountain.r+8))
      out.push({type:1,x:b.fountain.x,y:b.fountain.y,r:b.fountain.r+1.5});
    if(b.pond && dist2(x,y,b.pond.x,b.pond.y)<=
       (len+b.pond.r+8)*(len+b.pond.r+8))
      out.push({type:1,x:b.pond.x,y:b.pond.y,r:b.pond.r+1.5});
  }

  const props=nearProps(x,y,len+8);
  for(const pr of props){
    if(pr.down || !pr.k.solid) continue;
    if(dist2(x,y,pr.x,pr.y)<= (len+pr.k.r+8)*(len+pr.k.r+8))
      out.push({type:1,x:pr.x,y:pr.y,r:pr.k.r+1.5});
  }
  return out;
}

function headlightRayDistance(x,y,a,len,obs){
  const c=Math.cos(a), s=Math.sin(a);
  let hit=len;

  /* World edge is also an occluder. */
  if(c>0) hit=Math.min(hit,(WORLD-4-x)/c);
  else if(c<0) hit=Math.min(hit,(4-x)/c);
  if(s>0) hit=Math.min(hit,(WORLD-4-y)/s);
  else if(s<0) hit=Math.min(hit,(4-y)/s);

  for(const o of obs){
    const d=o.type===0
      ? rayRectDistance(x,y,c,s,o.bd,len)
      : rayCircleDistance(x,y,c,s,o.x,o.y,o.r,len);
    if(d<hit) hit=d;
  }
  return clamp(hit,2,len);
}

function addHeadlightAngle(angles,a0,a1){
  let a=a0 + angDiff(a0,a1);
  /* Normalize into the current cone around a0. */
  if(a<a0-HEADLIGHT_HALF_ANGLE-0.002 || a>a0+HEADLIGHT_HALF_ANGLE+0.002) return;
  angles.push(a-HEADLIGHT_RAY_EPS,a,a+HEADLIGHT_RAY_EPS);
}

function buildHeadlightVisibility(x,y,center,len,obs){
  const angles=[center-HEADLIGHT_HALF_ANGLE, center+HEADLIGHT_HALF_ANGLE];

  for(const o of obs){
    if(o.type===0){
      const pts=[
        [o.bd.x,o.bd.y],[o.bd.x+o.bd.w,o.bd.y],
        [o.bd.x+o.bd.w,o.bd.y+o.bd.h],[o.bd.x,o.bd.y+o.bd.h]
      ];
      for(const p of pts){
        const a=Math.atan2(p[1]-y,p[0]-x);
        const d=Math.hypot(p[0]-x,p[1]-y);
        if(d<=len+2 && Math.abs(angDiff(center,a))<=HEADLIGHT_HALF_ANGLE+0.01){
          angles.push(a-HEADLIGHT_RAY_EPS,a,a+HEADLIGHT_RAY_EPS);
        }
      }
    }else{
      const dx=o.x-x, dy=o.y-y, d=Math.hypot(dx,dy);
      if(d<=len+o.r && d>0.01){
        const base=Math.atan2(dy,dx);
        const spread=Math.asin(clamp(o.r/d,-1,1));
        for(const a of [base-spread,base,base+spread]){
          if(Math.abs(angDiff(center,a))<=HEADLIGHT_HALF_ANGLE+0.01)
            angles.push(a-HEADLIGHT_RAY_EPS,a,a+HEADLIGHT_RAY_EPS);
        }
      }
    }
  }

  angles.sort((a,b)=>a-b);
  const unique=[];
  for(const a of angles){
    if(!unique.length || Math.abs(a-unique[unique.length-1])>0.0001) unique.push(a);
  }

  const pts=[];
  for(const a of unique){
    const d=headlightRayDistance(x,y,a,len,obs);
    pts.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d});
  }
  return pts;
}

function drawBlockedHeadlight(v,px2,py2,len,side){
  const center=v.a;
  const obs=headlightObstacles(px2,py2,len);
  const pts=buildHeadlightVisibility(px2,py2,center,len,obs);
  if(pts.length<2) return len;

  /*
     Clip the soft headlight texture to the visibility polygon.  Because the
     polygon follows obstacle corners, the dark world layer outside it reads
     as the same hard-edged shadow casting seen in classic 2D top-down games.
  */
  lx.save();
  lx.beginPath();
  lx.moveTo(px2,py2);
  for(const p of pts) lx.lineTo(p.x,p.y);
  lx.closePath();
  lx.clip();

  lx.translate(px2,py2);
  lx.rotate(center);
  const sc=len/100;
  lx.globalAlpha=0.52;
  lx.drawImage(CONE,-8*sc,-56*sc,112*sc,112*sc);
  lx.globalAlpha=1;
  lx.restore();

  /* A faint warm contact glow at the lamp itself. */
  return headlightRayDistance(px2,py2,center,len,obs);
}

function lightingPass(ox,oy,dk){
  const storm = weather.kind==='storm'?0.28:(weather.kind==='rain'?0.16:(weather.kind==='fog'?0.12:0));
  const total = clamp(dk*0.92 + storm, 0, 1);
  if(total<0.03) return;
  const h=hourOf();
  let rr0=lerp(255,64,total), gg=lerp(255,72,total), bb=lerp(255,116,total);
  if(h>16.5&&h<20.4){ rr0=lerp(rr0,232,0.30); gg=lerp(gg,150,0.22); bb=lerp(bb,110,0.12); }
  if(h>5&&h<8){ rr0=lerp(rr0,220,0.18); gg=lerp(gg,170,0.14); bb=lerp(bb,180,0.1); }
  if(weather.flash>0){ rr0=lerp(rr0,255,weather.flash); gg=lerp(gg,255,weather.flash); bb=lerp(bb,255,weather.flash); }
  lx.setTransform(1,0,0,1,0,0);
  lx.globalCompositeOperation='source-over';
  lx.fillStyle='rgb('+(rr0|0)+','+(gg|0)+','+(bb|0)+')';
  lx.fillRect(0,0,BW,BH);
  lx.globalCompositeOperation='lighter';
  lx.save(); lx.translate(-ox,-oy);
  const lampOn = dk>0.18 || weather.kind==='storm';
  if(lampOn){
    const a=clamp(total,0,1)*0.85;
    for(const l of city.lamps){
      if(!inView(l.x,l.y,36)) continue;
      glow(GLOW_A,l.x,l.y-4,30,a*0.8);
    }
  }
  for(const g of city.garages){
    if(!inView(g.x,g.y,60)) continue;
    glow(GLOW_C,g.x,g.y,40,0.35+Math.sin(now*3)*0.08);
  }
  for(const m of markers){
    if(!inView(m.x,m.y,50)) continue;
    const T=MTYPE[m.type];
    glow(T.glow,m.x,m.y,30+Math.sin(m.phase*2)*5,0.75);
  }
  if(mission){ const t=missionTarget(); if(t&&inView(t.x,t.y,60)) glow(MTYPE[mission.type].glow,t.x,t.y,38,0.8); }
  /* shop and service signs glow after dark */
  for(const sh of city.shops){
    if(!inView(sh.x,sh.y,60)) continue;
    const g = sh.kind==='police'?GLOW_B : sh.kind==='hospital'?GLOW_R
            : sh.kind==='weapon'?GLOW_R : sh.kind==='jewel'?GLOW_C : GLOW_A;
    glow(g, sh.x, sh.y-4, 26, (lampOn?0.55:0.25)+Math.sin(now*2+sh.x)*0.05);
  }
  /* lit billboards */
  for(const b of city.billboards){
    if(!inView(b.x,b.y,60)) continue;
    if(!lampOn) continue;
    const c=b.ad.c;
    const g = c===PAL.neon2?GLOW_P : c===PAL.neon?GLOW_C : c===PAL.good?GLOW_G : GLOW_A;
    glow(g, b.x, b.y, 26, 0.55);
  }
  /* signal heads */
  for(const [key,L] of city.lights){
    if(L.ctrl!=='light') continue;
    const pp=key.split(','), i=+pp[0], j=+pp[1];
    const x=nodeX(i), y=nodeY(j);
    if(!inView(x,y,ROAD+12)) continue;
    for(let dir=0;dir<4;dir++){
      const st=lightFor(i,j,dir);
      if(st==='red'&&dir>1) continue;
      const d=DIRS[dir];
      const hx=x+d[0]*(ROAD/2+3), hy=y+d[1]*(ROAD/2+3)-4;
      glow(st==='green'?GLOW_G:(st==='amber'?GLOW_A:GLOW_R), hx, hy, 11, 0.55);
    }
  }
  /* level crossing flashers */
  for(const c of city.crossings){
    if(!c.warn || !inView(c.x,c.y,ROAD+20)) continue;
    const on=Math.floor(now*4)%2===0;
    glow(GLOW_R, c.x+(on?-ROAD/2-3:ROAD/2+3), c.y-17, 13, 0.85);
    glow(GLOW_R, c.x+(on?ROAD/2+3:-ROAD/2-3), c.y+17, 13, 0.85);
  }
  /* train headlamps */
  for(const t of trains){
    if(!inView(t.x,t.y,120)) continue;
    lx.save();
    lx.translate(t.x+t.dir*2, t.y); lx.rotate(t.dir>0?0:Math.PI);
    const sc=1.3; lx.globalAlpha=0.7;
    lx.drawImage(CONE, -8*sc, -56*sc, 112*sc, 112*sc);
    lx.globalAlpha=1; lx.restore();
  }
  for(const v of vehicles){
    if(!inView(v.x,v.y,120)) continue;
    const c=Math.cos(v.a), s=Math.sin(v.a);
    if((lampOn||weather.rainAmt>0.3||v.mode==='police') && !v.wrecked){
      const len=v.mode==='police'?92:74;
      const isP = v===player.car;
      /* a beam per lamp, so a broken one leaves a dark side */
      const lamps = v.spec.cls==='moto' ? [0] : [-1,1];
      for(const side of lamps){
        if(isP && side===-1 && !player.headlight[0]) continue;
        if(isP && side===1 && !player.headlight[1]) continue;
        const px2 = v.x + c*v.w*0.42 - s*(v.h*0.3*side);
        const py2 = v.y + s*v.w*0.42 + c*(v.h*0.3*side);
        drawBlockedHeadlight(v,px2,py2,len,side);
        glow(GLOW_W, px2, py2, 7, 0.5);
      }
    }
    if(v.brake>0.25||v.hand) glow(GLOW_R, v.x-c*v.w*0.5, v.y-s*v.w*0.5, 12, 0.6);
    if(v.indicate && Math.floor((v.blink||0)*3)%2===0){
      const sy0=v.indicate>0?1:-1;
      glow(GLOW_A, v.x+c*v.w*0.42-s*v.h*0.42*sy0, v.y+s*v.w*0.42+c*v.h*0.42*sy0, 8, 0.8);
    }
    if(v.mode==='police'){
      const on=Math.floor(v.lightPhase/1.4)%2===0;
      glow(on?GLOW_R:GLOW_B, v.x, v.y, 26, 0.85);
    }
    if(v===player.car && player.boosting) glow(GLOW_B, v.x-c*v.w*0.6, v.y-s*v.w*0.6, 20, 0.9);
  }
  /* muzzle flashes light the street */
  if(player.muzzle>0){
    const a=player.aimA;
    glow(GLOW_A, player.x+Math.cos(a)*8, player.y+Math.sin(a)*8, 30, 0.9);
  }
  for(const c of cops) if(c.muzzle>0) glow(GLOW_A, c.x+Math.cos(c.a)*7, c.y+Math.sin(c.a)*7, 22, 0.8);
  for(const b of bullets) glow(GLOW_A, b.x, b.y, 6, 0.5);
  for(const pk of pickups) glow(pk.kind==='cash'?GLOW_G:GLOW_A, pk.x, pk.y, 9, 0.45);
  for(const sp of spikes) if(sp.armed) glow(GLOW_R, sp.x, sp.y, 12, 0.4);
  for(const pr of city.props) if(pr.spray>0) glow(GLOW_C, pr.x, pr.y, 14, 0.5);
  if(parts.length<200){
    for(const p of parts){ if(p.type===1 && p.life>0.3) glow(GLOW_A,p.x,p.y,9,p.life*0.5); }
  }
  lx.restore();
  bx.setTransform(1,0,0,1,0,0);
  bx.globalCompositeOperation='multiply';
  bx.drawImage(lightC,0,0);
  bx.globalCompositeOperation='source-over';
  bx.setTransform(1,0,0,1,0,0);
  bx.translate(-ox,-oy);
}
/* ------------------------------ weather fx -------------------------------- */
const drops=[];
function updateDrops(dt){
  const want = Math.floor(weather.rainAmt*210);
  while(drops.length<want) drops.push({x:rnd()*BW, y:rnd()*BH, l:rr(5,12), s:rr(330,520)});
  while(drops.length>want) drops.pop();
  for(const d of drops){
    d.y+=d.s*dt; d.x+=d.s*dt*0.26;
    if(d.y>BH){ d.y=-10; d.x=rnd()*BW*1.3-BW*0.15; }
    if(d.x>BW+10) d.x-=BW+20;
  }
}
function drawWeatherOverlay(){
  if(weather.fog>0.02){
    bx.globalAlpha=weather.fog*0.30; bx.fillStyle='#b9c4d2'; bx.fillRect(0,0,BW,BH); bx.globalAlpha=1;
  }
  if(drops.length){
    bx.strokeStyle='rgba(180,214,255,0.5)'; bx.lineWidth=1; bx.beginPath();
    for(const d of drops){ bx.moveTo(d.x,d.y); bx.lineTo(d.x-d.l*0.26,d.y-d.l); }
    bx.stroke();
    bx.globalAlpha=0.08; bx.fillStyle='#4a6a94'; bx.fillRect(0,0,BW,BH); bx.globalAlpha=1;
  }
  if(weather.flash>0.02){
    bx.globalAlpha=weather.flash*0.45; bx.fillStyle='#dce8ff'; bx.fillRect(0,0,BW,BH); bx.globalAlpha=1;
  }
  /* vignette */
  bx.globalAlpha=0.20; bx.fillStyle='#000';
  bx.fillRect(0,0,BW,3); bx.fillRect(0,BH-3,BW,3); bx.fillRect(0,0,3,BH); bx.fillRect(BW-3,0,3,BH);
  bx.globalAlpha=0.10;
  bx.fillRect(0,3,BW,2); bx.fillRect(0,BH-5,BW,2); bx.fillRect(3,0,2,BH); bx.fillRect(BW-5,0,2,BH);
  bx.globalAlpha=1;
}

/* -------------------------------- HUD ------------------------------------- */
function panel(x,y,w,h,alpha){
  bx.globalAlpha=alpha===undefined?0.82:alpha;
  bx.fillStyle=PAL.panel; bx.fillRect(x,y,w,h);
  bx.globalAlpha=1;
  bx.fillStyle=PAL.panelHi;
  bx.fillRect(x,y,w,1); bx.fillRect(x,y+h-1,w,1); bx.fillRect(x,y,1,h); bx.fillRect(x+w-1,y,1,h);
}
function bar(x,y,w,h,pct,col,bg){
  bx.fillStyle=bg||'#20263a'; bx.fillRect(x,y,w,h);
  bx.fillStyle=col; bx.fillRect(x,y,Math.max(0,Math.round(w*clamp(pct,0,1))),h);
  bx.fillStyle='rgba(255,255,255,0.18)'; bx.fillRect(x,y,Math.max(0,Math.round(w*clamp(pct,0,1))),1);
}
function segBar(x,y,w,h,pct,col){
  const segs=12, sw=Math.floor(w/segs);
  for(let i=0;i<segs;i++){
    const on = (i+1)/segs <= pct+0.0001;
    bx.fillStyle = on?col:'#242a3c';
    bx.fillRect(x+i*sw, y, sw-1, h);
  }
}
function fmtTime(s){
  s=Math.max(0,s);
  const m=Math.floor(s/60), r=Math.floor(s%60);
  return m+':'+(r<10?'0':'')+r;
}
/* ---- imperial readouts: world units -> mph / feet / miles ---- */
const MPH = 1.01;                    /* tuned so top speeds read like real cars */
const FT_PER_UNIT = 2.6;
function fmtDist(u){
  const ft=u*FT_PER_UNIT;
  if(ft<1000) return Math.round(ft)+'FT';
  return (ft/5280).toFixed(ft<10560?2:1)+'MI';
}
function fmtOdo(u){ return (u*FT_PER_UNIT/5280).toFixed(1); }

/* ---- GPS: a staircase route along the street grid ---- */
const gps = { pts:[], t:0, tx:0, ty:0 };
function updateGPS(dt, tx, ty){
  gps.t-=dt;
  if(tx===null){ gps.pts.length=0; return; }
  if(gps.t>0 && Math.abs(tx-gps.tx)<2 && Math.abs(ty-gps.ty)<2) return;
  gps.t=0.6; gps.tx=tx; gps.ty=ty;
  const i0=nearestNodeI(player.x), j0=nearestNodeJ(player.y);
  const ti=nearestNodeI(tx), tj=nearestNodeJ(ty);
  const mid=i0+Math.round((ti-i0)/2);
  const nodes=[[i0,j0],[mid,j0],[mid,tj],[ti,tj]];
  const pts=[{x:player.x,y:player.y}];
  let last=null;
  for(const [i,j] of nodes){
    const key=i+','+j; if(key===last) continue; last=key;
    pts.push({x:nodeX(i), y:nodeY(j)});
  }
  pts.push({x:tx,y:ty});
  gps.pts=pts;
}

function drawHUD(){
  /* ---- top left: cash / score ---- */
  panel(5,5,118,34);
  drawText(bx,'$'+player.cash, 11, 10, 2, PAL.good);
  drawText(bx,'SCORE '+player.score, 11, 26, 1, PAL.white);
  if(player.combo>0){
    const m=(1+Math.min(player.combo,9)*0.5).toFixed(1);
    drawText(bx,'x'+m, 117, 11, 1, PAL.amber, 'right');
    bar(70,26,47,4, player.comboT/4.2, PAL.amber);
  }
  /* ---- top right: clock / weather / wanted ---- */
  const tw=112, tx=BW-tw-5;
  panel(tx,5,tw,42);
  const h=Math.floor(hourOf()), mi=Math.floor((hourOf()%1)*60);
  drawText(bx,(h<10?'0':'')+h+':'+(mi<10?'0':'')+mi, tx+6, 10, 2, PAL.neon);
  const wnames={clear:'CLEAR',rain:'RAIN',storm:'STORM',fog:'FOG'};
  drawText(bx, wnames[weather.kind], tx+tw-6, 12, 1, weather.kind==='clear'?PAL.dim:PAL.neon, 'right');
  /* six stars: star count is derived from accumulated danger points,
     not from the number of crimes committed. */
  const wanted=wantedLevel();
  for(let i=0;i<6;i++){
    const lit = i<wanted;
    const mil = i===5;
    let col = lit ? (mil?'#ffd24a':PAL.bad) : '#2c3347';
    const next=HEAT_THRESHOLDS[Math.min(HEAT_THRESHOLDS.length-1,i+1)];
    if(!lit && i===wanted && player.heat>=next*0.88 && Math.floor(now*6)%2===0) col=PAL.bad;
    drawText(bx,'*', tx+6+i*17, 25, 1.5, col);
  }
  drawText(bx,'DANGER '+Math.round(player.heat), tx+tw-6, 36, 1, PAL.dim, 'right');
  if(player.heat>0){
    bx.fillStyle= wantedLevel()>=6?'#ffd24a':PAL.bad;
    bx.globalAlpha=0.35+Math.sin(now*8)*0.2;
    bx.fillRect(tx,5,tw,1); bx.fillRect(tx,46,tw,1); bx.globalAlpha=1;
  }
  /* ---- mission tracker ---- */
  if(mission){
    const w=170, x=Math.round(BW/2-w/2);
    panel(x,5,w,36);
    drawText(bx, mission.name, x+w/2, 9, 1, mission.col, 'center');
    drawText(bx, mission.obj, x+w/2, 18, 1, PAL.white, 'center');
    bar(x+6, 28, w-12, 4, mission.time/mission.limit, mission.time<10?PAL.bad:mission.col);
    drawText(bx, fmtTime(mission.time), x+w-4, 27, 1, PAL.white, 'right');
    if(mission.cps.length && mission.type!=='COURIER')
      drawText(bx, (mission.idx)+'/'+mission.cps.length, x+4, 27, 1, PAL.dim);
    if(mission.type==='PURSUIT') drawText(bx, 'EVADE', x+4, 27, 1, PAL.dim);
    const t=missionTarget();
    if(t) drawText(bx, fmtDist(dist(t.x,t.y,player.x,player.y)), x+w/2, 27, 1, PAL.dim, 'center');
  } else if(markers.length){
    const w=150, x=Math.round(BW/2-w/2);
    panel(x,5,w,18,0.62);
    drawText(bx,'FIND A GLOWING JOB MARKER', x+w/2, 10, 1, PAL.dim, 'center');
  }
  /* ---- robbery progress ---- */
  if(robbery.active){
    const w=150, x=Math.round(BW/2-w/2), y=Math.round(BH*0.22);
    panel(x,y,w,24,0.88);
    drawText(bx,'EMPTYING THE TILL', x+w/2, y+4, 1, PAL.bad, 'center');
    bar(x+6, y+14, w-12, 5, robbery.t/robbery.total, PAL.good);
  }
  /* ---- bottom right: speed / integrity ---- */
  const pw=124, px=BW-pw-5, py=BH-47;
  panel(px,py,pw,42);
  const c=player.car;
  const spd = (!player.onFoot&&c)?Math.round(c.speed*MPH):0;
  drawText(bx, spd, px+6, py+5, 3, player.boosting?PAL.neon:PAL.white);
  drawText(bx,'MPH', px+6+textW(String(spd),3)+4, py+15, 1, PAL.dim);
  const label = player.onFoot?'ON FOOT':(c&&c.wrecked?'WRECKED':(c?c.spec.name:'--'));
  drawText(bx, label, px+pw-5, py+5, 1, player.onFoot?PAL.neon:(c&&c.wrecked?PAL.bad:PAL.dim), 'right');
  if(!player.onFoot && player.flats>0)
    drawText(bx, player.flats>1?'2 FLATS':'FLAT TYRE', px+pw-5, py+14, 1, Math.floor(now*4)%2?PAL.bad:'#6a3430', 'right');
  const hp = player.onFoot? player.hp/player.maxHp : (c? c.hp/c.maxHp : 0);
  drawText(bx, player.onFoot?'BODY':'HULL', px+6, py+27, 1, PAL.dim);
  segBar(px+30, py+26, 88, 6, hp, hp>0.5?PAL.good:(hp>0.22?PAL.amber:PAL.bad));
  /* nitrous + bumper + armour */
  let sy=py-9;
  if(player.hasTurbo){
    panel(px,sy,pw,8,0.7);
    drawText(bx,'NOS', px+3, sy+1, 1, player.boosting?PAL.neon:PAL.dim);
    bar(px+22, sy+2, pw-26, 4, player.turbo/100, player.turbo>25?PAL.neon:PAL.bad);
    sy-=10;
  }
  if(player.bumperT>0){
    panel(px,sy,pw,8,0.7);
    drawText(bx,'RAM', px+3, sy+1, 1, PAL.amber);
    bar(px+22, sy+2, pw-26, 4, player.bumperT/90, PAL.amber);
    sy-=10;
  }
  if(player.vest>0){
    panel(px,sy,pw,8,0.7);
    drawText(bx,'VEST LV'+player.vest, px+3, sy+1, 1, PAL.neon);
    sy-=10;
  }
  /* ---- weapon slot ---- */
  const W=WEAPONS[player.weapon];
  const wx=BW-pw-5-74, wy=BH-24;
  panel(wx,wy,70,19,0.82);
  drawText(bx, W.name, wx+4, wy+3, 1, PAL.white);
  if(W.cls==='gun'){
    const ammo=player.ammo[player.weapon]|0;
    drawText(bx, ammo, wx+66, wy+11, 1, ammo>0?(ammo<=5?PAL.bad:PAL.amber):PAL.bad, 'right');
    drawText(bx, W.oneHand?'1H':'2H', wx+4, wy+11, 1, PAL.dim);
  } else drawText(bx, 'MELEE', wx+4, wy+11, 1, PAL.dim);
  /* ---- radio ---- */
  if(!player.onFoot){
    const st=STATIONS[Music.idx];
    const rw=92, rx=5, ry=5+36;
    panel(rx,ry,rw,15,0.62);
    if(st.off) drawText(bx,'RADIO OFF', rx+4, ry+4, 1, PAL.dim);
    else {
      drawText(bx, st.name, rx+4, ry+4, 1, st.col||PAL.neon);
      /* little level meter so the radio feels alive */
      for(let i=0;i<6;i++){
        const lv=Math.abs(Math.sin(now*6+i*1.1));
        bx.fillStyle = lv>0.5? (st.col||PAL.neon) : '#242a3c';
        bx.fillRect(rx+rw-8-i*4, ry+10-lv*4, 2, Math.max(1,lv*5));
      }
    }
  }
  /* ---- minimap ---- */
  drawMinimap();
  /* ---- off-screen target arrow ---- */
  const t=mission?missionTarget():null;
  if(t) offscreenArrow(t.x,t.y,mission.col);
  for(const m of markers) offscreenArrow(m.x,m.y,MTYPE[m.type].col,true);
  /* ---- banner ---- */
  if(banner.t>0){
    const a=clamp(banner.t/0.5,0,1);
    bx.globalAlpha=a;
    const w=Math.max(textW(banner.text,2), textW(banner.sub,1))+24;
    const x=Math.round(BW/2-w/2), y=Math.round(BH*0.30);
    panel(x,y,w,banner.sub?32:22,0.86*a);
    drawText(bx,banner.text,BW/2,y+6,2,banner.col,'center');
    if(banner.sub) drawText(bx,banner.sub,BW/2,y+22,1,PAL.white,'center');
    bx.globalAlpha=1;
  }
  /* ---- contextual prompts ---- */
  let hint=null, hintCol=PAL.neon;
  if(player.onFoot){
    let shop=null;
    for(const s of city.shops){ if(dist2(player.x,player.y,s.x,s.y)<s.r*s.r){ shop=s; break; } }
    if(shop && shop.kind==='weapon') hint='SPACE: GUN SHOP';
    else if(shop && shop.take && !shop.robbed && !robbery.active){ hint='SPACE: HOLD UP THE '+(shop.kind==='gas'?'STATION':'JEWELLER'); hintCol=PAL.bad; }
    else if(shop && shop.robbed>0){ hint='ALREADY HIT - COME BACK LATER'; hintCol=PAL.dim; }
    else hint='SPACE: GET IN A CAR';
  }
  if(hint) drawText(bx,hint,BW/2,BH-14,1,hintCol,'center');
  if(!mission && !markers.length && !player.onFoot)
    drawText(bx,'NEW JOB INCOMING...',BW/2,BH-14,1,PAL.dim,'center');
  drawText(bx,'M MAP   Q WEAPONS   R RADIO   P PAUSE', 5, BH-9, 1, 'rgba(124,138,163,0.55)');
  if(player.wheelOpen) drawWeaponWheel();
}

function drawWeaponWheel(){
  const cx=BW/2, cy=BH/2, R=Math.min(BW,BH)*0.22;
  bx.globalAlpha=0.55; bx.fillStyle='#05070d'; bx.fillRect(0,0,BW,BH); bx.globalAlpha=1;
  bx.globalAlpha=0.7; bx.fillStyle=PAL.panel; circle(cx,cy,R+18); bx.globalAlpha=1;
  bx.fillStyle=PAL.ink; circle(cx,cy,R-16);
  const n=WEAPON_ORDER.length;
  for(let i=0;i<n;i++){
    const k=WEAPON_ORDER[i], W=WEAPONS[k];
    const a=-Math.PI/2 + i/n*TAU;
    const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R;
    const sel=i===player.wheelSel;
    const owned=!!player.owned[k];
    if(sel){ bx.globalAlpha=0.30; bx.fillStyle=PAL.neon; circle(x,y,17); bx.globalAlpha=1; }
    bx.fillStyle= sel?'#1d2a44':'#141a28';
    circle(x,y,14);
    bx.fillStyle= owned ? (sel?PAL.neon:PAL.white) : '#3d4557';
    /* tiny weapon glyphs */
    if(W.cls==='melee'){ bx.fillRect(x-5,y-1,10,2.4); bx.fillRect(x+3,y-2.6,3,5.4); }
    else {
      bx.fillRect(x-6,y-1.2,11,2.6);
      bx.fillRect(x-6,y+1.2,3,3.4);
      if(W.name==='RIFLE'||W.name==='SMG') bx.fillRect(x-2,y+1.4,2.4,4);
    }
    drawText(bx, W.name, x, y+17, 1, owned?(sel?PAL.neon:PAL.dim):'#3d4557','center');
    if(owned && W.cls==='gun') drawText(bx, String(player.ammo[k]|0), x, y-24, 1, PAL.amber,'center');
    drawText(bx, String(i+1), x-11, y-11, 1, 'rgba(124,138,163,0.6)');
  }
  const cur=WEAPONS[WEAPON_ORDER[player.wheelSel]];
  drawText(bx, cur.name, cx, cy-8, 2, player.owned[WEAPON_ORDER[player.wheelSel]]?PAL.neon:PAL.bad, 'center');
  drawText(bx, player.owned[WEAPON_ORDER[player.wheelSel]]?weaponBlurb(WEAPON_ORDER[player.wheelSel]):'NOT OWNED - BUY AT A GUN SHOP',
           cx, cy+8, 1, PAL.dim, 'center');
}
function offscreenArrow(tx,ty,col,small){
  const sx=tx-VX, sy=ty-VY;
  const pad=16;
  if(sx>pad&&sx<BW-pad&&sy>pad&&sy<BH-pad) return;
  const cx=BW/2, cy=BH/2;
  const ang=Math.atan2(sy-cy,sx-cx);
  const rx=BW/2-pad-14, ry=BH/2-pad-14;
  let px2=cx+Math.cos(ang)*rx, py2=cy+Math.sin(ang)*ry;
  const k=Math.min(rx/Math.abs(Math.cos(ang)||1e-4), ry/Math.abs(Math.sin(ang)||1e-4));
  px2=cx+Math.cos(ang)*k; py2=cy+Math.sin(ang)*k;
  bx.save(); bx.translate(px2,py2); bx.rotate(ang);
  bx.fillStyle=col;
  const s=small?3:5;
  bx.beginPath(); bx.moveTo(s+2,0); bx.lineTo(-s,-s); bx.lineTo(-s,s); bx.closePath(); bx.fill();
  bx.restore();
  if(!small) drawText(bx,fmtDist(dist(tx,ty,player.x,player.y)),px2,py2+8,1,col,'center');
}
function drawMinimap(){
  const S=Math.min(84, Math.floor(BH*0.30)), mx=5, my=BH-S-5;
  panel(mx-1,my-1,S+2,S+2,0.86);
  bx.save(); bx.beginPath(); bx.rect(mx,my,S,S); bx.clip();
  const range=620, sc=S/range;
  const wx=player.x-range/2, wy=player.y-range/2;
  const TX=x=>mx+(x-wx)*sc, TY=y=>my+(y-wy)*sc;
  bx.fillStyle='#232a38'; bx.fillRect(mx,my,S,S);
  const i0=Math.floor((wx-CELL)/CELL), i1=Math.ceil((wx+range)/CELL);
  const j0=Math.floor((wy-CELL)/CELL), j1=Math.ceil((wy+range)/CELL);
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const k=blockIdx(i,j); if(k<0) continue;
    const b=city.blocks[k];
    bx.fillStyle = b.type==='park'?'#2c4a31' : b.type==='water'?'#1d3a5c'
                 : b.type==='farm'?'#5c5230' : b.type==='rail'?'#3a3630'
                 : b.type==='garage'?'#1d4c52' : '#141922';
    bx.fillRect(TX(b.x),TY(b.y),Math.ceil(b.w*sc),Math.ceil(b.h*sc));
  }
  /* rail line */
  bx.fillStyle='#6a6256'; bx.fillRect(mx, TY(city.rail.y)-0.5, S, 1);
  /* gps route */
  if(gps.pts.length>1){
    bx.strokeStyle=PAL.neon; bx.lineWidth=1.6; bx.globalAlpha=0.85;
    bx.beginPath();
    bx.moveTo(TX(gps.pts[0].x),TY(gps.pts[0].y));
    for(let i=1;i<gps.pts.length;i++) bx.lineTo(TX(gps.pts[i].x),TY(gps.pts[i].y));
    bx.stroke(); bx.globalAlpha=1; bx.lineWidth=1;
  }
  /* police search zone - the red/blue ring they're sweeping */
  if(search.active && search.r>4){
    const flash = search.flash<0.5;
    bx.strokeStyle = flash?'#ff3b30':'#2b55ff';
    bx.globalAlpha=0.9; bx.lineWidth=1.4;
    bx.beginPath(); bx.arc(TX(search.x),TY(search.y),search.r*sc,0,TAU); bx.stroke();
    bx.globalAlpha=0.14; bx.fillStyle= flash?'#ff3b30':'#2b55ff';
    bx.beginPath(); bx.arc(TX(search.x),TY(search.y),search.r*sc,0,TAU); bx.fill();
    bx.globalAlpha=1; bx.lineWidth=1;
  }
  /* traffic + trains */
  bx.fillStyle='#4e5872';
  for(const v of vehicles){ if(v.mode==='traffic'||v.mode==='parked') bx.fillRect(TX(v.x)-0.5,TY(v.y)-0.5,1.5,1.5); }
  for(const t of trains){ bx.fillStyle='#c9a24a'; bx.fillRect(TX(t.x-t.dir*trainSpan(t))-1, TY(t.y)-1, trainSpan(t)*sc, 2); }
  /* services + shops */
  for(const g of city.garages){ drawMapIcon(TX(g.x),TY(g.y),'garage',PAL.neon); }
  for(const s of city.shops){ drawMapIcon(TX(s.x),TY(s.y),s.kind,s.col); }
  /* police */
  for(const v of vehicles){
    if(v.mode!=='police') continue;
    bx.fillStyle = Math.floor(v.lightPhase/1.4)%2?'#2b55ff':'#ff3b30';
    bx.fillRect(TX(v.x)-1.5,TY(v.y)-1.5,3,3);
  }
  for(const c of cops){ bx.fillStyle='#2b55ff'; bx.fillRect(TX(c.x)-1,TY(c.y)-1,2,2); }
  /* markers + target */
  for(const m of markers){ drawMapIcon(TX(m.x),TY(m.y),'job',MTYPE[m.type].col,MTYPE[m.type].icon); }
  if(mission){ const t=missionTarget(); if(t){ bx.fillStyle=mission.col; const p=1.5+Math.sin(now*6); bx.fillRect(TX(t.x)-p,TY(t.y)-p,p*2,p*2); } }
  /* player */
  bx.save(); bx.translate(TX(player.x),TY(player.y)); bx.rotate(player.a);
  bx.fillStyle=PAL.white; bx.beginPath(); bx.moveTo(4,0); bx.lineTo(-3,-2.6); bx.lineTo(-3,2.6); bx.closePath(); bx.fill();
  bx.restore();
  bx.restore();
  drawText(bx,'N',mx+S/2,my+2,1,'rgba(233,242,255,0.5)','center');
}
/* Distinct little glyphs so the map legend is readable at 3px. */
function drawMapIcon(x,y,kind,col,letter){
  if(kind==='garage'){
    bx.fillStyle=col; bx.fillRect(x-2.5,y-2.5,5,5);
    bx.fillStyle=PAL.ink; bx.fillRect(x-1.5,y-0.5,3,3);
    bx.fillStyle=col; bx.fillRect(x-1.5,y-2,3,1);
  } else if(kind==='job'){
    const p=1+Math.sin(now*4)*0.6;
    bx.save(); bx.translate(x,y); bx.rotate(Math.PI/4);
    bx.fillStyle=col; bx.fillRect(-2-p/2,-2-p/2,4+p,4+p);
    bx.restore();
  } else if(kind==='hospital'){
    bx.fillStyle='#e9f2ff'; bx.fillRect(x-2.5,y-2.5,5,5);
    bx.fillStyle='#ff4b3e'; bx.fillRect(x-1.8,y-0.6,3.6,1.2); bx.fillRect(x-0.6,y-1.8,1.2,3.6);
  } else if(kind==='police'){
    bx.fillStyle='#2b55ff'; bx.fillRect(x-2.5,y-2.5,5,5);
    bx.fillStyle='#e9f2ff'; bx.fillRect(x-1.2,y-1.6,2.4,3.2);
  } else if(kind==='gas'){
    bx.fillStyle=col; bx.fillRect(x-2,y-2.5,4,5);
    bx.fillStyle=PAL.ink; bx.fillRect(x-1,y-1.6,2,1.6);
  } else if(kind==='jewel'){
    bx.save(); bx.translate(x,y); bx.rotate(Math.PI/4);
    bx.fillStyle=col; bx.fillRect(-2,-2,4,4);
    bx.restore();
    bx.fillStyle='#e9f2ff'; bx.fillRect(x-0.6,y-0.6,1.2,1.2);
  } else if(kind==='weapon'){
    bx.fillStyle=col; bx.fillRect(x-2.5,y-1,5,2);
    bx.fillStyle=col; bx.fillRect(x-2.5,y,1.6,2.4);
  }
}

function drawMapScreen(){

/* The big moment. Colour drains, the card slams in, then it slides away. */
function drawDeathScreen(){
  if(!death.kind) return;
  const t=death.t, m=death.max;
  const bustedK = death.kind==='BUSTED';
  /* desaturating wash */
  const wash = clamp(t/1.0,0,1);
  bx.globalAlpha=wash*0.55;
  bx.fillStyle= bustedK ? '#0a1430' : '#2a0508';
  bx.fillRect(0,0,BW,BH);
  bx.globalAlpha=wash*0.30;
  bx.fillStyle='#000'; bx.fillRect(0,0,BW,BH);
  bx.globalAlpha=1;

  /* letterbox bars pushing in */
  const barH=Math.round(BH*0.16*clamp(t/0.6,0,1));
  bx.fillStyle='#04060a';
  bx.fillRect(0,0,BW,barH); bx.fillRect(0,BH-barH,BW,barH);

  /* the word: slams in, holds, then drifts */
  const inT=clamp(t/0.45,0,1);
  const ease=1-Math.pow(1-inT,4);
  const scale = 4 + (1-ease)*3;
  const cy = BH*0.44;
  const col = bustedK ? '#5c8dff' : '#ff2f3e';
  const word = bustedK ? 'BUSTED' : 'WASTED';
  const drift = t>2.6 ? (t-2.6)*6 : 0;
  bx.globalAlpha=clamp(ease,0,1)*clamp((m-t)/0.7,0,1);
  const sc=Math.max(2,Math.round(scale));
  drawText(bx, word, BW/2+3, cy+3-drift, sc, '#05070d', 'center');
  drawText(bx, word, BW/2, cy-drift, sc, col, 'center');
  /* thin rules above and below, drawn out from the centre */
  const rw=Math.round(textW(word,sc)*clamp((t-0.3)/0.5,0,1));
  bx.fillStyle=col;
  bx.fillRect(BW/2-rw/2, cy-9-drift, rw, 1);
  bx.fillRect(BW/2-rw/2, cy+sc*7+6-drift, rw, 1);
  bx.globalAlpha=1;

  if(t>0.9){
    const a=clamp((t-0.9)/0.5,0,1)*clamp((m-t)/0.7,0,1);
    bx.globalAlpha=a;
    const sub = bustedK ? 'CUFFED AND PROCESSED' : death.cause;
    drawText(bx, sub, BW/2, cy+sc*7+14-drift, 1, PAL.white, 'center');
    const fee = bustedK ? 'FINE  25% OF YOUR CASH  -  WEAPONS SEIZED'
                        : 'MEDICAL  15% OF YOUR CASH';
    drawText(bx, fee, BW/2, cy+sc*7+26-drift, 1, PAL.dim, 'center');
    const dest = bustedK ? 'WAKING UP AT THE PRECINCT' : 'WAKING UP AT THE HOSPITAL';
    if(t>1.8) drawText(bx, dest, BW/2, BH-barH-14, 1, PAL.dim, 'center');
    bx.globalAlpha=1;
  }
  /* heartbeat vignette on WASTED */
  if(!bustedK){
    const pulse=0.18+Math.sin(t*7)*0.08;
    bx.globalAlpha=pulse*clamp(t,0,1);
    bx.fillStyle='#8c0f18';
    bx.fillRect(0,0,BW,6); bx.fillRect(0,BH-6,BW,6);
    bx.fillRect(0,0,6,BH); bx.fillRect(BW-6,0,6,BH);
    bx.globalAlpha=1;
  }
}

/* --------------------------- touch controls ------------------------------- */
function layoutTouch(){
  touchUI.btns.length=0;
  if(!touchUI.on) return;
  const s=Math.round(clamp(Math.min(BW,BH)*0.125,20,38)), m=5;
  const by=BH-s-m;
  const h2=Math.round(s*0.62);
  /* left: steering + move */
  touchUI.btns.push({id:'L',x:m,y:by,w:s,h:s,keys:['arrowleft'],label:'<'});
  touchUI.btns.push({id:'R',x:m*2+s,y:by,w:s,h:s,keys:['arrowright'],label:'>'});
  touchUI.btns.push({id:'A',x:m,y:by-h2-m,w:s,h:h2,keys:[' '],label:'USE'});
  touchUI.btns.push({id:'W',x:m*2+s,y:by-h2-m,w:s,h:h2,keys:['q'],label:'WPN'});
  /* right: throttle cluster */
  touchUI.btns.push({id:'B',x:BW-m*2-s*2,y:by,w:s,h:s,keys:['arrowdown'],label:'BRK'});
  touchUI.btns.push({id:'G',x:BW-m-s,y:by,w:s,h:s,keys:['arrowup'],label:'GAS'});
  touchUI.btns.push({id:'H',x:BW-m-s,y:by-h2-m,w:s,h:h2,keys:['shift'],label:'DRIFT'});
  touchUI.btns.push({id:'N',x:BW-m*2-s*2,y:by-h2-m,w:s,h:h2,keys:['f'],label:'NOS'});
  touchUI.btns.push({id:'F',x:BW-m-s,y:by-h2*2-m*2,w:s,h:h2,keys:[],label:'FIRE'});
  touchUI.btns.push({id:'M',x:BW-m*2-s*2,y:by-h2*2-m*2,w:s,h:h2,keys:['m'],label:'MAP'});
}
function drawTouch(){
  if(!touchUI.on) return;
  for(const b of touchUI.btns){
    const on=touchUI.active[b.id];
    const hot = b.id==='F';
    const tint = hot ? PAL.bad : PAL.neon;
    bx.globalAlpha=on?0.55:0.26;
    bx.fillStyle=on?tint:'#0d1220'; bx.fillRect(b.x,b.y,b.w,b.h);
    bx.globalAlpha=on?0.9:0.5;
    bx.fillStyle=tint;
    bx.fillRect(b.x,b.y,b.w,1); bx.fillRect(b.x,b.y+b.h-1,b.w,1);
    bx.fillRect(b.x,b.y,1,b.h); bx.fillRect(b.x+b.w-1,b.y,1,b.h);
    bx.globalAlpha=1;
    drawText(bx,b.label,b.x+b.w/2,b.y+b.h/2-3,1,on?'#06121a':PAL.white,'center');
  }
}
/* ------------------------------ game loop --------------------------------- */
let STATE='title';
let now=0, last=performance.now();

function step(dt){
  updateCrimePressure();
  lightT += dt;
  updateWeather(dt);
  rebuildGrid();
  for(const v of vehicles){
    if(v===player.car && STATE==='play' && v.mode==='player') continue;
    if(v.mode==='traffic') aiTraffic(v,dt);
    else if(v.mode==='police') aiPolice(v,dt);
    else if(v.mode==='parked'){ v.throttle=0; v.brake=1; v.steer=0; v.hand=true; v.engineOn=false; }
  }
  if(STATE==='play' && !death.kind) updatePlayer(dt);
  else if(player.car && !player.onFoot){ player.x=player.car.x; player.y=player.car.y; player.a=player.car.a; }
  for(const v of vehicles) v.update(dt);
  vehicleVsVehicle();
  for(const p of peds) p.update(dt);
  pedCollisions();
  propCollisions();
  updateProps(dt);
  updateCops(dt);
  updateBullets(dt);
  updatePickups(dt);
  updateDebris(dt);
  updateSpikes(dt);
  updateTrains(dt);
  updateParticles(dt);
  if(STATE==='play'){
    updateSearch(dt);
    if(!death.kind){ updateMission(dt); checkMarkers(); checkGarage(); checkGunshop(); updateRobbery(dt); }
  }
  managePopulation();
  updateCamera(dt);
  updateDrops(dt);
  if(banner.t>0) banner.t-=dt;

  /* route guidance to whatever you're currently chasing */
  const gt = mission ? missionTarget() : (markers.length ? nearestMarker() : null);
  updateGPS(dt, gt?gt.x:null, gt?gt.y:null);

  /* score music takes over from the radio while the heat is on */
  const w=wantedLevel();
  Music.chase = w>0 && STATE==='play';
  Music.chaseLvl = w;
  Music.update();
  /* sirens get louder the closer they are */
  let near=0;
  for(const v of vehicles){ if(v.mode==='police' && !v.wrecked) near=Math.max(near, Audio0.att(v.x,v.y)); }
  Audio0.sirenUpdate(dt, w, near);
}
function nearestMarker(){
  let best=null,bd=1e9;
  for(const m of markers){ const d=dist2(m.x,m.y,player.x,player.y); if(d<bd){bd=d;best=m;} }
  return best;
}
function render(){
  const sx = shakeAmt>0 ? (Math.random()*2-1)*shakeAmt : 0;
  const sy = shakeAmt>0 ? (Math.random()*2-1)*shakeAmt : 0;
  const ox=Math.round(cam.x-BW/2+sx), oy=Math.round(cam.y-BH/2+sy);
  VX=ox; VY=oy; VW=BW; VH=BH;
  const dk=darknessNow();
  bx.setTransform(1,0,0,1,0,0);
  bx.fillStyle='#0a0c12'; bx.fillRect(0,0,BW,BH);
  bx.translate(-ox,-oy);
  drawGround();
  drawDecals();
  for(const g of city.garages){ if(inView(g.x,g.y,70)){ bx.fillStyle='#222832'; bx.fillRect(g.apron.x,g.apron.y,g.apron.w,g.apron.h); bx.strokeStyle='#5e6574'; bx.lineWidth=1; bx.strokeRect(g.apron.x+2,g.apron.y+2,g.apron.w-4,g.apron.h-4); bx.fillStyle='#f0c84b'; bx.fillRect(g.apron.x+g.apron.w*0.5-1,g.apron.y+4,2,g.apron.h-8); bx.lineWidth=1; } }
  drawBuildings(false);
  drawTrees();
  drawProps();
  drawPickups();
  for(const p of peds) if(p.state==='dead') drawPed(p);
  for(const p of peds) if(p.state!=='dead') drawPed(p);
  for(const v of vehicles) if(v!==player.car) drawVehicle(v,dk);
  if(player.car) drawVehicle(player.car,dk);
  drawCops();
  if(player.onFoot) drawPlayerFoot();
  drawTrains();
  drawBuildings(true);
  drawBillboards();
  drawJunctions();
  drawLamps(dk);
  drawMarkers();
  drawMissionTargets();
  drawDebris();
  drawBullets();
  drawParticles();
  drawFloats();
  if(STATE==='play' && !death.kind) drawCrosshair();
  lightingPass(ox,oy,dk);
  bx.setTransform(1,0,0,1,0,0);
  drawWeatherOverlay();
  if(STATE==='play'||STATE==='pause'||STATE==='map'){
    if(carjacking.active) { drawHUD(); drawCarBreakIn(); }
    else if(garage.open) drawGarage();
    else if(gunshop.open) drawGunshop();
    else {
      drawHUD();
      drawTouch();
      if(STATE==='pause') drawPause();
      if(STATE==='map') drawMapScreen();
    }
    if(death.kind) drawDeathScreen();
  } else if(STATE==='title'){
    drawTitle();
    drawTouch();
  }
  sctx.setTransform(1,0,0,1,0,0);
  sctx.drawImage(buf,0,0,BW,BH,0,0,screenC.width,screenC.height);
}
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.05) dt=0.05;
  if(dt<=0) dt=1/60;
  /* the death card plays out in slow motion */
  if(death.kind) dt*=0.34;
  now+=dt;
  layoutTouch();
  /* global keys */
  if(hit('mute')){ Audio0.toggle(); float(player.x,player.y-20,Audio0.muted?'SOUND OFF':'SOUND ON',PAL.dim); }
  if(STATE==='title'){
    if(tapped['enter']||hit('action')||tapped['touch_G']||tapped['touch_A']) startGame();
    step(dt);
  } else if(STATE==='play'){
    if(death.kind){ updateDeath(dt); step(dt); }
    else if(carjacking.active){ step(dt); }
    else if(garage.open){ if(garage.phase==='menu') garageInput(); else garageTransition(dt); }
    else if(gunshop.open){ gunshopInput(); }
    else {
      if(hit('pause')){ STATE='pause'; pauseIdx=0; Audio0.skid(0); Audio0.engine(0,0); Audio0.ui('open'); }
      else if(hit('map')){ STATE='map'; Audio0.ui('open'); }
      else step(dt);
    }
  } else if(STATE==='pause'){
    if(hit('up')){ pauseIdx=(pauseIdx+pauseItems.length-1)%pauseItems.length; Audio0.ui('move'); }
    if(hit('down')){ pauseIdx=(pauseIdx+1)%pauseItems.length; Audio0.ui('move'); }
    if(hit('pause')){ STATE='play'; Audio0.ui('close'); }
    if(tapped['enter']||hit('action')){
      Audio0.ui('select');
      if(pauseIdx===0) STATE='play';
      else if(pauseIdx===1){ resetRun(); STATE='play'; }
      else if(pauseIdx===2) Audio0.toggle();
      else { resetRun(); STATE='title'; if(player.car) player.car.mode='traffic'; }
    }
  } else if(STATE==='map'){
    if(hit('map')||hit('pause')){ STATE='play'; Audio0.ui('close'); }
    step(dt);
  }
  render();
  for(const k in tapped) delete tapped[k];
  mouse.pressed=false;
  if(Math.abs(mouse.wheel)>12) mouse.wheel=0;
}

/* ------------------------------- init ------------------------------------- */
function placeCar(x,y,a,type,mode,color){
  const v=new Vehicle(x,y,a,type,mode,color);
  v.ni=nearestNodeI(x); v.nj=nearestNodeJ(y);
  v.dir = Math.abs(Math.cos(a))>0.5 ? (Math.cos(a)>0?0:2) : (Math.sin(a)>0?1:3);
  advanceNode(v); v.a=a;
  vehicles.push(v);
  return v;
}
function resetRun(){
  vehicles.length=0; peds.length=0; parts.length=0; skids.length=0; floats.length=0;
  bullets.length=0; bloods.length=0; pickups.length=0; debris.length=0; dirtTrails.length=0;
  scorches.length=0;
  cops.length=0; spikes.length=0; trains.length=0;
  markers.length=0; mission=null;
  garage.open=false; garage.g=null; gunshop.open=false; gunshop.shop=null;
  robbery.active=null; robbery.crimeT=0; carjacking.active=false; carjacking.v=null; carjacking.feedback=''; death.kind=null; death.t=0;
  search.active=false; search.r=0;
  gps.pts.length=0;
  clearCrimeLedger();
  /* reset every prop and shop back to standing */
  for(const pr of city.props){ pr.hp=pr.k.hp; pr.down=0; pr.fade=1; pr.vx=pr.vy=0; pr.spin=0; pr.spray=0; pr.a=0; }
  for(const sh of city.shops) sh.robbed=0;
  for(const c of city.crossings){ c.down=0; c.warn=0; }
  player.cash=180; player.score=0; player.combo=0; player.comboT=0;
  player.up={engine:0,tires:0,armor:0}; player.hasTurbo=false; player.turbo=0;
  player.bumperT=0; player.hp=player.maxHp;
  player.missionsDone=0; player.deliveries=0; player.distance=0;
  player.weapon='FIST'; player.owned={FIST:true}; player.ammo={};
  player.vest=0; player.kills=0; player.robberies=0; player.flats=0;
  player.headlight=[1,1]; player.wheelOpen=false; player.fireCd=0;
  weather.kind='clear'; weather.wet=0; weather.rainAmt=0; weather.puddles.length=0;
  dayT = 9*DAY_LEN/24;
  trainTimer=rr(18,40);
  lightT=0;
  const p=roadPointNear(WORLD/2,WORLD/2,140);
  const car=placeCar(p.x,p.y,p.a,'sedan','player','#d9d2c4');
  car.__lastHp=car.hp;
  player.car=car; player.onFoot=false; player.x=car.x; player.y=car.y; player.a=car.a;
  cam.x=car.x; cam.y=car.y;
  for(let i=0;i<TRAFFIC_N;i++) spawnTraffic(true);
  managePopulation();
  for(let i=0;i<3;i++) spawnMarker();
  banner.t=0;
}
function startGame(){
  STATE='play';
  if(player.car){ player.car.mode='player'; player.car.color='#e8e3d4'; }
  player.onFoot=false;
  player.owned.BAT=true;
  setBanner('GO','Find a job marker. Make money.',PAL.neon);
  Audio0.unlock();
  Audio0.blip(520,0.08,'triangle',0.12);
  setTimeout(()=>Audio0.blip(780,0.14,'triangle',0.12),100);
}
function boot(){
  genCity();
  setupTouch();
  const p=roadPointNear(WORLD/2,WORLD/2,140);
  const car=placeCar(p.x,p.y,p.a,'sedan','traffic','#d9d2c4');
  player.car=car; player.onFoot=false; player.x=car.x; player.y=car.y;
  cam.x=car.x; cam.y=car.y;
  car.__lastHp=car.hp;
  for(let i=0;i<TRAFFIC_N;i++) spawnTraffic(true);
  managePopulation();
  for(let i=0;i<3;i++) spawnMarker();
  const el=document.getElementById('boot'); if(el) el.remove();
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
