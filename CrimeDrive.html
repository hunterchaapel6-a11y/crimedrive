/* blunt weapons: a short arc sweep in front of the attacker */
function meleeSwing(){
  const W=WEAPONS[player.weapon];
  const reach=W.range, a=player.aimA;
  let hitAny=false, crimeHit=false, vehicleHit=false;
  for(const p of peds){
    if(p.state==='dead') continue;
    const dx=p.x-player.x, dy=p.y-player.y;
    if(dx*dx+dy*dy>reach*reach) continue;
    if(Math.abs(angDiff(a,Math.atan2(dy,dx)))>0.9) continue;
    hurtPed(p, W.dmg, a, true); hitAny=true; crimeHit=true;
  }
  for(const c of cops){
    const dx=c.x-player.x, dy=c.y-player.y;
    if(dx*dx+dy*dy>reach*reach) continue;
    if(Math.abs(angDiff(a,Math.atan2(dy,dx)))>0.9) continue;
    c.hp-=W.dmg; addBlood(c.x,c.y,4); hitAny=true; crimeHit=true;
    if(c.hp<=0) killCop(c);
  }
  const pl=nearProps(player.x,player.y,reach+6);
  for(let n=0;n<pl.length;n++){
    const pr=pl[n];
    if(pr.down) continue;
    const dx=pr.x-player.x, dy=pr.y-player.y;
    if(dx*dx+dy*dy>(reach+pr.k.r)*(reach+pr.k.r)) continue;
    if(Math.abs(angDiff(a,Math.atan2(dy,dx)))>1.0) continue;
    hurtProp(pr, W.dmg, Math.cos(a)*40, Math.sin(a)*40, true); hitAny=true;
  }
  for(const v of vehicles){
    if(v===player.car||v.wrecked) continue;
    const dx=v.x-player.x, dy=v.y-player.y;
    if(dx*dx+dy*dy>(reach+v.w*0.5)*(reach+v.w*0.5)) continue;
    if(Math.abs(angDiff(a,Math.atan2(dy,dx)))>0.9) continue;
    v.damage(W.dmg*0.7); sparks(v.x,v.y,3); hitAny=true; crimeHit=true; vehicleHit=true;
    scarePedsNear(v.x,v.y,60);
  }
  Audio0.swing(hitAny);
  if(vehicleHit) commitCrime('VEHICLE_DAMAGE',Math.max(0.55,W.heat*0.8));
}
function fireWeapon(dt){
  const W=WEAPONS[player.weapon];
  if(player.fireCd>0) return;
  if(W.cls==='melee'){
    if(!player.onFoot) return;
    player.fireCd=W.rate; player.swingT=0.18;
    meleeSwing();
    return;
  }
  if(!player.onFoot && !W.oneHand){
    if(player.warnT<=0){ player.warnT=1.4; float(player.x,player.y-22,'TOO BIG TO DRIVE WITH',PAL.dim); }
    return;
  }
  if((player.ammo[player.weapon]|0)<=0){
    if(player.warnT<=0){ player.warnT=1.0; float(player.x,player.y-22,'OUT OF AMMO',PAL.bad); Audio0.dryFire(); }
    return;
  }
  player.ammo[player.weapon]--;
  player.fireCd=W.rate;
  player.muzzle=0.06; player.recoil=1;
  const base=player.aimA;
  const ox=Math.cos(base)*(player.onFoot?7:player.car.w*0.34);
  const oy=Math.sin(base)*(player.onFoot?7:player.car.w*0.34);
  for(let s=0;s<W.shots;s++){
    const a=base+rr(-W.spread,W.spread);
    spawnBullet(player.x+ox, player.y+oy, a, W.speed*rr(0.94,1.06), W.dmg, W.range, 'player');
  }
  /* ejected brass */
  for(let k=0;k<Math.min(2,W.shots);k++){
    const ea=base+Math.PI/2+rr(-0.4,0.4);
    debris.push({x:player.x+ox,y:player.y+oy,vx:Math.cos(ea)*rr(26,52),vy:Math.sin(ea)*rr(26,52),
                 a:rnd()*TAU,spin:rr(-14,14),w:1.4,h:0.9,col:'#c9a24a',life:1,max:rr(1.2,2.4)});
  }
  Audio0.gunshot(W.name==='SHOTGUN'?1.4:(W.name==='RIFLE'?1.2:1), player.x, player.y);
  commitCrime('FIREARM_DISCHARGE',0.72 + W.heat*0.58);
  scarePedsNear(player.x,player.y,150);
  shake(W.name==='SHOTGUN'?2.4:(W.name==='RIFLE'?1.5:0.9));
}
function scarePedsNear(x,y,r){
  for(const p of peds){
    if(p.state==='dead') continue;
    if(dist2(p.x,p.y,x,y)<r*r){ p.state='panic'; p.t=rr(2.2,4.4); p.alert=1.6; p.flee={x,y}; }
  }
}
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    const step=Math.hypot(b.vx,b.vy)*dt;
    b.px=b.x; b.py=b.y;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    b.left-=step;
    let dead = b.left<=0 || b.x<0||b.y<0||b.x>WORLD||b.y>WORLD;
    if(!dead){
      /* walls */
      blocksNear(b.x,b.y,2,_bl);
      for(const bl of _bl){
        for(const bd of bl.buildings){
          if(b.x>bd.x&&b.x<bd.x+bd.w&&b.y>bd.y&&b.y<bd.y+bd.h){
            dead=true; sparks(b.x,b.y,3);
            if(bd.water) splash(b.x,b.y);
            break;
          }
        }
        if(dead) break;
      }
    }
    if(!dead){
      /* street furniture */
      const pl=nearProps(b.x,b.y,10);
      for(let n=0;n<pl.length;n++){
        const pr=pl[n];
        if(pr.down) continue;
        if(dist2(pr.x,pr.y,b.x,b.y)<pr.k.r*pr.k.r){
          hurtProp(pr,b.dmg,b.vx*0.05,b.vy*0.05,b.owner==='player'); dead=true; break;
        }
      }
    }
    if(!dead){
      /* people */
      for(const p of peds){
        if(p.state==='dead') continue;
        if(dist2(p.x,p.y,b.x,b.y)<16){
          hurtPed(p,b.dmg,Math.atan2(b.vy,b.vx), b.owner==='player');
          dead=true; break;
        }
      }
    }
    if(!dead && b.owner==='player'){
      for(const c of cops){
        if(dist2(c.x,c.y,b.x,b.y)<18){
          c.hp-=b.dmg; addBlood(c.x,c.y,5);
          if(c.hp<=0) killCop(c); else c.state='chase';
          dead=true; break;
        }
      }
    }
    if(!dead && b.owner==='cop'){
      if(player.onFoot){
        if(dist2(player.x,player.y,b.x,b.y)<20){
          player.hp-=b.dmg*(1-player.vest*0.25); addBlood(player.x,player.y,5);
          shake(2); Audio0.hit(); dead=true;
          if(player.hp<=0) wasted('SHOT');
        }
      } else if(player.car && dist2(player.car.x,player.car.y,b.x,b.y)<Math.pow(player.car.w*0.5,2)){
        player.car.damage(b.dmg*0.7); sparks(b.x,b.y,3); dead=true; shake(0.8);
      }
    }
    if(!dead){
      /* other vehicles */
      const list=nearVehicles(b.x,b.y,30);
      for(const v of list){
        if(v===player.car && b.owner==='player') continue;
        if(v.wrecked) continue;
        const dx=b.x-v.x, dy=b.y-v.y;
        const c=Math.cos(v.a), s=Math.sin(v.a);
        const f=dx*c+dy*s, l=-dx*s+dy*c;
        if(vehicleHitsPoint(v,b.x,b.y,0)){
          v.damage(b.dmg*0.85); sparks(b.x,b.y,3);
          if(b.owner==='player'){
            if(v.mode==='traffic' && !v.spooked){ v.spooked=true; v.cruise*=1.5; commitCrime('RECKLESS_VEHICLE_DAMAGE'); }
            if(v.mode==='police') commitCrime('POLICE_VEHICLE_HIT');
          }
          dead=true; break;
        }
      }
    }
    if(dead) bullets.splice(i,1);
  }
}
function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    p.life-=dt; p.bob+=dt*4;
    if(p.life<=0 || dist2(p.x,p.y,player.x,player.y)>700*700){ pickups.splice(i,1); continue; }
    if(dist2(p.x,p.y,player.x,player.y) < (player.onFoot?13*13:20*20)){
      if(p.kind==='cash'){ addCash(p.amt,''); float(p.x,p.y-8,'+$'+p.amt,PAL.good); Audio0.coin(); }
      else { player.ammo[p.wk]=(player.ammo[p.wk]|0)+p.amt; float(p.x,p.y-8,'+'+p.amt+' '+WEAPONS[p.wk].name,PAL.amber); Audio0.coin(); }
      pickups.splice(i,1);
    }
  }
}
function updateDebris(dt){
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    d.vx-=d.vx*3.2*dt; d.vy-=d.vy*3.2*dt;
    d.a+=d.spin*dt; d.spin-=d.spin*2.4*dt;
    d.life-=dt/d.max;
    if(d.life<=0) debris.splice(i,1);
  }
  for(let i=bloods.length-1;i>=0;i--){ bloods[i].life-=dt*0.018; if(bloods[i].life<=0) bloods.splice(i,1); }
  for(let i=dirtTrails.length-1;i>=0;i--){ dirtTrails[i].life-=dt*0.085; if(dirtTrails[i].life<=0) dirtTrails.splice(i,1); }
  for(let i=scorches.length-1;i>=0;i--){ scorches[i].life-=dt*0.012; if(scorches[i].life<=0) scorches.splice(i,1); }
}

/* ------------------------------- railway --------------------------------- */
const trains=[];
let trainTimer=rr(18,40);
function spawnTrain(){
  const dir = rnd()<0.5?1:-1;
  const n = ri(5,9);
  trains.push({dir, x: dir>0 ? -280 : WORLD+280, y:city.rail.y, speed:rr(165,215), n, hornT:0});
}
function trainSpan(t){ return 34 + t.n*30; }
function updateTrains(dt){
  trainTimer-=dt;
  if(trainTimer<=0 && trains.length<2){ trainTimer=rr(26,55); spawnTrain(); }
  const railY=city.rail.y;
  for(let i=trains.length-1;i>=0;i--){
    const t=trains[i];
    t.x += t.dir*t.speed*dt;
    const span=trainSpan(t);
    if((t.dir>0 && t.x-span>WORLD+300) || (t.dir<0 && t.x+span<-300)){ trains.splice(i,1); continue; }
    /* horn as it nears the player's crossing */
    const near=Audio0.att(t.x,railY);
    if(near>0.05){
      t.hornT-=dt;
      if(t.hornT<=0){ t.hornT=rr(2.2,4.5); Audio0.blip(150,0.5,'sawtooth',0.07*near); Audio0.blip(190,0.5,'sawtooth',0.05*near); }
      if(rnd()<dt*26) puff(t.x - t.dir*10, railY+rr(-4,4), '#4a4a4a', 9);
    }
    /* anything caught on the line gets flattened */
    const headX=t.x, tailX=t.x - t.dir*span;
    const x0=Math.min(headX,tailX)-6, x1=Math.max(headX,tailX)+6;
    for(const v of vehicles){
      let onLine = v.y>=railY-9 && v.y<=railY+9 && v.x>=x0 && v.x<=x1;
      if(!onLine && hasTrailer(v)) onLine = v.trailerY>=railY-9 && v.trailerY<=railY+9 && v.trailerX>=x0 && v.trailerX<=x1;
      if(!onLine) continue;
      const f=t.dir*260;
      v.vx+=f; v.vy+=rr(-90,90);
      v.damage(160);
      if(!v.hitByTrain){ v.hitByTrain=true; sparks(v.x,v.y,14); shake(v===player.car?9:3); Audio0.crash(v===player.car?0.5:0.25); }
      if(v===player.car){ shake(9); }
    }
    for(const p of peds){
      if(p.state==='dead') continue;
      if(p.y<railY-8||p.y>railY+8) continue;
      if(p.x<x0||p.x>x1) continue;
      p.a=t.dir>0?0:Math.PI; killPed(p,false,true);
    }
    if(player.onFoot && player.y>railY-8 && player.y<railY+8 && player.x>x0 && player.x<x1){
      player.hp=0; wasted('TRAIN');
    }
  }
  /* barriers drop when something is bearing down on the crossing */
  for(const c of city.crossings){
    let soon=0;
    for(const t of trains){
      const ahead=(c.x - t.x)*t.dir;
      if(ahead > -trainSpan(t) && ahead < t.speed*4.5) soon=1;
    }
    c.warn = soon;
    c.down = clamp(c.down + (soon? dt*2.4 : -dt*1.8), 0, 1);
    if(soon){ c.ding=(c.ding||0)+dt; if(c.ding>0.62){ c.ding=0; const a=Audio0.att(c.x,c.y); if(a>0.08) Audio0.blip(1180,0.09,'triangle',0.05*a); } }
  }
}

/* ------------------------------ robbery ---------------------------------- */
const robbery = { active:null, t:0, total:0, crimeT:0 };
function updateRobbery(dt){
  if(robbery.active){
    const s=robbery.active;
    if(!player.onFoot || dist2(player.x,player.y,s.x,s.y)>s.r*s.r*2.2){
      float(player.x,player.y-20,'ROBBERY ABANDONED',PAL.bad);
      Audio0.ui('deny'); robbery.active=null; robbery.crimeT=0; return;
    }
    robbery.t+=dt;
    if(rnd()<dt*7) float(s.x+rr(-10,10), s.y-rr(6,18), '$', PAL.good);
    if(robbery.t>=robbery.total){
      const take=ri(s.take[0],s.take[1]);
      addCash(take,'ROBBED');
      addScore(Math.round(take*0.5),'HEIST');
      player.robberies++;
      s.robbed=110;                       /* cooled down before it's worth hitting again */
      setBanner('CLEANED OUT','+$'+take+'  -  RUN!',PAL.good);
      commitCrime('ROBBERY_COMPLETE');
      robbery.active=null; robbery.crimeT=0;
      Audio0.ui('select');
      return;
    }
    robbery.crimeT=(robbery.crimeT||0)-dt; if(robbery.crimeT<=0){ robbery.crimeT=0.8; commitCrime('ROBBERY_PRESSURE'); }
  }
  for(const s of city.shops){ if(s.robbed>0) s.robbed-=dt; }
}
function tryRobbery(){
  if(robbery.active || !player.onFoot) return false;
  for(const s of city.shops){
    if(!s.take || s.robbed>0) continue;
    if(dist2(player.x,player.y,s.x,s.y) < s.r*s.r){
      const W=WEAPONS[player.weapon];
      if(W.cls!=='gun'){ float(player.x,player.y-20,'NEED A GUN FOR THAT',PAL.bad); Audio0.ui('deny'); return true; }
      robbery.active=s; robbery.t=0; robbery.crimeT=0;
      robbery.total = s.kind==='jewel'? 7.5 : 4.5;
      setBanner('HANDS UP','Hold the place up',PAL.bad);
      commitCrime('ROBBERY_START');
      scarePedsNear(s.x,s.y,140);
      Audio0.gunshot(1,player.x,player.y);
      return true;
    }
  }
  return false;
}

/* ------------------------------ gun shop --------------------------------- */
const gunshop = { open:false, idx:0, shop:null, flash:0 };
function gunshopItems(){
  const items=[];
  for(const k of WEAPON_ORDER){
    const W=WEAPONS[k];
    if(k==='FIST') continue;
    if(!player.owned[k]) items.push({t:W.name, cost:W.price, d:weaponBlurb(k), ok:true, act:()=>{ player.owned[k]=true; player.weapon=k; if(W.clip) player.ammo[k]=(player.ammo[k]|0)+W.clip*2; }});
    else if(W.ammoBuy) items.push({t:W.name+' AMMO x'+W.ammoBuy, cost:W.ammoCost, d:'Carrying '+(player.ammo[k]|0)+' rounds', ok:true, act:()=>{ player.ammo[k]=(player.ammo[k]|0)+W.ammoBuy; }});
  }
  items.push({t:'BODY ARMOUR LV'+player.vest, cost:260+player.vest*220, d:'Soak 25% more incoming fire', ok:player.vest<3, act:()=>{ player.vest++; }});
  items.push({t:'LEAVE', cost:0, d:'Back to the street', ok:true, act:()=>{ closeGunshop(); }});
  return items;
}
function weaponBlurb(k){
  const W=WEAPONS[k];
  if(W.cls==='melee') return 'Quiet. No ammo. Short reach.';
  return (W.oneHand?'One handed - fire while driving':'Two handed - on foot only')+'  '+W.clip+' rnd';
}
function checkGunshop(){
  if(gunshop.open||!player.onFoot) return;
  for(const s of city.shops){
    if(s.kind!=='weapon') continue;
    if(dist2(player.x,player.y,s.x,s.y)<s.r*s.r){ openGunshop(s); break; }
  }
}
function openGunshop(s){
  if(player.heat>=1){ if(player.warnT<=0){ player.warnT=1.4; float(player.x,player.y-20,'NOT WHILE YOU ARE WANTED',PAL.bad);} return; }
  gunshop.open=true; gunshop.shop=s; gunshop.idx=0; Audio0.ui('open');
}
function closeGunshop(){
  gunshop.open=false;
  const s=gunshop.shop;
  if(s){ player.y = s.y + 22; }
  gunshop.shop=null; Audio0.ui('close');
}
function gunshopInput(){
  const items=gunshopItems();
  gunshop.idx=clamp(gunshop.idx,0,items.length-1);
  if(hit('up')){ gunshop.idx=(gunshop.idx-1+items.length)%items.length; Audio0.ui('move'); }
  if(hit('down')){ gunshop.idx=(gunshop.idx+1)%items.length; Audio0.ui('move'); }
  if(hit('action')||tapped['enter']){
    const it=items[gunshop.idx];
    if(it.cost===0){ it.act(); return; }
    if(!it.ok || player.cash<it.cost){ gunshop.flash=0.4; Audio0.ui('deny'); return; }
    player.cash-=it.cost; it.act(); Audio0.ui('select');
  }
  if(hit('pause')) closeGunshop();
  gunshop.flash=Math.max(0,gunshop.flash-0.05);
}

/* ------------------------------ player ----------------------------------- */
const player = {
  car:null, onFoot:false, x:0, y:0, a:0, hp:100, maxHp:100,
  cash:180, score:0, best:0, combo:0, comboT:0,
  up:{engine:0,tires:0,armor:0},
  hasTurbo:false, turbo:0, boosting:false, bumperT:0,
  heat:0, heatCool:0, inPuddle:false, walkT:0, enterCool:0,
  driftT:0, driftBank:0, airT:0, deliveries:0, missionsDone:0, distance:0,
  /* gunplay */
  weapon:'FIST', owned:{FIST:true}, ammo:{}, fireCd:0, aimA:0, muzzle:0, recoil:0,
  swingT:0, warnT:0, vest:0, wheelOpen:false, wheelSel:0, kills:0, robberies:0,
  flats:0, headlight:[1,1], busted:0, deathT:0
};
const carjacking = {active:false, mode:null, v:null, t:0, hits:0, need:5, checks:0, needChecks:1, phase:0, target:0.50, feedback:'', feedbackT:0, failed:false, startX:0, startY:0};
let shakeAmt=0;
function shake(v){ shakeAmt=Math.min(9,shakeAmt+v); }
function addScore(v,label){
  const mult = 1 + Math.min(player.combo,9)*0.5;
  const got = Math.round(v*mult);
  player.score += got;
  if(label) float(player.x, player.y-16, label+' +'+got, PAL.amber);
  player.combo = Math.min(player.combo+1, 12); player.comboT=4.2;
}
function addCash(v,label){
  player.cash=Math.max(0,player.cash+v);
  if(label) float(player.x, player.y-24, label+' '+(v<0?'-$':'+$')+Math.abs(v), v<0?PAL.bad:PAL.good);
}
function addHeat(v,kind='FIREARM_DISCHARGE',label){
  /* Backward-compatible entry point for any future crime hooks. Existing
     gameplay now passes explicit offense kinds at the call sites below. */
  return commitCrime(kind,Math.max(0,v),label);
}
function nearestStealableVehicle(){
  let best=null,bd=52*52;
  for(const v of vehicles){
    if(v===player.car || v.wrecked) continue;
    const d=dist2(v.x,v.y,player.x,player.y);
    if(d<bd){ bd=d; best=v; }
  }
  return best;
}
function ejectVehicleDriver(v){
  const b=nearestBlockTo(v.x,v.y);
  if(!b) return;
  const p=new Ped(b);
  p.x=v.x-Math.sin(v.a)*11; p.y=v.y+Math.cos(v.a)*11;
  p.state='panic'; p.t=3.4; p.flee={x:v.x,y:v.y}; p.snapBlock(); peds.push(p);
  v.driverOut=true;
}
function takeVehicle(v,breakWindow){
  if(!v || v.wrecked) return;
  if(player.car && player.car!==v){
    player.car.mode='parked'; player.car.parked=true; player.car.throttle=0; player.car.brake=1; player.car.engineOn=false;
  }
  const wasActive = v.mode==='traffic'||v.mode==='police';
  if(wasActive){
    ejectVehicleDriver(v);
    float(v.x,v.y-14,'CARJACKED',PAL.neon);
    Audio0.horn(v.x,v.y,v.type);
    scarePedsNear(v.x,v.y,80);
    commitCrime(v.mode==='police'?'POLICE_CARJACK':'CARJACK');
    if(v.mode==='police'){
      for(let i=cops.length-1;i>=0;i--) if(cops[i].car===v) cops[i].dead=true;
      v.driverOut=false;
    }
  } else {
    float(v.x,v.y-14,breakWindow?'WINDOW SMASHED':'HOTWIRED',PAL.neon);
    if(breakWindow){
      v.driverWindowBroken=true;
      commitCrime('WINDOW_SMASH');
      Audio0.crash(0.08);
    } else commitCrime('HOTWIRE');
  }
  if(v!==player.car) player.flats=0;
  player.headlight=[1,1];
  v.mode='player'; v.parked=false; v.engineOn=true; v.driverOut=false;
  v.maxHp=v.spec.hp+player.up.armor*34;
  v.hp=Math.min(v.hp,v.maxHp); v.__lastHp=v.hp;
  player.car=v; player.onFoot=false; player.x=v.x; player.y=v.y; player.a=v.a;
  Audio0.blip(520,0.08,'square',0.09);
  const st=STATIONS[Music.idx];
  if(!st.off) float(v.x,v.y-22,st.name,st.col||PAL.dim);
}
function beginCarBreakIn(v){
  if(!v || v.wrecked) return;
  carjacking.active=true; carjacking.v=v; carjacking.feedback=''; carjacking.feedbackT=0; carjacking.failed=false;
  carjacking.startX=v.x; carjacking.startY=v.y;
  if(v.mode==='traffic'||v.mode==='police'){
    carjacking.mode='mash'; carjacking.t=3.8; carjacking.hits=0; carjacking.need=5;
    v.throttle=0; v.brake=1; v.hand=true; v.vx*=0.22; v.vy*=0.22;
    float(v.x,v.y-16,'BREAK IN',PAL.neon);
  } else if(wantedLevel()>0){
    takeVehicle(v,true); carjacking.active=false; carjacking.v=null;
  } else {
    carjacking.mode='skill'; carjacking.t=7.0; carjacking.checks=0; carjacking.needChecks=1; carjacking.phase=0; carjacking.target=rr(0.40,0.60);
    v.throttle=0; v.brake=1; v.hand=true; v.vx*=0.1; v.vy*=0.1;
    float(v.x,v.y-16,'HOTWIRE','PAL.neon');
  }
}
function updateCarBreakIn(dt){
  const v=carjacking.v;
  if(!carjacking.active || !v || v.wrecked){ carjacking.active=false; carjacking.v=null; return; }
  if(v.mode==='traffic'||v.mode==='police'){ v.throttle=0; v.brake=1; v.hand=true; v.vx*=Math.max(0,1-7*dt); v.vy*=Math.max(0,1-7*dt); }
  carjacking.feedbackT=Math.max(0,carjacking.feedbackT-dt);
  if(carjacking.mode==='mash'){
    carjacking.t-=dt;
    if(mouse.pressed){
      carjacking.hits++; carjacking.feedback='GOOD'; carjacking.feedbackT=0.18;
      if(carjacking.hits>=carjacking.need){ takeVehicle(v,false); carjacking.active=false; carjacking.v=null; return; }
    }
    if(carjacking.t<=0){
      carjacking.feedback='FAILED'; carjacking.feedbackT=0.8;
      commitCrime('CARJACK_FAIL'); Audio0.ui('deny');
      v.throttle=0; v.brake=0; v.hand=false; carjacking.failed=true; carjacking.active=false; carjacking.v=null;
    }
  } else if(carjacking.mode==='skill'){
    carjacking.t-=dt; carjacking.phase=(carjacking.phase+dt*1.65)%1;
    if(mouse.pressed){
      const x=carjacking.phase;
      const good=Math.abs(x-carjacking.target)<0.065;
      if(good){
        carjacking.checks++; carjacking.feedback='PERFECT'; carjacking.feedbackT=0.35;
        carjacking.target=rr(0.32,0.68); carjacking.phase=rr(0.10,0.90);
        Audio0.ui('select');
        if(carjacking.checks>=carjacking.needChecks){ takeVehicle(v,false); carjacking.active=false; carjacking.v=null; return; }
      } else {
        carjacking.feedback='MISSED'; carjacking.feedbackT=0.55;
        commitCrime('CARJACK_FAIL',1.15); Audio0.ui('deny');
        v.throttle=0; v.brake=0; v.hand=false; carjacking.active=false; carjacking.v=null; return;
      }
    }
    if(carjacking.t<=0){ commitCrime('CARJACK_FAIL'); v.throttle=0; v.brake=0; v.hand=false; carjacking.active=false; carjacking.v=null; }
  }
}
function enterExit(){
  if(player.enterCool>0 || carjacking.active) return;
  player.enterCool=0.35;
  if(!player.onFoot){
    const c=player.car; player.onFoot=true;
    const off=c.h/2+6;
    player.x=c.x-Math.sin(c.a)*off; player.y=c.y+Math.cos(c.a)*off; player.a=c.a;
    c.mode='parked'; c.parked=true; c.engineOn=false; c.throttle=0; c.brake=1; c.steer=0;
    Audio0.engine(0,0); Audio0.skid(0); Audio0.blip(330,0.08,'square',0.09);
  } else {
    let best=null,bd=50*50;
    for(const v of vehicles){
      if(v.wrecked) continue;
      let d=dist2(v.x,v.y,player.x,player.y); if(v===player.car) d*=0.55;
      if(d<bd){bd=d; best=v;}
    }
    if(!best){ float(player.x,player.y-12,'NO CAR NEARBY',PAL.dim); return; }
    if(best===player.car){
      best.mode='player'; best.parked=false; best.engineOn=true; player.onFoot=false; player.x=best.x; player.y=best.y; return;
    }
    beginCarBreakIn(best);
  }
}

function nearestBlockTo(x,y){
  let best=null,bd=1e9;
  for(const b of city.blocks){
    const cx=clamp(x,b.x,b.x+b.w), cy=clamp(y,b.y,b.y+b.h);
    const d=dist2(cx,cy,x,y); if(d<bd){bd=d;best=b;}
  }
  return best;
}
function updatePlayer(dt){
  if(carjacking.active){ updateCarBreakIn(dt); return; }
  player.enterCool=Math.max(0,player.enterCool-dt);
  if(player.comboT>0){ player.comboT-=dt; if(player.comboT<=0) player.combo=0; }
  if(player.bumperT>0) player.bumperT-=dt;
  player.fireCd=Math.max(0,player.fireCd-dt);
  player.warnT=Math.max(0,player.warnT-dt);
  player.muzzle=Math.max(0,player.muzzle-dt);
  player.recoil=Math.max(0,player.recoil-dt*7);
  player.swingT=Math.max(0,player.swingT-dt);

  /* aim: mouse when we have one, otherwise whichever way we're facing */
  if(mouse.active){
    player.aimA=Math.atan2(mouse.wy-player.y, mouse.wx-player.x);
  } else if(touchUI.on && touchUI.active.F){
    player.aimA=player.a;
  } else player.aimA=player.a;

  /* weapon wheel + quick slots */
  if(down('wheel') && player.onFoot!==null){
    if(!player.wheelOpen){ player.wheelOpen=true; player.wheelSel=WEAPON_ORDER.indexOf(player.weapon); Audio0.ui('open'); }
  } else if(player.wheelOpen){
    player.wheelOpen=false;
    const k=WEAPON_ORDER[player.wheelSel];
    if(player.owned[k] && k!==player.weapon){ player.weapon=k; Audio0.ui('select'); float(player.x,player.y-22,WEAPONS[k].name,PAL.neon); }
    else Audio0.ui('close');
  }
  if(player.wheelOpen){
    if(hit('left')||hit('up')){ player.wheelSel=(player.wheelSel-1+WEAPON_ORDER.length)%WEAPON_ORDER.length; Audio0.ui('move'); }
    if(hit('right')||hit('down')){ player.wheelSel=(player.wheelSel+1)%WEAPON_ORDER.length; Audio0.ui('move'); }
    if(mouse.wheel!==0){
      const dir=mouse.wheel>0?1:-1;
      player.wheelSel=(player.wheelSel+dir+WEAPON_ORDER.length)%WEAPON_ORDER.length;
      mouse.wheel=0; Audio0.ui('move');
    }
  } else {
    for(let k=1;k<=6;k++){
      if(tapped[String(k)]){
        const w=WEAPON_ORDER[k-1];
        if(player.owned[w]){ player.weapon=w; Audio0.ui('select'); float(player.x,player.y-22,WEAPONS[w].name,PAL.neon); }
        else { Audio0.ui('deny'); float(player.x,player.y-22,'NOT CARRYING THAT',PAL.dim); }
      }
    }
    if(tapped['q']===undefined && (hit('cycle'))){
      let i=WEAPON_ORDER.indexOf(player.weapon);
      for(let n=0;n<WEAPON_ORDER.length;n++){
        i=(i+1)%WEAPON_ORDER.length;
        if(player.owned[WEAPON_ORDER[i]]){ player.weapon=WEAPON_ORDER[i]; Audio0.ui('select'); break; }
      }
    }
  }
  /* trigger */
  const W=WEAPONS[player.weapon];
  const firing = (mouse.down || down('fire') || (touchUI.on && touchUI.active.F));
  if(firing && !player.wheelOpen && !robbery.active){
    if(W.auto || !player.firedHeld) fireWeapon(dt);
    player.firedHeld=true;
  } else player.firedHeld=false;

  /* radio */
  if(hit('radio')){
    const s=Music.next(1);
    float(player.x,player.y-26, s.off?'RADIO OFF':s.name, s.col||PAL.dim);
  }

  /* action: hold up a shop if you're stood in one, otherwise get in or out */
  if((hit('action')||tapped['enter']) && !player.wheelOpen){
    if(!(player.onFoot && tryRobbery())) enterExit();
  }

  if(player.onFoot){
    Audio0.engine(0,0);
    let ix=0,iy=0;
    if(!player.wheelOpen){
      if(down('left'))ix--; if(down('right'))ix++;
      if(down('up'))iy--; if(down('down'))iy++;
    }
    const l=Math.hypot(ix,iy)||1;
    const sp = (down('hand')?52:30);
    if(ix||iy){
      player.x+=ix/l*sp*dt; player.y+=iy/l*sp*dt;
      player.a=Math.atan2(iy,ix); player.walkT+=dt*(sp/12);
    }
    player.x=clamp(player.x,6,WORLD-6); player.y=clamp(player.y,6,WORLD-6);
    /* push out of buildings */
    blocksNear(player.x,player.y,6,_bl);
    for(const b of _bl) for(const bd of b.buildings){
      if(player.x>bd.x-2&&player.x<bd.x+bd.w+2&&player.y>bd.y-2&&player.y<bd.y+bd.h+2){
        const dl=player.x-(bd.x-2), dr=(bd.x+bd.w+2)-player.x, dtp=player.y-(bd.y-2), db=(bd.y+bd.h+2)-player.y;
        const m=Math.min(dl,dr,dtp,db);
        if(m===dl)player.x=bd.x-2; else if(m===dr)player.x=bd.x+bd.w+2;
        else if(m===dtp)player.y=bd.y-2; else player.y=bd.y+bd.h+2;
      }
    }
    /* fountains/ponds are solid decorative geometry on foot too. */
    for(const b of _bl){
      const decos=[];
      if(b.fountain) decos.push(b.fountain);
      if(b.pond) decos.push(b.pond);
      for(const d of decos){
        const dx=player.x-d.x, dy=player.y-d.y, d2=dx*dx+dy*dy, rr0=d.r+3;
        if(d2<rr0*rr0 && d2>0.0001){
          const dl=Math.sqrt(d2);
          player.x=d.x+dx/dl*rr0; player.y=d.y+dy/dl*rr0;
        }
      }
    }
    /* run over by traffic */
    const list=nearVehicles(player.x,player.y,26);
    for(const v of list){
      if(v.mode==='parked') continue;
      const dx=player.x-v.x, dy=player.y-v.y;
      const c=Math.cos(v.a), s=Math.sin(v.a);
      const f=dx*c+dy*s, lt=-dx*s+dy*c;
      if(v.speed>20 && vehicleHitsPoint(v,player.x,player.y,3)){
        player.hp-=v.speed*0.28; shake(3); Audio0.crash(0.3);
        const d=Math.hypot(dx,dy)||1; player.x+=dx/d*10; player.y+=dy/d*10;
        float(player.x,player.y-12,'OUCH',PAL.bad);
        /* Police vehicle impacts can hurt the player, but never directly bust them. */
      }
    }
    if(player.hp<=0) wasted('DOWN');
  } else {
    const c=player.car;
    if(!c){ player.onFoot=true; return; }
    let steer=0, th=0, br=0;
    if(!player.wheelOpen){
      if(down('left'))steer-=1; if(down('right'))steer+=1;
      if(down('up'))th=1;
      if(down('down')){ if(c.vf>4) br=1; else th=-1; }
    }
    /* a flat pulls to one side */
    if(player.flats>0 && Math.abs(c.vf)>20) steer += (player.flats===1?0.16:0.3)*Math.sin(now*2.2);
    c.steer=clamp(steer,-1,1); c.throttle=c.wrecked?0:th; c.brake=br; c.hand=down('hand');
    if(hit('horn')){ Audio0.horn(c.x,c.y,c.type); scarePedsNear(c.x,c.y,70); }
    /* nitrous */
    player.boosting=false;
    if(player.hasTurbo && down('boost') && player.turbo>2 && !c.wrecked && c.vf>3){
      player.boosting=true; player.turbo=Math.max(0,player.turbo-34*dt);
      c.boostFlame=1;
      if(rnd()<0.6) { const nc=Math.cos(c.a), ns=Math.sin(c.a); parts.push({x:c.x-nc*c.w*0.5,y:c.y-ns*c.w*0.5,vx:-nc*60+rr(-10,10),vy:-ns*60+rr(-10,10),r:rr(1.5,3),gr:4,life:1,max:0.3,col:rnd()<0.5?'#7fd8ff':'#ffffff',type:1}); }
    } else if(player.hasTurbo){
      player.turbo=Math.min(100,player.turbo+11*dt);
    }
    c.boostFlame=Math.max(0,c.boostFlame-dt*4);
    player.x=c.x; player.y=c.y; player.a=c.a;
    player.distance += c.speed*dt;
    /* drift scoring */
    if(c.drift>0.3 && c.speed>40 && !c.wrecked){
      player.driftT+=dt; player.driftBank+=c.drift*c.speed*dt*0.34;
      Audio0.skid(clamp(c.drift,0,1));
    } else {
      Audio0.skid(0);
      if(player.driftT>0.7){
        const pts=Math.round(player.driftBank);
        if(pts>12){ addScore(pts,'DRIFT'); Audio0.blip(700+Math.min(pts,400),0.08,'triangle',0.08); }
      }
      player.driftT=0; player.driftBank=0;
    }
    /* puddles */
    player.inPuddle=false;
    for(const p of weather.puddles){
      if(dist2(p.x,p.y,c.x,c.y)<p.r*p.r){
        player.inPuddle=true;
        if(c.speed>45 && rnd()<0.4) splash(c.x+rr(-6,6),c.y+rr(-6,6));
        break;
      }
    }
    /* near miss bonus */
    if(c.speed>60){
      const list=nearVehicles(c.x,c.y,30);
      for(const o of list){
        if(o===c||o.mode==='parked') continue;
        const d2=dist2(o.x,o.y,c.x,c.y);
        if(d2<22*22 && d2>13*13 && !o.__nm){ o.__nm=1.2; addScore(25,'NEAR MISS'); }
      }
    }
    for(const o of vehicles) if(o.__nm) o.__nm=Math.max(0,o.__nm-dt);
    /* churning up grass and dirt leaves a trail behind you */
    const offRoad = groundUnder(c.x,c.y);
    if(offRoad && c.speed>26){
      c.dirtT=(c.dirtT||0)-dt;
      if(c.dirtT<=0){
        c.dirtT=0.05;
        if(dirtTrails.length>240) dirtTrails.shift();
        const nc=Math.cos(c.a), ns=Math.sin(c.a);
        dirtTrails.push({x:c.x-nc*c.w*0.34-ns*c.h*0.36, y:c.y-ns*c.w*0.34+nc*c.h*0.36, a:c.a, life:1, col:offRoad});
        dirtTrails.push({x:c.x-nc*c.w*0.34+ns*c.h*0.36, y:c.y-ns*c.w*0.34-nc*c.h*0.36, a:c.a, life:1, col:offRoad});
        if(rnd()<0.5) puff(c.x-nc*c.w*0.4, c.y-ns*c.w*0.4, offRoad==='grass'?'#4a6b3a':'#7d6a4a', 9);
      }
    }
    /* front-end damage takes out the headlight on the side that hit */
    if(c.__lastHp===undefined) c.__lastHp=c.hp;
    if(c.hp < c.__lastHp - 14){
      const side = rnd()<0.5?0:1;
      if(player.headlight[side]) { player.headlight[side]=0; float(c.x,c.y-14,'HEADLIGHT OUT',PAL.dim); }
      c.__lastHp=c.hp;
    } else if(c.hp>c.__lastHp) c.__lastHp=c.hp;

    if(c.wrecked){
      player.hp-=dt*9;
      if(player.hp<=0) wasted('BURNED OUT');
    }
    Audio0.engine(clamp(Math.abs(c.vf)/c.spec.max,0,1.3), c.throttle>0?0.9:0.35);
  }
  /* ---- crime pressure: recent weighted incidents define danger ---- */
  updateCrimePressure();
  if(wantedLevel()<=0){ search.active=false; search.r=0; }

  /* ---- police response scales with the derived wanted level ---- */
  policeTimer-=dt;
  const wanted=wantedLevel();
  if(policeTimer<=0){
    policeTimer= wanted>=4 ? 1.5 : 2.2;
    let count=0; for(const v of vehicles) if(v.mode==='police') count++;
    const want = wanted===0?0 : Math.min(9, wanted*2 - (wanted>3?1:0));
    if(count<want) spawnPolice(wanted>=3);
    if(wanted===0 && count>0){
      for(const v of vehicles) if(v.mode==='police' && dist2(v.x,v.y,player.x,player.y)>600*600){
        v.mode='traffic'; v.color=pick(BODY_COLORS); v.cruise=rr(62,92); v.driverOut=false; break;
      }
    }
  }
}
/* what the wheels are actually on - null when it's tarmac */
function groundUnder(x,y){
  if(onRoad(x,y)) return null;
  blocksNear(x,y,2,_bl);
  for(const b of _bl){
    if(x<b.x||x>b.x+b.w||y<b.y||y>b.y+b.h) continue;
    if(b.type==='park') return 'grass';
    if(b.type==='farm') return 'dirt';
    if(b.type==='rail') return 'dirt';
    if(b.type==='lot') return null;
    return null;
  }
  return null;
}

/* Drop a runabout at the kerb right outside - close enough to actually reach,
   parked on the correct side of the road for the way it's facing. */
function seedCourtesyCar(x,y){
  const b=nearestBlockTo(x,y);
  let best=null,bd=1e9;
  if(b){
    const cands=[
      {x:clamp(x,b.x+12,b.x+b.w-12), y:b.y-ROAD/2+LANE_OUT,        a:0},
      {x:clamp(x,b.x+12,b.x+b.w-12), y:b.y+b.h+ROAD/2-LANE_OUT,    a:Math.PI},
      {x:b.x-ROAD/2+LANE_OUT,        y:clamp(y,b.y+12,b.y+b.h-12), a:-Math.PI/2},
      {x:b.x+b.w+ROAD/2-LANE_OUT,    y:clamp(y,b.y+12,b.y+b.h-12), a:Math.PI/2}
    ];
    for(const c of cands){ const d=dist2(c.x,c.y,x,y); if(d<bd){ bd=d; best=c; } }
  }
  if(!best){ const p=roadPointNear(x,y,60); best={x:p.x,y:p.y,a:p.a}; }
  const v=new Vehicle(clamp(best.x,20,WORLD-20),clamp(best.y,20,WORLD-20),best.a,
                      pick(['sedan','coupe','van']),'parked');
  v.parked=true; vehicles.push(v);

/* --------------------------- weather & time ------------------------------ */
const DAY_LEN=320;
const weather = { kind:'clear', t:0, next:rr(35,70), grip:1, wet:0, rainAmt:0, flash:0, puddles:[], drops:[], wind:0 };
let dayT = 9*DAY_LEN/24;
function hourOf(){ return (dayT/DAY_LEN)*24 % 24; }
function darknessNow(){
  const h=hourOf();
  if(h<4.8) return 1;
  if(h<6.8) return 1-(h-4.8)/2;
  if(h<17.6) return 0;
  if(h<20.2) return (h-17.6)/2.6;
  return 1;
}
function updateWeather(dt){
  dayT=(dayT+dt)%DAY_LEN;
  weather.t+=dt;
  if(weather.t>weather.next){
    weather.t=0; weather.next=rr(45,95);
    const r=rnd();
    weather.kind = r<0.50?'clear' : r<0.76?'rain' : r<0.88?'storm' : 'fog';
    if(weather.kind==='rain') float(player.x,player.y-34,'RAIN INCOMING',PAL.neon);
    if(weather.kind==='storm') float(player.x,player.y-34,'STORM WARNING',PAL.neon2);
    if(weather.kind==='fog') float(player.x,player.y-34,'FOG ROLLING IN',PAL.dim);
  }
  const targetRain = weather.kind==='rain'?0.6 : weather.kind==='storm'?1 : 0;
  weather.rainAmt = lerp(weather.rainAmt, targetRain, dt*0.35);
  weather.wet = clamp(weather.wet + (weather.rainAmt>0.15? dt*0.22 : -dt*0.06), 0, 1);
  weather.grip = 1 - weather.wet*0.30;
  weather.fog = lerp(weather.fog||0, weather.kind==='fog'?1:0, dt*0.4);
  weather.wind = Math.sin(weather.t*0.3)*0.4;
  if(weather.kind==='storm' && rnd()<dt*0.28){ weather.flash=1; Audio0.crash(0.22); }
  weather.flash=Math.max(0,weather.flash-dt*3.2);
  /* puddles follow the player */
  if(weather.wet>0.25){
    while(weather.puddles.length<46){
      const p=roadPointNear(player.x,player.y,rr(60,460));
      /* irregular outline - real puddles pool into the low spots */
      const n=ri(7,10), pts=[];
      for(let k=0;k<n;k++) pts.push(rr(0.55,1.25));
      weather.puddles.push({x:p.x,y:p.y,r:rr(7,17),w:rr(0.5,1),pts,
                            sx:rr(0.8,1.35), sy:rr(0.6,1.1), rot:rnd()*TAU});
    }
    for(let i=weather.puddles.length-1;i>=0;i--){
      if(dist2(weather.puddles[i].x,weather.puddles[i].y,player.x,player.y)>620*620) weather.puddles.splice(i,1);
    }
  } else if(weather.wet<0.1) weather.puddles.length=0;
}
function roadPointNear(x,y,r){
  for(let tries=0;tries<24;tries++){
    const a=rnd()*TAU, d=r*rr(0.6,1.2);
    let px=clamp(x+Math.cos(a)*d, 30, WORLD-30), py=clamp(y+Math.sin(a)*d, 30, WORLD-30);
    const i=nearestNodeI(px), j=nearestNodeJ(py);
    if(rnd()<0.5){ py=nodeY(j)+ (rnd()<0.5?LANE:-LANE); px=clamp(px,20,WORLD-20); return {x:px,y:py,a:rnd()<0.5?0:Math.PI}; }
    else { px=nodeX(i)+(rnd()<0.5?LANE:-LANE); py=clamp(py,20,WORLD-20); return {x:px,y:py,a:rnd()<0.5?Math.PI/2:-Math.PI/2}; }
  }
  return {x:nodeX(2),y:nodeY(2),a:0};
}
function cornerPointNear(x,y,minD,maxD){
  let best=null,bd=1e9;
  for(let t=0;t<40;t++){
    const i=ri(0,COLS-1), j=ri(0,ROWS-1);
    const b=city.blocks[blockIdx(i,j)]; if(!b) continue;
    const cx=b.x+(rnd()<0.5?5:b.w-5), cy=b.y+(rnd()<0.5?5:b.h-5);
    const d=dist(cx,cy,x,y);
    if(d>minD&&d<maxD) return {x:cx,y:cy};
    const err=Math.abs(d-(minD+maxD)/2);
    if(err<bd){ bd=err; best={x:cx,y:cy}; }
  }
  return best||{x:nodeX(3),y:nodeY(3)};
}

/* ----------------------------- missions ---------------------------------- */
const MTYPE = {
  COURIER:{name:'COURIER RUN', col:'#ffb020', icon:'C', glow:GLOW_A},
  RACE   :{name:'STREET RACE', col:'#3ff2e0', icon:'R', glow:GLOW_C},
  STUNT  :{name:'STUNT RUN',   col:'#ff3d81', icon:'S', glow:GLOW_P},
  PURSUIT:{name:'HEAT RUN',    col:'#ff4b3e', icon:'P', glow:GLOW_R},
  HITMAN :{name:'CONTRACT',    col:'#b53f6a', icon:'H', glow:GLOW_P},
  BOUNTY :{name:'BOUNTY',      col:'#ffd24a', icon:'B', glow:GLOW_A}
};
const MORDER = ['COURIER','RACE','STUNT','BOUNTY','PURSUIT','HITMAN'];
const markers = [];
let mission = null;
let missionSeq = 0;

function spawnMarker(){
  if(markers.length>=3) return;
  const used = markers.map(m=>m.type);
  let type = MORDER[missionSeq++ % MORDER.length];
  let guard=0;
  while(used.includes(type) && guard++<8) type = MORDER[missionSeq++ % MORDER.length];
  const p = cornerPointNear(player.x, player.y, 180, 820);
  markers.push({x:p.x, y:p.y, type, phase:rnd()*TAU});
}
function checkMarkers(){
  for(let i=markers.length-1;i>=0;i--){
    const m=markers[i];
    if(mission) break;
    if(dist2(m.x,m.y,player.x,player.y) < 17*17){
      markers.splice(i,1);
      startMission(m.type);
      break;
    }
  }
}
function newTarget(minD,maxD,fromX,fromY){
  const p = roadPointNear(fromX!==undefined?fromX:player.x, fromY!==undefined?fromY:player.y, rr(minD,maxD));
  return {x:p.x,y:p.y};
}
function startMission(type){
  const T = MTYPE[type];
  mission = { type, name:T.name, col:T.col, stage:0, time:0, limit:0, cps:[], idx:0, reward:0, evade:0, gatesHit:0, best:0, done:false };
  if(type==='COURIER'){
    const a=newTarget(120,260);
    const b=newTarget(320,620,a.x,a.y);
    mission.cps=[a,b];
    mission.limit = 26 + dist(a.x,a.y,player.x,player.y)/42 + dist(a.x,a.y,b.x,b.y)/42;
    mission.reward = 180 + Math.round(dist(a.x,a.y,b.x,b.y)*0.28);
    mission.obj='COLLECT THE PARCEL';
  } else if(type==='RACE'){
    let px=player.x, py=player.y;
    for(let k=0;k<6;k++){ const p=newTarget(220,380,px,py); mission.cps.push(p); px=p.x; py=p.y; }
    mission.limit = 30; mission.addTime=9.5;
    mission.reward = 420;
    mission.obj='HIT EVERY CHECKPOINT';
  } else if(type==='STUNT'){
    let px=player.x, py=player.y;
    for(let k=0;k<6;k++){ const p=newTarget(170,300,px,py); mission.cps.push(p); px=p.x; py=p.y; }
    mission.limit = 75;
    mission.reward = 360;
    mission.obj='DRIFT THROUGH THE GATES';
  } else if(type==='PURSUIT'){
    mission.limit = 95; mission.evade=0;
    mission.reward = 560;
    mission.obj='SHAKE THE COPS';
    commitCrime('MISSION_PURSUIT');
    for(let k=0;k<3;k++) spawnPolice(true);
  } else if(type==='HITMAN'){
    /* a named mark walking a block somewhere across town */
    const p=cornerPointNear(player.x,player.y,260,700);
    const b=nearestBlockTo(p.x,p.y);
    const mark=new Ped(b, GANGS[ri(0,GANGS.length-1)]);
    mark.x=p.x; mark.y=p.y; mark.snapBlock(); mark.nextCorner();
    mark.vip=true; mark.hp=90; mark.cash=ri(120,260); mark.speed=rr(16,22);
    mark.markName = pick(['VIC','DELROY','MARSH','SASHA','KOVAC','TEDDY','RAY','NADIA']);
    peds.push(mark);
    mission.mark=mark; mission.markDead=false;
    mission.limit = 120;
    mission.reward = 700;
    mission.obj='TAKE OUT '+mark.markName;
    if(!player.owned.PISTOL && !player.owned.SMG && !player.owned.RIFLE && !player.owned.SHOTGUN)
      mission.obj='RUN DOWN '+mark.markName;
  } else if(type==='BOUNTY'){
    /* a runner in a fast car who bolts the moment you're spotted */
    const p=roadPointNear(player.x,player.y, rr(240,520));
    const v=new Vehicle(p.x,p.y,p.a, pick(['sport','muscle','super','coupe']), 'traffic', pick(EXOTIC_COLORS));
    v.ni=nearestNodeI(p.x); v.nj=nearestNodeJ(p.y);
    v.dir = Math.abs(Math.cos(p.a))>0.5 ? (Math.cos(p.a)>0?0:2) : (Math.sin(p.a)>0?1:3);
    advanceNode(v); v.a=p.a;
    v.bounty=true; v.vip=true; v.cruise=rr(120,150); v.maxHp=v.maxHp*1.5; v.hp=v.maxHp;
    vehicles.push(v);
    mission.bounty=v;
    mission.limit = 110;
    mission.reward = 820;
    mission.obj='WRECK THE RUNNER';
  }
  mission.time = mission.limit;
  setBanner(T.name, mission.obj, T.col);
  Audio0.blip(520,0.09,'square',0.12);
  setTimeout(()=>Audio0.blip(780,0.13,'square',0.12),110);
}
function missionTarget(){
  if(!mission) return null;
  if(mission.type==='PURSUIT') return null;
  if(mission.type==='HITMAN') return mission.mark && mission.mark.state!=='dead' ? mission.mark : null;
  if(mission.type==='BOUNTY') return mission.bounty && !mission.bounty.wrecked ? mission.bounty : null;
  return mission.cps[mission.idx]||null;
}
/* let the marked ped/car go back to being ordinary traffic */
function releaseMissionActors(){

  if(mission.bounty){ mission.bounty.vip=false; mission.bounty.bounty=false; mission.bounty=null; }

function completeMission(){

function failMission(reason){

  setBanner('MISSION FAILED', reason||'OUT OF TIME', PAL.bad);

function updateMission(dt){
  if(!mission){ if(markers.length<3 && rnd()<dt*0.6) spawnMarker(); return; }
  mission.time-=dt;
  if(mission.time<=0){ failMission('OUT OF TIME'); return; }
  const px=player.x, py=player.y;
  if(mission.type==='COURIER'){
    const t=mission.cps[mission.idx];
    if(dist2(t.x,t.y,px,py)<20*20){
      if(mission.idx===0){
        mission.idx=1; mission.obj='DELIVER THE PARCEL';
        setBanner('PARCEL SECURED','Drive it to the drop',PAL.amber);
        Audio0.blip(700,0.09,'triangle',0.12);
      } else completeMission();
    }
  } else if(mission.type==='RACE'){
    const t=mission.cps[mission.idx];
    if(dist2(t.x,t.y,px,py)<22*22){
      mission.idx++;
      if(mission.idx>=mission.cps.length) completeMission();
      else {
        mission.time+=mission.addTime;
        addScore(70,'CHECKPOINT');
        Audio0.blip(880,0.07,'square',0.1);
      }
    }
  } else if(mission.type==='STUNT'){
    const t=mission.cps[mission.idx];
    if(dist2(t.x,t.y,px,py)<24*24){
      const drifting = !player.onFoot && player.car && player.car.drift>0.28 && player.car.speed>38;
      mission.idx++; mission.gatesHit++;
      if(drifting){ addScore(200,'STYLE GATE'); mission.best++; Audio0.blip(1050,0.1,'triangle',0.12); }
      else { addScore(60,'GATE'); Audio0.blip(620,0.08,'square',0.1); }
      if(mission.idx>=mission.cps.length){
        mission.reward += mission.best*70;
        completeMission();
      }
    }
  } else if(mission.type==='PURSUIT'){
    let close=false;
    for(const v of vehicles) if(v.mode==='police' && dist2(v.x,v.y,px,py)<200*200){ close=true; break; }
    if(close) mission.evade=Math.max(0,mission.evade-dt*0.55);
    else mission.evade+=dt;
    mission.obj = close ? 'LOSE THEM - '+Math.round(mission.evade*10)+'%' : 'KEEP GOING - '+Math.round(mission.evade*10)+'%';
    if(mission.evade>=10){
      clearCrimeLedger();
      for(let i=vehicles.length-1;i>=0;i--) if(vehicles[i].mode==='police'){ vehicles[i].mode='traffic'; vehicles[i].color=pick(BODY_COLORS); vehicles[i].driverOut=false; }
      cops.length=0;
      completeMission();
    }
  } else if(mission.type==='HITMAN'){
    const m=mission.mark;
    if(!m || peds.indexOf(m)<0){ failMission('MARK GOT AWAY'); return; }
    if(m.state==='dead'){
      addScore(400,'CONTRACT');
      completeMission(); return;
    }
    const d=Math.round(dist(m.x,m.y,px,py));
    mission.obj = d<90 ? 'TARGET IN SIGHT' : 'FIND THE TARGET';
    /* the mark bolts once you're close and armed */
    if(d<120 && !m.spooked && (WEAPONS[player.weapon].cls==='gun' || (player.car&&player.car.speed>60))){
      m.spooked=true; m.state='panic'; m.t=999; m.flee={x:px,y:py}; m.speed=rr(22,27);
    }
    if(m.spooked && m.state==='panic'){ m.t=999; m.flee={x:px,y:py}; }
  } else if(mission.type==='BOUNTY'){
    const v=mission.bounty;
    if(!v || vehicles.indexOf(v)<0){ failMission('RUNNER LOST'); return; }
    if(v.wrecked){
      addScore(450,'BOUNTY CLAIMED');
      dropCash(v.x,v.y,ri(120,240));
      completeMission(); return;
    }
    const d=Math.round(dist(v.x,v.y,px,py));
    mission.obj = d<150 ? 'RAM THEM OFF THE ROAD' : 'CLOSE THE GAP';
    /* they floor it when you get on their bumper */
    if(d<200){ v.cruise=Math.max(v.cruise, v.spec.max*0.95); v.fleeing=true; }
    else v.fleeing=false;
  }
}

/* ------------------------------ garage ----------------------------------- */
const garage = { open:false, idx:0, g:null, flash:0, phase:null, transit:0, from:null, to:null };
function garageItems(){
  const u=player.up, c=player.car;
  const items=[];
  items.push({t:'REPAIR VEHICLE', cost:60, d:'Full body restore', ok:!!c && c.hp<c.maxHp,
    act:()=>{ c.hp=c.maxHp; c.wrecked=false; c.__lastHp=c.hp; player.hp=player.maxHp; }});
  items.push({t:'NEW TYRES', cost:80, d:player.flats?'Replace the shredded rubber':'Rubber is fine', ok:player.flats>0,
    act:()=>{ player.flats=0; }});
  items.push({t:'GLASS & LAMPS', cost:40, d:'Refit blown headlights', ok:(player.headlight[0]+player.headlight[1])<2,
    act:()=>{ player.headlight=[1,1]; }});
  items.push({t:'ENGINE TUNE  LV'+u.engine, cost:240+u.engine*180, d:'+10% power, +9% top speed', ok:u.engine<3,
    act:()=>{ u.engine++; }});
  items.push({t:'GRIP TIRES   LV'+u.tires, cost:200+u.tires*160, d:'+10% grip, sharper steering', ok:u.tires<3,
    act:()=>{ u.tires++; }});
  items.push({t:'ROLL CAGE    LV'+u.armor, cost:180+u.armor*150, d:'+34 max integrity', ok:u.armor<3,
    act:()=>{ u.armor++; if(c){ c.maxHp=c.spec.hp+u.armor*34; c.hp=c.maxHp; } }});
  items.push({t:'NITROUS TANK', cost:300, d:'Hold F for a speed burst', ok:!player.hasTurbo,
    act:()=>{ player.hasTurbo=true; player.turbo=100; }});
  items.push({t:'BLAST BUMPERS', cost:180, d:'90s: launch anything you ram', ok:player.bumperT<30,
    act:()=>{ player.bumperT=90; }});
  items.push({t:'RESPRAY', cost:90, d:'New colour, clears your heat', ok:true,
    act:()=>{ if(c) c.color=pick(BODY_COLORS); clearCrimeLedger(); }});
  items.push({t:'DRIVE OUT', cost:0, d:'Drive the car back to the street', ok:true, act:()=>{ closeGarage(); }});
  return items;
}
function checkGarage(){
  if(garage.open||player.onFoot||!player.car) return;
  for(const g of city.garages){
    const a=g.apron;
    if(player.car.x>a.x&&player.car.x<a.x+a.w&&player.car.y>a.y&&player.car.y<a.y+a.h){
      openGarage(g); break;
    }
  }
}
function openGarage(g){
  garage.open=true; garage.g=g; garage.idx=0; garage.phase='enter'; garage.transit=0;
  const c=player.car;
  if(c){
    c.vx=c.vy=0; c.vf=c.vr=0; c.throttle=0; c.brake=1; c.hand=true;
    garage.from={x:c.x,y:c.y,a:c.a};
    const side=g.block.gside, d=DIRS[side];
    const a=g.apron;
    const targetX=a.x+a.w*0.5 - d[0]*Math.min(a.w*0.33,18);
    const targetY=a.y+a.h*0.5 - d[1]*Math.min(a.h*0.33,18);
    garage.to={x:targetX,y:targetY,a:Math.atan2(d[1],d[0])};
  }
  if(player.heat>0) reduceCrimePressure(3);
  Audio0.blip(440,0.1,'triangle',0.12);
}
function startGarageExit(){
  if(!garage.g || !player.car) return;
  const b=garage.g.block, side=b.gside, d=DIRS[side];
  garage.phase='exit'; garage.transit=0;
  garage.from={x:player.car.x,y:player.car.y,a:player.car.a};
  const a=garage.g.apron;
  const edgeX=a.x+a.w*0.5 + d[0]*(Math.abs(d[0])?ROAD*0.72:0);
  const edgeY=a.y+a.h*0.5 + d[1]*(Math.abs(d[1])?ROAD*0.72:0);
  garage.to={x:edgeX,y:edgeY,a:Math.atan2(d[1],d[0])};
}
function garageTransition(dt){
  if(!garage.open || !garage.g || !player.car) return;
  garage.transit=Math.min(1,garage.transit+dt/0.85);
  const e=garage.transit<0.5 ? 2*garage.transit*garage.transit : 1-Math.pow(-2*garage.transit+2,2)/2;
  const a=garage.from, b=garage.to, c=player.car;
  c.x=lerp(a.x,b.x,e); c.y=lerp(a.y,b.y,e); c.a=a.a+angDiff(a.a,b.a)*e; c.vx=c.vy=0; c.vf=c.vr=0;
  player.x=c.x; player.y=c.y; player.a=c.a;
  if(garage.transit>=1){
    if(garage.phase==='enter'){ garage.phase='menu'; c.hand=false; }
    else { garage.open=false; garage.g=null; garage.phase=null; c.hand=false; c.brake=0; Audio0.blip(300,0.08,'triangle',0.1); }
  }
}
function closeGarage(){
  if(!garage.g) return;
  if(garage.phase==='menu') startGarageExit();
}
function garageInput(){
  const items=garageItems();
  if(hit('up')){ garage.idx=(garage.idx-1+items.length)%items.length; Audio0.blip(520,0.04,'square',0.06); }
  if(hit('down')){ garage.idx=(garage.idx+1)%items.length; Audio0.blip(520,0.04,'square',0.06); }
  if(hit('action')||tapped['enter']){
    const it=items[garage.idx];
    if(it.cost===0){ it.act(); return; }
    if(!it.ok){ garage.flash=0.4; Audio0.blip(140,0.12,'square',0.1); return; }
    if(player.cash<it.cost){ garage.flash=0.4; Audio0.blip(140,0.12,'square',0.1); float(player.x,player.y,'NOT ENOUGH CASH',PAL.bad); return; }
    player.cash-=it.cost; it.act();
    Audio0.blip(880,0.09,'triangle',0.12);
    setTimeout(()=>Audio0.blip(1170,0.12,'triangle',0.1),90);
  }
  if(hit('pause') && garage.phase==='menu') closeGarage();
  garage.flash=Math.max(0,garage.flash-0.05);
}

/* ------------------------- population control ---------------------------- */
const TRAFFIC_N=36, PED_N=58, PARKED_N=16;
function spawnTraffic(far){
  let p=null;
  const minEdge=Math.max(BW,BH)*0.5+90;
  for(let tries=0;tries<18;tries++){
    const q=roadPointNear(player.x,player.y, far?rr(Math.max(420,minEdge),760):rr(Math.max(260,minEdge),700));
    if(Math.abs(q.x-cam.x)>BW*0.5+70 || Math.abs(q.y-cam.y)>BH*0.5+70){ p=q; break; }
  }
  if(!p) p=roadPointNear(player.x,player.y,Math.max(420,minEdge));
  let type=pick(TRAFFIC_POOL);
  /* the nice stuff lives downtown, the working stuff out by the yards */
  const b=nearestBlockTo(p.x,p.y);
  if(b){
    if(b.zone==='downtown' && rnd()<0.3) type=pick(['luxury','sport','super','coupe','taxi']);
    else if(b.zone==='industrial' && rnd()<0.45) type=pick(['truck','semi','van','truck']);
    else if(b.zone==='agricultural' && rnd()<0.5) type=pick(['truck','van','suv']);
  }
  const v=new Vehicle(p.x,p.y,p.a,type,'traffic');
  if(type==='super'||type==='sport') v.color=pick(EXOTIC_COLORS);
  v.ni=nearestNodeI(p.x); v.nj=nearestNodeJ(p.y);
  v.dir = Math.abs(Math.cos(p.a))>0.5 ? (Math.cos(p.a)>0?0:2) : (Math.sin(p.a)>0?1:3);
  advanceNode(v);
  v.a=p.a;
  vehicles.push(v);
  return v;
}
function spawnPolice(near){
  const w=wantedLevel();
  let type='police', col='#20304f';
  if(w>=6) { type = rnd()<0.6?'army':'swat'; col = type==='army'?'#4a5240':'#1b2434'; }
  else if(w>=5) { type = rnd()<0.6?'swat':'police'; col = type==='swat'?'#1b2434':'#20304f'; }
  else if(w>=4 && rnd()<0.4) { type='swat'; col='#1b2434'; }
  let ox=player.x, oy=player.y, dd;
  if(search.active && !search.spotted){
    /* they've lost you - new units converge on the cordon, not on your bumper */
    ox=search.x; oy=search.y; dd=search.r+rr(70,200);
  } else dd = near?rr(220,380):rr(300,520);
  const p=roadPointNear(ox,oy,dd);
  const v=new Vehicle(p.x,p.y,p.a,type,'police',col);
  v.cruise = type==='army'? rr(96,112) : type==='swat'? rr(100,118) : rr(105,128);
  v.ni=nearestNodeI(p.x); v.nj=nearestNodeJ(p.y);
  v.dir = Math.abs(Math.cos(p.a))>0.5 ? (Math.cos(p.a)>0?0:2) : (Math.sin(p.a)>0?1:3);
  advanceNodeToward(v,player.x,player.y);
  vehicles.push(v);
  return v;
}
/* cars sitting in lots and at the kerb, waiting to be borrowed */
function spawnParked(){
  const spots=city.parkSpots;
  if(!spots.length) return null;
  let best=null;
  for(let t=0;t<16;t++){
    const s=spots[ri(0,spots.length-1)];
    const d2=dist2(s.x,s.y,player.x,player.y);
    if(d2<180*180 || d2>820*820) continue;
    let taken=false;
    for(const v of vehicles){ if(dist2(v.x,v.y,s.x,s.y)<18*18){ taken=true; break; } }
    if(taken) continue;
    best=s; break;
  }
  if(!best) return null;
  const type=pick(['sedan','coupe','van','suv','taxi','muscle','sport','truck','moto','luxury']);
  const v=new Vehicle(best.x,best.y,best.a,type,'parked');
  if(type==='super'||type==='sport') v.color=pick(EXOTIC_COLORS);
  v.parked=true;
  vehicles.push(v);
  return v;
}
function managePopulation(){
  let traffic=0, parked=0;
  for(let i=vehicles.length-1;i>=0;i--){
    const v=vehicles[i];
    if(v===player.car) continue;
    /* fully faded wrecks leave a scorch mark and get cleared away */
    if(v.ghost!==undefined && v.ghost<=0){
      scorches.push({x:v.x,y:v.y,a:v.a,w:v.w,h:v.h,life:1});
      if(scorches.length>40) scorches.shift();
      vehicles.splice(i,1); continue;
    }
    const d2=dist2(v.x,v.y,player.x,player.y);
    if(v.mode==='traffic') traffic++;
    if(v.mode==='parked') parked++;
    if(v.vip && d2<2400*2400) continue;
    if(d2>1150*1150 || (v.wrecked && d2>420*420)){
      if(v.mode==='police' && Math.floor(player.heat)>0){ vehicles.splice(i,1); spawnPolice(); }
      else { vehicles.splice(i,1); if(v.mode==='traffic') traffic--; else if(v.mode==='parked') parked--; }
    }
  }
  while(traffic<TRAFFIC_N){ spawnTraffic(rnd()<0.5); traffic++; }
  let pg=0;
  while(parked<PARKED_N && pg++<6){ if(spawnParked()) parked++; else break; }
  /* peds */
  for(let i=peds.length-1;i>=0;i--){
    const p=peds[i];
    if(p.vip && dist2(p.x,p.y,player.x,player.y)<2400*2400) continue;
    const far = dist2(p.x,p.y,player.x,player.y)>760*760;
    if(far || (p.state==='dead' && p.deadT>26 && dist2(p.x,p.y,player.x,player.y)>220*220)) peds.splice(i,1);
  }
  let guard=0;
  while(peds.length<PED_N && guard++<40){
    const ang=rnd()*TAU, d=rr(90,520);
    const b=nearestBlockTo(clamp(player.x+Math.cos(ang)*d,20,WORLD-20), clamp(player.y+Math.sin(ang)*d,20,WORLD-20));
    if(!b) continue;
    /* rough blocks run in crews */
    const gangTurf = (b.zone==='industrial'||b.zone==='residential') && ((b.i*7+b.j*13)%11)<3;
    const g = gangTurf && rnd()<0.55 ? GANGS[(b.i+b.j)%GANGS.length] : null;
    peds.push(new Ped(b,g));
  }
}

/* ------------------------------ camera ----------------------------------- */
const cam={x:WORLD/2,y:WORLD/2};
function updateCamera(dt){
  const t = player.onFoot?player:(player.car||player);
  const lead = player.onFoot?0:clamp(t.speed*0.30,0,52);
  const tx = t.x + Math.cos(t.a)*lead;
  const ty = t.y + Math.sin(t.a)*lead;
  const k = 1-Math.pow(0.0016, dt);
  cam.x = lerp(cam.x, tx, k); cam.y = lerp(cam.y, ty, k);
  cam.x = clamp(cam.x, BW/2-20, WORLD-BW/2+20);
  cam.y = clamp(cam.y, BH/2-20, WORLD-BH/2+20);
  shakeAmt = Math.max(0, shakeAmt - dt*14);
}

/* ---------------------------- draw helpers -------------------------------- */
const _shadeCache=new Map();
function shade(hex,amt){
  const key=hex+'|'+amt;
  let v=_shadeCache.get(key); if(v) return v;
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(amt>0){ r=r+(255-r)*amt; g=g+(255-g)*amt; b=b+(255-b)*amt; }
  else { r*=(1+amt); g*=(1+amt); b*=(1+amt); }
  v='rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
  _shadeCache.set(key,v); return v;
}
function quad(g,ax,ay,bx2,by2,cx2,cy2,dx2,dy2,col){
  g.fillStyle=col; g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx2,by2); g.lineTo(cx2,cy2); g.lineTo(dx2,dy2); g.closePath(); g.fill();
}
let VX=0,VY=0,VW=0,VH=0;
function inView(x,y,pad){ pad=pad||0; return x>VX-pad && x<VX+VW+pad && y>VY-pad && y<VY+VH+pad; }

/* ------------------------------ world draw -------------------------------- */
function drawGround(){
  const wet = weather.wet;
  bx.fillStyle = wet>0.3 ? PAL.roadWet : PAL.road;
  bx.fillRect(VX-2,VY-2,VW+4,VH+4);
  const i0=Math.max(0,Math.floor((VX-ROAD)/CELL)), i1=Math.min(COLS,Math.ceil((VX+VW)/CELL));
  const j0=Math.max(0,Math.floor((VY-ROAD)/CELL)), j1=Math.min(ROWS,Math.ceil((VY+VH)/CELL));

  /* blocks */
  for(let j=j0-1;j<=j1;j++) for(let i=i0-1;i<=i1;i++){
    const k=blockIdx(i,j); if(k<0) continue;
    const b=city.blocks[k];
    if(!inView(b.x+b.w/2,b.y+b.h/2, b.w)) continue;
    /* sidewalk */
    bx.fillStyle=PAL.walk; bx.fillRect(b.x,b.y,b.w,b.h);
    bx.fillStyle=PAL.curb;
    bx.fillRect(b.x,b.y,b.w,1); bx.fillRect(b.x,b.y+b.h-1,b.w,1);
    bx.fillRect(b.x,b.y,1,b.h); bx.fillRect(b.x+b.w-1,b.y,1,b.h);
    bx.fillStyle=PAL.walkHi;
    for(let s=6;s<b.w-4;s+=14) bx.fillRect(b.x+s,b.y+2,1,3);
    for(let s=6;s<b.w-4;s+=14) bx.fillRect(b.x+s,b.y+b.h-5,1,3);
    const inn=b.inner;
    if(b.type==='park'){
      bx.fillStyle=PAL.grass; bx.fillRect(inn.x,inn.y,inn.w,inn.h);
      bx.fillStyle=PAL.grassHi;
      for(let s=0;s<10;s++) bx.fillRect(inn.x+((s*37)%(inn.w-6))+3, inn.y+((s*61)%(inn.h-6))+3, 3,2);
      bx.fillStyle='#6b6152';
      bx.fillRect(inn.x, inn.y+inn.h/2-3, inn.w, 6);
      if(b.pond){ bx.fillStyle=PAL.water; circle(b.pond.x,b.pond.y,b.pond.r);
        bx.fillStyle=shade(PAL.water,0.2); circle(b.pond.x-2,b.pond.y-2,b.pond.r*0.6); }
    } else if(b.type==='lot'){
      bx.fillStyle=PAL.lot; bx.fillRect(inn.x,inn.y,inn.w,inn.h);
      /* bay lines drawn where cars actually park */
      bx.fillStyle='#cfc9a8';
      if(b.lotRows){
        for(const r of b.lotRows){
          bx.fillRect(r.x-9, r.y-11, 1, 22);
          bx.fillRect(r.x+9, r.y-11, 1, 22);
        }
      }
      /* aisle down the middle */
      bx.fillStyle='rgba(207,201,168,0.28)';
      bx.fillRect(inn.x+4, inn.y+inn.h/2-0.5, inn.w-8, 1);
      for(const d of b.deco){ bx.fillStyle=d.c; bx.fillRect(d.x,d.y,d.w,d.h); bx.fillStyle=shade(d.c,0.2); bx.fillRect(d.x,d.y,d.w,2); }
    } else if(b.type==='plaza'){
      bx.fillStyle='#8f8a7e'; bx.fillRect(inn.x,inn.y,inn.w,inn.h);
      bx.fillStyle='#807b70';
      for(let s=0;s<inn.w;s+=10) bx.fillRect(inn.x+s,inn.y,1,inn.h);
      for(let s=0;s<inn.h;s+=10) bx.fillRect(inn.x,inn.y+s,inn.w,1);
      const f=b.fountain;
      bx.fillStyle='#6f6a60'; circle(f.x,f.y,f.r);
      bx.fillStyle=PAL.water; circle(f.x,f.y,f.r-3);
      bx.fillStyle='#bfe6ff'; circle(f.x,f.y,3);
    } else if(b.type==='garage'){
      bx.fillStyle='#4b4f58'; bx.fillRect(inn.x,inn.y,inn.w,inn.h);
      const ap=b.apron;
      bx.fillStyle='#3e434c'; bx.fillRect(ap.x,ap.y,ap.w,ap.h);
      bx.fillStyle=PAL.amber;
      for(let s=0;s<Math.max(ap.w,ap.h);s+=12){
        if(ap.w>ap.h) bx.fillRect(ap.x+s,ap.y,4,2), bx.fillRect(ap.x+s,ap.y+ap.h-2,4,2);
        else bx.fillRect(ap.x,ap.y+s,2,4), bx.fillRect(ap.x+ap.w-2,ap.y+s,2,4);
      }
    } else if(b.type==='farm'){
      bx.fillStyle=PAL.dirt; bx.fillRect(inn.x,inn.y,inn.w,inn.h);
      const F=b.field, rowH=inn.h/F.rows;
      for(let r=0;r<F.rows;r++){
        bx.fillStyle = r%2 ? F.crop : shade(F.crop,-0.16);
        bx.fillRect(inn.x, inn.y+r*rowH, inn.w, Math.max(1,rowH-1.5));
      }
      bx.fillStyle=PAL.dirtHi;
      for(let r=0;r<F.rows;r++) bx.fillRect(inn.x, inn.y+r*rowH+rowH-1.5, inn.w, 1);
      if(b.silo){
        bx.fillStyle='rgba(0,0,0,0.3)'; circle(b.silo.x+2,b.silo.y+3,b.silo.r);
        bx.fillStyle='#b8b3ac'; circle(b.silo.x,b.silo.y,b.silo.r);
        bx.fillStyle='#d3cec6'; circle(b.silo.x-b.silo.r*0.3,b.silo.y-b.silo.r*0.3,b.silo.r*0.55);
      }
    } else if(b.type==='rail'){
      bx.fillStyle=PAL.indust; bx.fillRect(inn.x,inn.y,inn.w,inn.h);
      bx.fillStyle=PAL.gravel;
      bx.fillRect(b.x, b.railY-16, b.w, 32);
      bx.fillStyle=PAL.tie;
      const s0=Math.floor(Math.max(b.x,VX-10)/9)*9;
      for(let x=s0;x<Math.min(b.x+b.w,VX+VW+10);x+=9) bx.fillRect(x, b.railY-11, 5, 22);
      bx.fillStyle='#8a8f98';
      bx.fillRect(b.x, b.railY-8, b.w, 1.6);
      bx.fillRect(b.x, b.railY+6.4, b.w, 1.6);
      bx.fillStyle='rgba(255,255,255,0.18)';
      bx.fillRect(b.x, b.railY-8, b.w, 0.6);
      bx.fillRect(b.x, b.railY+6.4, b.w, 0.6);
    } else if(b.type==='water'){
      const t=now*0.6;
      bx.fillStyle=PAL.water; bx.fillRect(b.x,b.y,b.w,b.h);
      bx.fillStyle=shade(PAL.water,0.10);
      for(let yy=Math.max(b.y,VY-8); yy<Math.min(b.y+b.h,VY+VH+8); yy+=7){
        const off=Math.sin(yy*0.15+t)*5;
        bx.fillRect(b.x+8+off, yy, b.w-16, 1);
      }
      bx.fillStyle=shade(PAL.water,0.24);
      for(let yy=Math.max(b.y,VY-8); yy<Math.min(b.y+b.h,VY+VH+8); yy+=17){
        const off=Math.cos(yy*0.11-t*1.3)*7;
        bx.fillRect(b.x+22+off, yy+3, 10, 1);
      }
      bx.fillStyle='#5a5f69'; bx.fillRect(b.x,b.y,4,b.h); bx.fillRect(b.x+b.w-4,b.y,4,b.h);
      bx.fillStyle='#6d727c';
      for(let yy=b.y;yy<b.y+b.h;yy+=6){ bx.fillRect(b.x,yy,4,1); bx.fillRect(b.x+b.w-4,yy,4,1); }
    } else if(b.type==='service'||b.type==='shop'){
      const kind=b.service||b.shop;
      bx.fillStyle= kind==='hospital'?'#6f7a84' : kind==='police'?'#4a5464' : '#585d66';
      bx.fillRect(inn.x,inn.y,inn.w,inn.h);
      const fc=b.forecourt||{x:inn.x,y:inn.y+inn.h*0.6,w:inn.w,h:inn.h*0.4};
      bx.fillStyle='#4a4f58'; bx.fillRect(fc.x,fc.y,fc.w,fc.h);
      bx.fillStyle='rgba(233,242,255,0.32)';
      for(let s=8;s<fc.w-6;s+=15) bx.fillRect(fc.x+s, fc.y+3, 1, Math.min(16,fc.h-6));
      if(kind==='gas' && b.canopy){
        bx.fillStyle='rgba(0,0,0,0.25)'; bx.fillRect(b.canopy.x+2,b.canopy.y+3,b.canopy.w,b.canopy.h);
        bx.fillStyle='#e8e3d4'; bx.fillRect(b.canopy.x,b.canopy.y,b.canopy.w,b.canopy.h);
        bx.fillStyle=PAL.amber; bx.fillRect(b.canopy.x,b.canopy.y,b.canopy.w,2);
      }
      if(b.door){
        const dc = kind==='hospital'?'#ff4b3e' : kind==='police'?'#2b55ff' : kind==='jewel'?'#3ff2e0' : kind==='weapon'?'#ff4b3e':'#ffb020';
        bx.fillStyle=dc; bx.fillRect(b.door.x-5, b.door.y-4, 10, 2);
        bx.globalAlpha=0.20+Math.sin(now*3+b.i)*0.08;
        bx.fillStyle=dc; circle(b.door.x,b.door.y,11); bx.globalAlpha=1;
      }
    } else {
      bx.fillStyle='#5f6470'; bx.fillRect(inn.x,inn.y,inn.w,inn.h);
    }
  }
  /* lane markings */
  bx.fillStyle=PAL.line;
  for(let i=i0;i<=i1+1;i++){
    const x=nodeX(i); if(x<VX-6||x>VX+VW+6) continue;
    const s0=Math.max(0,Math.floor((VY-20)/22)*22);
    for(let y=s0;y<VY+VH+20;y+=22){
      const v=((y-ROAD/2)%CELL+CELL)%CELL;
      if(v<ROAD/2+3||v>CELL-ROAD/2-3) continue;
      bx.fillRect(x-1,y,2,11);
    }
  }
  for(let j=j0;j<=j1+1;j++){
    const y=nodeY(j); if(y<VY-6||y>VY+VH+6) continue;
    const s0=Math.max(0,Math.floor((VX-20)/22)*22);
    for(let x=s0;x<VX+VW+20;x+=22){
      const u=((x-ROAD/2)%CELL+CELL)%CELL;
      if(u<ROAD/2+3||u>CELL-ROAD/2-3) continue;
      bx.fillRect(x,y-1,11,2);
    }
  }
  /* crosswalks */
  bx.fillStyle='#c8c8b4';
  for(let j=j0;j<=j1+1;j++) for(let i=i0;i<=i1+1;i++){
    const x=nodeX(i), y=nodeY(j);
    if(!inView(x,y,ROAD)) continue;
    for(let s=-20;s<20;s+=7){
      bx.fillRect(x+s, y-ROAD/2+1, 4, 5);
      bx.fillRect(x+s, y+ROAD/2-6, 4, 5);
      bx.fillRect(x-ROAD/2+1, y+s, 5, 4);
      bx.fillRect(x+ROAD/2-6, y+s, 5, 4);
    }
  }
  drawRoadGrime(i0,i1,j0,j1);
  drawLaneArrows(i0,i1,j0,j1);
  drawBridges();
  drawRailBridge();
  drawCrossingRoad();
}
/* Drains, patches, cracks and litter - deterministic per tile so they stay put. */
function drawRoadGrime(i0,i1,j0,j1){
  const hash=(a,b)=>{ let h=(a*374761393+b*668265263)>>>0; h=(h^(h>>13))*1274126177>>>0; return (h^(h>>16))>>>0; };
  for(let j=j0-1;j<=j1+1;j++) for(let i=i0-1;i<=i1+1;i++){
    const cx0=ROAD/2+i*CELL, cy0=ROAD/2+j*CELL;
    if(!inView(cx0,cy0,CELL)) continue;
    for(let s=0;s<7;s++){
      const h=hash(i*71+s, j*131+s*17);
      const along=(h%1000)/1000*CELL;
      const kind=(h>>10)%10;
      const horiz=((h>>14)&1)===1;
      const lat=(((h>>16)%100)/100-0.5)*(ROAD-9);
      const x = horiz ? cx0+along : cx0+lat;
      const y = horiz ? cy0+lat  : cy0+along;
      if(!inView(x,y,14)) continue;
      if(kind<2){
        /* storm drain at the kerb */
        const gx = horiz ? x : cx0 + (lat>0?ROAD/2-4:-ROAD/2+2);
        const gy = horiz ? cy0 + (lat>0?ROAD/2-4:-ROAD/2+2) : y;
        bx.fillStyle='#22262c'; bx.fillRect(gx-3,gy-2,7,5);
        bx.fillStyle='#3b4049';
        for(let g0=0;g0<3;g0++) bx.fillRect(gx-2+g0*2, gy-1, 1, 3);
      } else if(kind<5){
        /* tarmac patch */
        bx.fillStyle='rgba(20,22,27,0.30)';
        bx.fillRect(x-4-(h%5), y-3-((h>>3)%4), 9+(h%7), 7+((h>>5)%5));
      } else if(kind<8){
        /* crack */
        bx.fillStyle='rgba(16,18,22,0.45)';
        let px2=x, py2=y;
        for(let g0=0;g0<4;g0++){
          const hh=hash(h+g0, i+j);
          px2 += ((hh%5)-2); py2 += ((hh>>4)%5)-2;
          bx.fillRect(px2, py2, 2, 1);
        }
      } else {
        /* litter */
        bx.fillStyle=['#b8b3ac','#8a7350','#6a6f78','#a89c7a'][(h>>7)%4];
        bx.fillRect(x, y, 1.6, 1.2);
      }
    }
  }
}
/* Turn-only lane arrows painted on the approach to each junction. */
function drawLaneArrows(i0,i1,j0,j1){
  bx.fillStyle='rgba(233,242,255,0.38)';
  for(let j=j0-1;j<=j1+1;j++) for(let i=i0-1;i<=i1+1;i++){
    const x=nodeX(i), y=nodeY(j);
    if(!inView(x,y,CELL*0.6)) continue;
    const L = city.lights.get(i+','+j);
    if(!L || L.ctrl==='none') continue;
    for(let dir=0;dir<4;dir++){
      const d=DIRS[dir];
      /* approach comes from the opposite side */
      for(let lane=0;lane<2;lane++){
        const off=laneOffset(dir,lane);
        const back=ROAD/2+16+lane*0;
        const ax=x-d[0]*back+off[0], ay=y-d[1]*back+off[1];
        if(!inView(ax,ay,12)) continue;
        bx.save(); bx.translate(ax,ay); bx.rotate(Math.atan2(d[1],d[0]));
        /* inside lane = straight + left, kerbside = straight + right */
        bx.fillRect(-4,-0.5,7,1.4);
        bx.fillRect(2.4,-2,1.4,1.4); bx.fillRect(2.4,1,1.4,1.4);
        bx.fillRect(3.4,-0.5,1.6,1.4);
        const turn = lane===0?-1:1;
        bx.fillRect(0,turn>0?0.6:-2.4,1.3,2.2);
        bx.fillRect(-0.6,turn>0?2.2:-3.0,2.6,1.2);
        bx.restore();
      }
    }
  }
}
/* The railway also crosses the river on a dedicated bridge. */
function drawRailBridge(){
  const x=ROAD+city.river.i*CELL, y=city.rail.y;
  if(!inView(x+BLOCK/2,y,BLOCK)) return;
  bx.fillStyle='rgba(0,0,0,0.42)'; bx.fillRect(x-2,y-18,BLOCK+4,36);
  bx.fillStyle='#454b54'; bx.fillRect(x,y-16,BLOCK,32);
  bx.fillStyle='#5b4d43';
  for(let xx=x;xx<x+BLOCK;xx+=9) bx.fillRect(xx,y-11,5,22);
  bx.fillStyle='#8a8f98'; bx.fillRect(x,y-8,BLOCK,1.6); bx.fillRect(x,y+6.4,BLOCK,1.6);
}

/* Road decks lifted over the river. */
function drawBridges(){
  for(const br of city.bridges){
    if(!inView(br.x+br.w/2, br.y, br.w)) continue;
    const y0=br.y-ROAD/2, y1=br.y+ROAD/2;
    bx.fillStyle='rgba(0,0,0,0.38)';
    bx.fillRect(br.x-2, y1, br.w+4, 4);
    bx.fillStyle='#3a3f48'; bx.fillRect(br.x-2, y0, br.w+4, ROAD);
    /* deck planking */
    bx.fillStyle='rgba(0,0,0,0.16)';
    for(let x=br.x;x<br.x+br.w;x+=10) bx.fillRect(x, y0, 1, ROAD);
    /* railings */
    bx.fillStyle='#6f7680'; bx.fillRect(br.x-2, y0-2, br.w+4, 2.4); bx.fillRect(br.x-2, y1-0.4, br.w+4, 2.4);
    bx.fillStyle='#889099';
    for(let x=br.x;x<br.x+br.w;x+=7){ bx.fillRect(x, y0-3.4, 1.6, 3.4); bx.fillRect(x, y1+0.4, 1.6, 3.4); }
    bx.fillStyle=PAL.line;
    for(let x=br.x;x<br.x+br.w;x+=22) bx.fillRect(x, br.y-1, 11, 2);
  }
}
/* Painted warning box and barrier posts at each level crossing. */
function drawCrossingRoad(){
  for(const c of city.crossings){
    if(!inView(c.x,c.y,ROAD+12)) continue;
    bx.fillStyle='rgba(255,176,32,0.20)';
    bx.fillRect(c.x-ROAD/2+2, c.y-16, ROAD-4, 32);
    bx.fillStyle='rgba(255,176,32,0.55)';
    bx.fillRect(c.x-ROAD/2+2, c.y-16, ROAD-4, 1.4);
    bx.fillRect(c.x-ROAD/2+2, c.y+14.6, ROAD-4, 1.4);
  }
}
function circle(x,y,r){ bx.beginPath(); bx.arc(x,y,r,0,TAU); bx.fill(); }

function drawDecals(){
  /* skid marks */
  for(const s of skids){
    bx.globalAlpha=s.life*0.55;
    bx.fillStyle='#1a1a1e';
    bx.save(); bx.translate(s.x,s.y); bx.rotate(s.a); bx.fillRect(-1.5,-0.9,3,1.8); bx.restore();
  }
  /* dirt and grass kicked up off-road */
  for(const d of dirtTrails){
    if(!inView(d.x,d.y,10)) continue;
    bx.globalAlpha=d.life*0.5;
    bx.fillStyle = d.col==='grass' ? '#2c4a26' : '#54462e';
    bx.save(); bx.translate(d.x,d.y); bx.rotate(d.a); bx.fillRect(-2,-1.1,4,2.2); bx.restore();
  }
  /* scorch marks where a car burnt out */
  for(const sc of scorches){
    if(!inView(sc.x,sc.y,26)) continue;
    bx.globalAlpha=clamp(sc.life,0,1)*0.6;
    bx.save(); bx.translate(sc.x,sc.y); bx.rotate(sc.a);
    bx.fillStyle='#14161b'; bx.fillRect(-sc.w*0.6,-sc.h*0.75,sc.w*1.2,sc.h*1.5);
    bx.fillStyle='#22252c'; bx.fillRect(-sc.w*0.42,-sc.h*0.5,sc.w*0.84,sc.h);
    bx.restore();
  }
  bx.globalAlpha=1;
  /* blood pools */
  for(const b of bloods){
    if(!inView(b.x,b.y,12)) continue;
    bx.globalAlpha=clamp(b.life,0,1)*0.75;
    bx.fillStyle=PAL.blood;
    const n=5;
    bx.beginPath();
    for(let k=0;k<n;k++){
      const a=k/n*TAU, rr0=b.r*(0.6+((b.seed>>(k*2))&3)*0.16);
      const px=b.x+Math.cos(a)*rr0, py=b.y+Math.sin(a)*rr0*0.8;
      if(k===0) bx.moveTo(px,py); else bx.lineTo(px,py);
    }
    bx.closePath(); bx.fill();
    bx.globalAlpha=clamp(b.life,0,1)*0.45;
    bx.fillStyle=PAL.blood2; circle(b.x-b.r*0.2,b.y-b.r*0.2,b.r*0.42);
  }
  bx.globalAlpha=1;
  /* puddles */
  if(weather.puddles.length){
    const wet=clamp(weather.wet,0,1);
    for(const p of weather.puddles){
      if(!inView(p.x,p.y,40)) continue;
      bx.save(); bx.translate(p.x,p.y); bx.rotate(p.rot||0); bx.scale(p.sx||1,p.sy||1);
      const pts=p.pts||[1,1,1,1,1,1,1];
      bx.globalAlpha=0.5*wet; bx.fillStyle='#4e6a86';
      bx.beginPath();
      for(let k=0;k<pts.length;k++){
        const a=k/pts.length*TAU, rr0=p.r*pts[k];
        const px=Math.cos(a)*rr0, py=Math.sin(a)*rr0;
        if(k===0) bx.moveTo(px,py); else bx.lineTo(px,py);
      }
      bx.closePath(); bx.fill();
      bx.globalAlpha=0.30*wet; bx.fillStyle='#9fd0ff';
      bx.beginPath();
      for(let k=0;k<pts.length;k++){
        const a=k/pts.length*TAU, rr0=p.r*pts[k]*0.45;
        const px=Math.cos(a)*rr0-p.r*0.2, py=Math.sin(a)*rr0-p.r*0.2;
        if(k===0) bx.moveTo(px,py); else bx.lineTo(px,py);
      }
      bx.closePath(); bx.fill();
      bx.restore();
      bx.globalAlpha=1;
    }
  }
  /* spike strips lie on the tarmac */
  for(const s of spikes){
    if(!inView(s.x,s.y,ROAD)) continue;
    const half=ROAD*0.5-2;
    bx.save(); bx.translate(s.x,s.y); bx.rotate(s.a);
    bx.globalAlpha=clamp(s.life/2,0,1);
    bx.fillStyle= s.armed ? '#2b2f38' : '#3a3540';
    bx.fillRect(-2.5,-half,5,half*2);
    bx.fillStyle= s.armed ? '#d8dde6' : '#6a6a72';
    for(let t=-half+3;t<half-2;t+=4){ bx.fillRect(-1,t,2,2); }
    if(s.armed && Math.floor(now*6)%2){ bx.fillStyle=PAL.bad; bx.fillRect(-3.5,-half,1.4,half*2); bx.fillRect(2.1,-half,1.4,half*2); }
    bx.globalAlpha=1; bx.restore();
  }
}
/* Street furniture - drawn flat, then toppled and fading once smashed. */
function drawProps(){
  for(let n=0;n<city.props.length;n++){
    const p=city.props[n];
    if(p.x<VX-16||p.x>VX+VW+16||p.y<VY-16||p.y>VY+VH+16) continue;
    if(p.down && p.fade<=0) continue;
    const k=p.k;
    bx.save();
    bx.globalAlpha = p.down ? clamp(p.fade,0,1) : 1;
    const jx = p.shake>0 ? rr(-1,1) : 0;
    bx.translate(p.x+jx, p.y);
    if(p.down) bx.rotate(p.a);
    const r=k.r;
    /* shadow */
    bx.fillStyle='rgba(0,0,0,0.28)';
    bx.fillRect(-r*0.8+1.5, -r*0.5+2, r*1.6, r*1.1);
    const kind=p.kind;
    if(kind==='hydrant'){
      bx.fillStyle=k.col; bx.fillRect(-1.8,-3,3.6,5.4);
      bx.fillStyle=k.hi; bx.fillRect(-1.8,-3,3.6,1.4);
      bx.fillStyle=k.col; bx.fillRect(-3.2,-1.4,6.4,1.8);
    } else if(kind==='cone'){
      bx.fillStyle=k.col; bx.fillRect(-2,-0.6,4,2.4);
      bx.fillStyle=k.hi; bx.fillRect(-1.1,-3,2.2,2.6);
      bx.fillStyle='#e9f2ff'; bx.fillRect(-1.1,-2,2.2,0.8);
    } else if(kind==='bench'){
      bx.fillStyle=k.col; bx.fillRect(-r,-1.8,r*2,3.6);
      bx.fillStyle=k.hi; bx.fillRect(-r,-1.8,r*2,1.2);
      bx.fillStyle='#3a3630'; bx.fillRect(-r+1,1.4,1.4,1.4); bx.fillRect(r-2.4,1.4,1.4,1.4);
    } else if(kind==='planter'){
      bx.fillStyle=k.col; circle(0,0,r);
      bx.fillStyle=k.hi; circle(-r*0.2,-r*0.2,r*0.7);
      bx.fillStyle='#2f5a30'; circle(0,-0.6,r*0.55);
      bx.fillStyle='#437a3d'; circle(-r*0.2,-r*0.3,r*0.3);
    } else if(kind==='dumpster'){
      bx.fillStyle=shade(k.col,-0.3); bx.fillRect(-r,-r*0.62,r*2,r*1.24);
      bx.fillStyle=k.col; bx.fillRect(-r+0.8,-r*0.62+0.8,r*2-1.6,r*1.24-1.6);
      bx.fillStyle=k.hi; bx.fillRect(-r+0.8,-r*0.62+0.8,r*2-1.6,1.4);
      bx.fillStyle='#2b2f38'; bx.fillRect(-1,-r*0.62,2,r*1.24);
    } else if(kind==='busstop'){
      bx.fillStyle='rgba(180,214,255,0.30)'; bx.fillRect(-r,-2.6,r*2,5.2);
      bx.fillStyle=k.col; bx.fillRect(-r,-3.4,r*2,1.4);
      bx.fillStyle=k.hi; bx.fillRect(-r,-3.4,r*2,0.6);
      bx.fillStyle=k.col; bx.fillRect(-r,2,1.6,2); bx.fillRect(r-1.6,2,1.6,2);
      bx.fillStyle=PAL.neon; bx.fillRect(-2,-1.6,4,1.2);
    } else if(kind==='phonebox'||kind==='vending'){
      bx.fillStyle=k.col; bx.fillRect(-r*0.7,-r,r*1.4,r*2);
      bx.fillStyle='rgba(180,214,255,0.45)'; bx.fillRect(-r*0.45,-r*0.72,r*0.9,r*1.3);
      bx.fillStyle=k.hi; bx.fillRect(-r*0.7,-r,r*1.4,1.2);
    } else if(kind==='barrel'){
      bx.fillStyle=shade(k.col,-0.25); circle(0,0,r);
      bx.fillStyle=k.col; circle(0,0,r-0.8);
      bx.fillStyle=k.hi; bx.fillRect(-r+0.6,-1,r*2-1.2,1);
      bx.fillStyle='#2b2f38'; bx.fillRect(-r*0.4,-r*0.4,r*0.8,r*0.8);
    } else if(kind==='crate'){
      bx.fillStyle=k.col; bx.fillRect(-r,-r*0.85,r*2,r*1.7);
      bx.fillStyle=k.hi; bx.fillRect(-r,-r*0.85,r*2,1.2);
      bx.fillStyle=shade(k.col,-0.3);
      bx.fillRect(-r,-0.6,r*2,1.2); bx.fillRect(-0.6,-r*0.85,1.2,r*1.7);
    } else if(kind==='pump'){
      bx.fillStyle=k.col; bx.fillRect(-2.2,-3.2,4.4,6.4);
      bx.fillStyle='#2b2f38'; bx.fillRect(-1.4,-2.4,2.8,2.4);
      bx.fillStyle=PAL.amber; bx.fillRect(-1.4,0.6,2.8,1);
      bx.fillStyle='#6a6f78'; bx.fillRect(2.2,-1,2,1.2);
    } else if(kind==='haybale'){
      bx.fillStyle=k.col; bx.fillRect(-r,-r*0.72,r*2,r*1.44);
      bx.fillStyle=k.hi;
      for(let t=-r+1;t<r-1;t+=2.2) bx.fillRect(t,-r*0.72,1,r*1.44);
      bx.fillStyle='#8a7340'; bx.fillRect(-r,-r*0.72,r*2,1);
    } else if(kind==='cactus'){
      bx.fillStyle=k.col; bx.fillRect(-1.3,-r,2.6,r*1.8);
      bx.fillRect(-r*0.8,-r*0.3,r*0.8,1.8); bx.fillRect(1.3,-r*0.6,r*0.7,1.8);
      bx.fillStyle=k.hi; bx.fillRect(-1.3,-r,1,r*1.8);
    } else if(kind==='signpost'||kind==='meter'){
      bx.fillStyle='#4a4f59'; bx.fillRect(-0.7,-1,1.4,4);
      bx.fillStyle=k.col; bx.fillRect(-r,-4.4,r*2,3.2);
      bx.fillStyle=k.hi; bx.fillRect(-r,-4.4,r*2,1);
    } else {
      /* trashcan / mailbox / newsbox share a boxy silhouette */
      bx.fillStyle=k.col; bx.fillRect(-r*0.8,-r*0.9,r*1.6,r*1.8);
      bx.fillStyle=k.hi; bx.fillRect(-r*0.8,-r*0.9,r*1.6,1.2);
      bx.fillStyle=shade(k.col,-0.35); bx.fillRect(-r*0.8,r*0.5,r*1.6,0.9);
    }
    bx.restore();
    bx.globalAlpha=1;
  }
}
function drawBillboards(){
  for(const b of city.billboards){
    if(!inView(b.x,b.y,46)) continue;
    const dk=darknessNow();
    let x=b.x, y=b.y;
    if(b.roof){
      /* ride on top of the building's parallax offset */
      const lean=b.roof.hgt*0.62;
      const dx=clamp((b.roof.x+b.roof.w/2-cam.x)/(BW*0.5)*lean, -b.roof.w*0.48, b.roof.w*0.48);
      const dy=clamp((b.roof.y+b.roof.h/2-cam.y)/(BH*0.5)*lean, -b.roof.h*0.48, b.roof.h*0.48);
      x+=dx; y+=dy;
    }
    const w=b.w, h=13;
    bx.fillStyle='rgba(0,0,0,0.34)'; bx.fillRect(x-w/2+2,y-h/2+3,w,h);
    bx.fillStyle='#1a1f2b'; bx.fillRect(x-w/2,y-h/2,w,h);
    bx.fillStyle='#2a3140'; bx.fillRect(x-w/2,y-h/2,w,1.4); bx.fillRect(x-w/2,y+h/2-1.4,w,1.4);
    const lit = dk>0.2;
    bx.globalAlpha = lit?1:0.75;
    drawText(bx, b.ad.t, x, y-h/2+2, 1, lit?b.ad.c:shade(b.ad.c,-0.4), 'center');
    drawText(bx, b.ad.s, x, y+1, 1, lit?'#e9f2ff':'#8d97a8', 'center');
    bx.globalAlpha=1;
    if(!b.roof){
      bx.fillStyle='#4a4f59'; bx.fillRect(x-1,y+h/2,2,4);

}
/* Signal heads on the far side of each junction, plus stop signs. */
function drawJunctions(){
  for(const [key,L] of city.lights){
    if(L.ctrl==='none') continue;
    const parts0=key.split(','), i=+parts0[0], j=+parts0[1];
    const x=nodeX(i), y=nodeY(j);
    if(!inView(x,y,ROAD+16)) continue;
    for(let dir=0;dir<4;dir++){
      const d=DIRS[dir];
      const hx=x+d[0]*(ROAD/2+3), hy=y+d[1]*(ROAD/2+3);
      if(L.ctrl==='stop'){
        if(dir>1) continue;
        bx.fillStyle='#4a4f59'; bx.fillRect(hx-0.7,hy-1,1.4,4);
        bx.fillStyle=PAL.bad; circle(hx,hy-3.6,3);
        bx.fillStyle='#ffffff'; drawText(bx,'S',hx,hy-5.4,1,'#ffffff','center');
        continue;
      }
      const st=lightFor(i,j,dir);
      bx.fillStyle='#22262e'; bx.fillRect(hx-2,hy-6.5,4,7.5);
      bx.fillStyle='#14171d'; bx.fillRect(hx-1.4,hy-6,2.8,6.6);
      const cols=[st==='red'?'#ff3b30':'#3a1512', st==='amber'?'#ffb020':'#3c2c0e', st==='green'?'#4dff7a':'#123a1c'];
      for(let s=0;s<3;s++){ bx.fillStyle=cols[s]; bx.fillRect(hx-1,hy-5.6+s*2.1,2,1.7); }
    }

}
/* Freight trains and the barriers they drop. */
function drawTrains(){
  const railY=city.rail.y;
  for(const t of trains){
    const span=trainSpan(t);
    const headX=t.x, dirv=t.dir;
    if(!inView(t.x - dirv*span*0.5, railY, span)) continue;
    /* locomotive */
    const drawCar=(cx,len,col,top,loco)=>{
      if(!inView(cx,railY,len)) return;
      bx.fillStyle='rgba(0,0,0,0.42)'; bx.fillRect(cx-len/2+2, railY-9+4, len, 18);
      bx.fillStyle=col; bx.fillRect(cx-len/2, railY-9, len, 18);
      bx.fillStyle=top; bx.fillRect(cx-len/2+1, railY-8, len-2, 4);
      bx.fillStyle=shade(col,-0.35); bx.fillRect(cx-len/2, railY+5, len, 4);
      bx.fillStyle='#15171c';
      for(let w=-len/2+4; w<len/2-3; w+=9){ bx.fillRect(cx+w,railY-11,4,2.4); bx.fillRect(cx+w,railY+8.6,4,2.4); }
      if(loco){
        bx.fillStyle='#22283a'; bx.fillRect(cx+dirv*(len/2-9), railY-5, 7, 10);
        bx.fillStyle='#7fb8e8'; bx.fillRect(cx+dirv*(len/2-7), railY-4, 3, 8);
        bx.fillStyle='#ffe9a8'; bx.fillRect(cx+dirv*(len/2-1.6), railY-3, 2, 2.4);
        bx.fillStyle='#ffe9a8'; bx.fillRect(cx+dirv*(len/2-1.6), railY+0.6, 2, 2.4);
      } else {
        bx.fillStyle=shade(col,-0.2);
        for(let w=-len/2+5; w<len/2-4; w+=7) bx.fillRect(cx+w, railY-6, 1.4, 12);
      }
    };
    drawCar(headX - dirv*16, 30, '#3a4250', '#4b556a', true);
    for(let n=0;n<t.n;n++){
      const cx = headX - dirv*(34 + n*30 + 14);
      const pal = n%3===0?['#6a4a3a','#7d5946'] : n%3===1?['#3f5247','#4e6558'] : ['#54414a','#68525c'];
      drawCar(cx, 26, pal[0], pal[1], false);
    }
  }
  /* crossing barriers and flashers */
  for(const c of city.crossings){
    if(!inView(c.x,c.y,ROAD+14)) continue;
    const half=ROAD*0.5;
    for(const side of [-1,1]){
      const py=c.y+side*17;
      bx.fillStyle='#4a4f59'; bx.fillRect(c.x-half-3, py-1.2, 3, 2.4);
      /* flashing lamps */
      const on = c.warn && Math.floor(now*4)%2===0;
      bx.fillStyle = c.warn ? (on?'#ff3b30':'#4a1a16') : '#4a1a16';
      bx.fillRect(c.x-half-4, py-4, 3, 2.4);
      bx.fillStyle = c.warn ? (on?'#4a1a16':'#ff3b30') : '#4a1a16';
      bx.fillRect(c.x+half+1, py-4, 3, 2.4);
      bx.fillStyle='#4a4f59'; bx.fillRect(c.x+half, py-1.2, 3, 2.4);
      /* the boom itself swings down */
      if(c.down>0.02){
        const len=(ROAD*0.52)*c.down;
        bx.save(); bx.translate(c.x-half, py); 
        bx.fillStyle='#e9f2ff'; bx.fillRect(0,-1.1,len,2.2);
        bx.fillStyle=PAL.bad;
        for(let s=3;s<len;s+=8) bx.fillRect(s,-1.1,4,2.2);
        bx.restore();
        bx.save(); bx.translate(c.x+half, py);
        bx.fillStyle='#e9f2ff'; bx.fillRect(-len,-1.1,len,2.2);
        bx.fillStyle=PAL.bad;
        for(let s=3;s<len;s+=8) bx.fillRect(-s-4,-1.1,4,2.2);
        bx.restore();
      }
    }
  }
}
function drawBullets(){
  for(const b of bullets){

function drawDebris(){

function drawCops(){

}
function drawTrees(){

function drawLamps(dk){
