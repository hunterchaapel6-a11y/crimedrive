/* ------------------------------ utils ---------------------------------- */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const sign  = v=> v<0?-1:(v>0?1:0);
let _seed = 0x2f6e2b1 >>> 0;
function srand(s){ _seed = (s>>>0)||1; }
function rnd(){ _seed ^= _seed<<13; _seed>>>=0; _seed ^= _seed>>17; _seed ^= _seed<<5; _seed>>>=0; return _seed/4294967296; }
const rr = (a,b)=> a + rnd()*(b-a);
const ri = (a,b)=> Math.floor(a + rnd()*(b-a+1));
const pick = a=> a[Math.floor(rnd()*a.length)];
function angDiff(a,b){ let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
const dist = (ax,ay,bx,by)=> Math.hypot(ax-bx, ay-by);
const dist2 = (ax,ay,bx,by)=>{ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; };

function textW(str,sc){ return String(str).length*6*sc - sc; }
function drawText(g,str,x,y,sc,col,align){
  str = String(str).toUpperCase();
  const w = str.length*6*sc - sc;
  if(align==='center') x = Math.round(x - w/2);
  else if(align==='right') x = Math.round(x - w);
  x=Math.round(x); y=Math.round(y);
  g.fillStyle = col;
  for(let i=0;i<str.length;i++){
    const gl = FONT[str[i]]; if(!gl) continue;
    const gx = x + i*6*sc;
    for(let r=0;r<7;r++){
      const row = gl[r]; if(!row) continue;
      let c=0;
      while(c<5){
        if(row & (1<<(4-c))){ const s=c; while(c<5 && (row & (1<<(4-c)))) c++; g.fillRect(gx+s*sc, y+r*sc, (c-s)*sc, sc); }
        else c++;
      }
    }
  }
  return w;
}
function shadowText(g,str,x,y,sc,col,align,shadow){
  drawText(g,str,x+sc,y+sc,sc,shadow||'#000', align);
  drawText(g,str,x,y,sc,col,align);
}

/* ------------------------------ canvas --------------------------------- */
const screenC = document.getElementById('screen');
const sctx = screenC.getContext('2d', {alpha:false});
const buf = document.createElement('canvas');
const bx = buf.getContext('2d', {alpha:false});

let BW=480, BH=270, SCALE=3;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  const w = Math.max(320, window.innerWidth), h = Math.max(240, window.innerHeight);
  const dw = Math.floor(w*dpr), dh = Math.floor(h*dpr);
  SCALE = clamp(Math.round(Math.min(dw/520, dh/300)), 2, 8);
  BW = clamp(Math.floor(dw/SCALE), 280, 900);
  BH = clamp(Math.floor(dh/SCALE), 200, 700);
  screenC.width = BW*SCALE; screenC.height = BH*SCALE;
  screenC.style.width = (BW*SCALE/dpr)+'px';
  screenC.style.height = (BH*SCALE/dpr)+'px';
  buf.width=BW; buf.height=BH;
  lightC.width=BW; lightC.height=BH;
  bx.imageSmoothingEnabled=false; sctx.imageSmoothingEnabled=false; lx.imageSmoothingEnabled=false;
}
window.addEventListener('resize', resize);
resize();

/* --------------------------- light sprites ------------------------------ */
function makeGlow(rgb){
  const s=64, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grd.addColorStop(0,'rgba('+rgb+',1)');
  grd.addColorStop(0.35,'rgba('+rgb+',0.55)');
  grd.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=grd; g.fillRect(0,0,s,s);
  return c;
}
function makeCone(rgb){
  const W=112,H=112, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); const ox=8, oy=H/2;
  const grd=g.createRadialGradient(ox,oy,4,ox,oy,100);
  grd.addColorStop(0,'rgba('+rgb+',0.95)');
  grd.addColorStop(0.45,'rgba('+rgb+',0.42)');
  grd.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=grd; g.beginPath(); g.moveTo(ox,oy);
  g.arc(ox,oy,100,-0.34,0.34); g.closePath(); g.fill();
  return c;
}
const GLOW_W = makeGlow('255,255,255'), GLOW_A = makeGlow('255,206,120'),
      GLOW_R = makeGlow('255,60,60'),  GLOW_B = makeGlow('80,140,255'),
      GLOW_C = makeGlow('80,255,235'), GLOW_P = makeGlow('255,70,150'),

/* ------------------------------ input ----------------------------------- */
const keys = Object.create(null);
const tapped = Object.create(null);
const KEYMAP = {
  up:['w','arrowup'], down:['s','arrowdown'], left:['a','arrowleft'], right:['d','arrowright'],
  hand:['shift'], boost:['f'], action:[' '], pause:['p','escape'], map:['m'], mute:['n'], horn:['h'],
  fire:['control'], wheel:['q'], cycle:['e'], radio:['r']
};
function down(act){ return KEYMAP[act].some(k=>keys[k]); }
function hit(act){ return KEYMAP[act].some(k=>tapped[k]); }
window.addEventListener('keydown', e=>{
  let k = e.key.toLowerCase();
  if(k==='shift') k='shift';
  if(k==='control') k='control';
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','/'].includes(k)) e.preventDefault();
  if(!keys[k]) tapped[k]=true;
  keys[k]=true;
  Audio0.unlock();
});
window.addEventListener('keyup', e=>{ let k=e.key.toLowerCase(); keys[k]=false; });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; mouse.down=false; });

/* mouse aiming: the crosshair cursor was always a hint */
const mouse = { x:0, y:0, wx:0, wy:0, down:false, pressed:false, wheel:0, active:false };
function mouseToWorld(e){
  const r=screenC.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)/r.width*BW;
  mouse.y=(e.clientY-r.top)/r.height*BH;
  mouse.wx=VX+mouse.x; mouse.wy=VY+mouse.y;
  mouse.active=true;
}
screenC.addEventListener('mousemove', mouseToWorld);
screenC.addEventListener('mousedown', e=>{ if(e.button===0){ mouse.down=true; mouse.pressed=true; mouseToWorld(e); } Audio0.unlock(); });
window.addEventListener('mouseup', e=>{ if(e.button===0) mouse.down=false; });
screenC.addEventListener('contextmenu', e=>e.preventDefault());
window.addEventListener('wheel', e=>{
  if(Math.abs(e.deltaY)>0){ mouse.wheel += e.deltaY>0 ? 1 : -1; e.preventDefault(); }
}, {passive:false});
screenC.addEventListener('mouseleave', ()=>{ mouse.down=false; });

/* touch controls (mobile) */
const touchUI = { on:false, btns:[], active:{} };
function setupTouch(){
  if(!('ontouchstart' in window) && !navigator.maxTouchPoints) return;
  touchUI.on = true;
  const pts = new Map();
  function test(x,y){
    for(const b of touchUI.btns){ if(x>=b.x-4&&x<=b.x+b.w+4&&y>=b.y-4&&y<=b.y+b.h+4) return b.id; }
    return null;
  }
  function upd(e){
    e.preventDefault();
    const rect = screenC.getBoundingClientRect();
    pts.clear();
    for(const t of e.touches){
      const x = (t.clientX-rect.left)/rect.width*BW, y=(t.clientY-rect.top)/rect.height*BH;
      const id = test(x,y); if(id) pts.set(id,true);
    }
    const prev = touchUI.active; touchUI.active = {};
    for(const id of pts.keys()){ touchUI.active[id]=true; if(!prev[id]) tapped['touch_'+id]=true; }
    for(const b of touchUI.btns){
      for(const k of (b.keys||[])){
        keys[k] = !!touchUI.active[b.id];
        if(touchUI.active[b.id] && !prev[b.id]) tapped[k]=true;
      }
    }
    Audio0.unlock();
  }
  screenC.addEventListener('touchstart', upd, {passive:false});
  screenC.addEventListener('touchmove', upd, {passive:false});
  screenC.addEventListener('touchend', upd, {passive:false});
  screenC.addEventListener('touchcancel', upd, {passive:false});
}
screenC.addEventListener('mousedown', ()=>Audio0.unlock());

/* ------------------------------ audio ----------------------------------- */
const Audio0 = {
  ctx:null, master:null, engGain:null, engOsc:null, engOsc2:null, skidGain:null, skidSrc:null,
  muted:false, ready:false,
  unlock(){
    if(this.ready) return;
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
      const filt = this.ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=900; filt.connect(this.master);
      this.engGain = this.ctx.createGain(); this.engGain.gain.value=0; this.engGain.connect(filt);
      this.engOsc = this.ctx.createOscillator(); this.engOsc.type='sawtooth'; this.engOsc.frequency.value=60;
      this.engOsc2 = this.ctx.createOscillator(); this.engOsc2.type='square'; this.engOsc2.frequency.value=31;
      this.engOsc.connect(this.engGain); this.engOsc2.connect(this.engGain);
      this.engOsc.start(); this.engOsc2.start();
      const len = this.ctx.sampleRate*2, b = this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.skidSrc = this.ctx.createBufferSource(); this.skidSrc.buffer=b; this.skidSrc.loop=true;
      const hp = this.ctx.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=1800; hp.Q.value=0.8;
      this.skidGain = this.ctx.createGain(); this.skidGain.gain.value=0;
      this.skidSrc.connect(hp); hp.connect(this.skidGain); this.skidGain.connect(this.master);
      this.skidSrc.start();
      this.ready=true;
    }catch(e){ this.ready=false; }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
  },
  blip(freq,dur,type,vol){
    if(!this.ready||this.muted) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+(dur||0.12)+0.02);
  },
  sweep(f1,f2,dur,vol,type){
    if(!this.ready||this.muted) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sawtooth'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(vol||0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  crash(power){
    if(!this.ready||this.muted) return;
    const t=this.ctx.currentTime, len=Math.floor(this.ctx.sampleRate*0.3);
    const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2); }
    const s=this.ctx.createBufferSource(); s.buffer=b;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400+power*900;
    const g=this.ctx.createGain(); g.gain.value=clamp(power,0.05,0.5);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  engine(rpm,load){
    if(!this.ready) return;
    const t=this.ctx.currentTime;
    const f = 42 + rpm*150;
    this.engOsc.frequency.setTargetAtTime(f, t, 0.06);
    this.engOsc2.frequency.setTargetAtTime(f*0.5, t, 0.06);
    this.engGain.gain.setTargetAtTime(this.muted?0:(0.018 + load*0.05), t, 0.1);
  },
  skid(v){ if(!this.ready) return; this.skidGain.gain.setTargetAtTime(this.muted?0:v*0.09, this.ctx.currentTime, 0.05); },
  toggle(){ this.muted=!this.muted; if(this.master) this.master.gain.value = this.muted?0:0.5; },

  /* ---- how loud something is from where the player is standing ---- */
  att(x,y){
    if(x===undefined) return 1;
    const d=Math.hypot(x-player.x, y-player.y);
    return clamp(1 - d/440, 0, 1);
  },
  noise(dur,vol,type,f0,f1,q){
    if(!this.ready||this.muted||vol<=0.002) return null;
    const t=this.ctx.currentTime, len=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
    const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.8);
    const s=this.ctx.createBufferSource(); s.buffer=b;
    const f=this.ctx.createBiquadFilter(); f.type=type||'lowpass';
    f.frequency.setValueAtTime(f0,t);
    if(f1!==undefined) f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
    if(q) f.Q.value=q;
    const g=this.ctx.createGain(); g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
    return s;
  },
  /* ---- weapons ---- */
  gunshot(power,x,y){
    const a=this.att(x,y); if(a<=0.01) return;
    this.noise(0.09+power*0.05, 0.34*power*a, 'lowpass', 2600, 300);
    this.noise(0.035, 0.22*power*a, 'highpass', 1800);
    this.blip(90/power, 0.07, 'square', 0.08*a);
  },
  dryFire(){ this.blip(1400,0.03,'square',0.05); this.blip(700,0.04,'square',0.04); },
  swing(hit){

  },
  thud(big){
    this.noise(big?0.22:0.14, big?0.36:0.22, 'lowpass', big?340:420, 80);
    this.blip(big?70:96, 0.10, 'sine', 0.14);

  hit(){ this.noise(0.1,0.2,'lowpass',700,180); this.blip(150,0.07,'square',0.08); },
  thunk(size){

  },
  boom(){
    this.noise(0.65, 0.55, 'lowpass', 1400, 60);

    this.sweep(160, 28, 0.6, 0.22, 'sawtooth');
  },
  tirePop(){

    this.noise(0.85,0.14,'highpass',3200);

  },
  coin(){ this.blip(1180,0.06,'triangle',0.09); setTimeout(()=>this.blip(1570,0.09,'triangle',0.08),55); },
  glass(){ for(let i=0;i<4;i++) setTimeout(()=>this.blip(1800+Math.random()*1800,0.05,'triangle',0.05), i*38); },
  horn(x,y,type){
    const a=this.att(x,y); if(a<=0.03) return;
    const base = type==='truck'||type==='semi'||type==='bus' ? 180 : type==='moto' ? 520 : 380;
    this.blip(base, 0.26, 'square', 0.07*a);
    this.blip(base*1.26, 0.26, 'square', 0.05*a);
  },
  /* ---- UI ---- */
  ui(kind){
    if(kind==='move') this.blip(620,0.035,'square',0.05);
    else if(kind==='select') { this.blip(880,0.05,'triangle',0.08); setTimeout(()=>this.blip(1320,0.07,'triangle',0.07),50); }
    else if(kind==='deny') this.blip(150,0.13,'square',0.09);
    else if(kind==='open') { this.blip(420,0.05,'triangle',0.07); setTimeout(()=>this.blip(660,0.08,'triangle',0.06),48); }
    else if(kind==='close') { this.blip(520,0.05,'triangle',0.06); setTimeout(()=>this.blip(300,0.08,'triangle',0.06),48); }
    else if(kind==='tick') this.blip(1500,0.02,'square',0.03);
  },

  /* ---- siren: two-tone wail that follows the wanted level ---- */
  sirenOn(level){
    if(!this.ready) return;
    if(!this.sirenG){
      this.sirenG=this.ctx.createGain(); this.sirenG.gain.value=0;
      const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=1.1;
      this.sirenG.connect(f); f.connect(this.master);
      this.sirenO=this.ctx.createOscillator(); this.sirenO.type='sawtooth'; this.sirenO.frequency.value=700;
      this.sirenO.connect(this.sirenG); this.sirenO.start();
      this.sirenT=0;
    }
  },
  sirenUpdate(dt,level,near){
    if(!this.ready) return;
    if(level<=0 || near<=0){ if(this.sirenG) this.sirenG.gain.setTargetAtTime(0,this.ctx.currentTime,0.25); return; }
    this.sirenOn(level);
    this.sirenT=(this.sirenT||0)+dt*(1.7+level*0.22);
    const w=Math.sin(this.sirenT*TAU);
    this.sirenO.frequency.setTargetAtTime(660+w*230, this.ctx.currentTime, 0.02);
    this.sirenG.gain.setTargetAtTime(this.muted?0:0.028*near, this.ctx.currentTime, 0.12);
  }
};

/* ---------------------------- radio & score ------------------------------ */
/* Procedural stations. Nothing is sampled - every station is a little step
   sequencer with its own scale, tempo and voicing. */
const SCALES = {
  minor:[0,2,3,5,7,8,10], major:[0,2,4,5,7,9,11], penta:[0,3,5,7,10], dorian:[0,2,3,5,7,9,10]
};
const STATIONS = [
  {name:'OFF', off:true},
  {name:'NEON 104.3', tag:'SYNTHWAVE', root:46, scale:'minor', bpm:104, lead:'square', bass:'sawtooth',
   pat:[0,4,2,4, 0,4,5,4, 3,7,5,7, 3,7,2,4], bassPat:[0,0,5,5,3,3,4,4], hats:0.5, col:'#ff3d81'},
  {name:'K-ROK 88.1', tag:'GARAGE ROCK', root:40, scale:'penta', bpm:138, lead:'sawtooth', bass:'square',
   pat:[0,0,3,3, 2,2,0,0, 4,4,3,3, 2,2,1,0], bassPat:[0,0,0,3,3,3,4,4], hats:0.9, col:'#ffb020'},
  {name:'PULSE 99.7', tag:'ELECTRO', root:50, scale:'dorian', bpm:152, lead:'square', bass:'sawtooth',
   pat:[0,3,5,3, 7,5,3,5, 0,3,5,7, 10,7,5,3], bassPat:[0,0,0,0,5,5,3,3], hats:1.0, col:'#3ff2e0'},
  {name:'BIG SKY 61', tag:'COUNTRY', root:43, scale:'major', bpm:96, lead:'triangle', bass:'triangle',
   pat:[0,2,4,2, 4,5,4,2, 0,2,4,7, 5,4,2,0], bassPat:[0,0,4,4,5,5,4,4], hats:0.3, col:'#6dff8f'}
];
const CHASE = {root:38, scale:'minor', pat:[0,0,5,0, 3,0,5,0, 0,0,6,0, 5,0,3,0], bassPat:[0,0,0,0,1,1,0,0]};
const Music = {
  idx:1, step:0, nextT:0, on:true, chase:false, chaseLvl:0, vol:0.5,
  gain:null, wasChase:false,
  ensure(){
    if(!Audio0.ready) return false;
    if(!this.gain){
      this.gain=Audio0.ctx.createGain(); this.gain.gain.value=this.vol;
      const f=Audio0.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=5200;
      this.gain.connect(f); f.connect(Audio0.master);
    }
    return true;
  },
  note(semi,dur,type,vol,detune){
    const t=Audio0.ctx.currentTime;
    const o=Audio0.ctx.createOscillator(), g=Audio0.ctx.createGain();
    o.type=type; o.frequency.value=440*Math.pow(2,(semi-69)/12);
    if(detune) o.detune.value=detune;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t+dur+0.03);
  },
  perc(vol,f0,f1,dur){
    const t=Audio0.ctx.currentTime, len=Math.floor(Audio0.ctx.sampleRate*dur);
    const b=Audio0.ctx.createBuffer(1,len,Audio0.ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
    const s=Audio0.ctx.createBufferSource(); s.buffer=b;
    const f=Audio0.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(f0,t);
    if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    f.Q.value=0.9;
    const g=Audio0.ctx.createGain(); g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.gain); s.start(t);
  },
  update(){
    if(!this.ensure()) return;
    const want = this.chase ? 0.42 : (this.on && !STATIONS[this.idx].off && !player.onFoot ? 0.34 : 0);
    this.gain.gain.setTargetAtTime(Audio0.muted?0:want, Audio0.ctx.currentTime, 0.3);
    if(want<=0.001){ this.nextT=0; return; }
    const S = this.chase ? CHASE : STATIONS[this.idx];
    const bpm = this.chase ? (128+this.chaseLvl*12) : S.bpm;
    const spb = 60/bpm/2;                                 /* eighth notes */
    const t=Audio0.ctx.currentTime;
    if(this.nextT===0 || this.chase!==this.wasChase){ this.nextT=t; this.step=0; this.wasChase=this.chase; }
    let guard=0;
    while(this.nextT < t+0.12 && guard++<8){
      const s=this.step;
      const sc=SCALES[S.scale||'minor'];
      const root=S.root;
      const deg=S.pat[s%S.pat.length];
      const oct=Math.floor(deg/sc.length);
      const semi=root+12+sc[((deg%sc.length)+sc.length)%sc.length]+oct*12;
      if(this.chase){
        this.note(semi, spb*0.9, 'square', 0.06, s%2?9:-9);
        if(s%2===0) this.note(root-12+SCALES.minor[CHASE.bassPat[(s>>1)%CHASE.bassPat.length]], spb*1.7, 'sawtooth', 0.075);
        if(s%4===0) this.perc(0.22, 180, 60, 0.13);
        if(s%4===2) this.perc(0.13, 1800, 900, 0.05);
        if(this.chaseLvl>=4 && s%8===7) this.perc(0.16, 3200, 1400, 0.07);
      } else {
        if(deg!==undefined) this.note(semi, spb*1.25, S.lead, 0.045, s%2?6:-6);
        if(s%2===0){
          const bd=S.bassPat[(s>>1)%S.bassPat.length];
          this.note(root-12+sc[bd%sc.length], spb*1.8, S.bass, 0.055);
        }
        if(s%4===0) this.perc(0.17, 160, 55, 0.12);
        if(s%4===2) this.perc(0.10*S.hats, 1700, 800, 0.05);
        if(S.hats>0.6 && s%2===1) this.perc(0.05*S.hats, 2600, 1600, 0.03);
      }
      this.nextT += spb;
      this.step=(this.step+1)%64;
    }
  },
  next(d){
    this.idx=(this.idx+d+STATIONS.length)%STATIONS.length;
    this.nextT=0; this.step=0;
    Audio0.ui('tick');
    return STATIONS[this.idx];
  }
};

/* ------------------------- junction control ------------------------------ */
/* One shared clock; every junction just holds an offset, so lights across the
   city drift out of sync the way real ones do. */
const LIGHT_GREEN=7.0, LIGHT_AMBER=1.6, LIGHT_GAP=0.6;
const LIGHT_HALF = LIGHT_GREEN+LIGHT_AMBER+LIGHT_GAP;
const LIGHT_CYCLE = LIGHT_HALF*2, LIGHT_CYCLE_STEPS = 8;
let lightT = 0;
/* returns 'green' | 'amber' | 'red' | 'stop' | 'none' for a given approach */
function lightFor(i,j,dir){
  const L = city.lights.get(i+','+j);
  if(!L) return 'none';
  if(L.ctrl==='stop') return 'stop';
  if(L.ctrl!=='light') return 'none';
  const t=(lightT+L.off)%LIGHT_CYCLE;
  const ew=(dir===0||dir===2);
  const inFirst = t<LIGHT_HALF;
  const local = inFirst ? t : t-LIGHT_HALF;
  const servingEW = inFirst ? !L.ns : !!L.ns;
  if(ew!==servingEW) return 'red';
  if(local<LIGHT_GREEN) return 'green';
  if(local<LIGHT_GREEN+LIGHT_AMBER) return 'amber';
  return 'red';
}

function zoneAt(i,j){
  /* rings out from the core, softened by noise so the borders aren't square */
  const dx=(i-(COLS-1)/2)/((COLS-1)/2), dy=(j-(ROWS-1)/2)/((ROWS-1)/2);
  let d=Math.max(Math.abs(dx),Math.abs(dy))*0.6 + Math.hypot(dx,dy)*0.4;
  d += (Math.sin(i*2.7+j*1.3)*0.5+Math.cos(i*1.1-j*2.2)*0.5)*0.09;
  if(d<0.26) return 'downtown';
  if(d<0.52) return 'commercial';
  if(d<0.78) return 'residential';
  return (i+j)%3===0 ? 'agricultural' : 'industrial';
}

/* Props are static, so index them once and query the grid rather than
   scanning all ~600 of them per vehicle per frame. */
const PG=52;
const propGrid=new Map();
function buildPropGrid(){
  propGrid.clear();
  for(const p of city.props){
    const k=((p.x/PG)|0)+','+((p.y/PG)|0);
    let a=propGrid.get(k); if(!a){ a=[]; propGrid.set(k,a); }
    a.push(p);
  }
}
const _pnear=[];
function nearProps(x,y,r){
  _pnear.length=0;
  const i0=((x-r)/PG)|0, i1=((x+r)/PG)|0, j0=((y-r)/PG)|0, j1=((y+r)/PG)|0;
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const a=propGrid.get(i+','+j); if(a) for(const q of a) _pnear.push(q);
  }
  return _pnear;
}
function addProp(x,y,kind,extra){
  const k=PROP_KINDS[kind]; if(!k) return null;
  const p={x,y,kind,k,hp:k.hp,down:0,fade:1,a:rnd()*TAU,vx:0,vy:0,spin:0,seed:ri(0,999)};
  if(extra) Object.assign(p,extra);
  city.props.push(p); return p;
}

function circleClear(x,y,r,list){
  for(const q of list){
    if(q && q.x!==undefined && dist2(x,y,q.x,q.y)<(r+(q.r||0)+3)*(r+(q.r||0)+3)) return false;
  }
  return true;
}
function buildingClear(x,y,r,buildings){
  for(const bd of buildings){
    const cx=clamp(x,bd.x,bd.x+bd.w), cy=clamp(y,bd.y,bd.y+bd.h);
    if(dist2(x,y,cx,cy)<(r+2)*(r+2)) return false;
  }
  return true;
}
function addTreeSafe(b,x,y,r){
  if(buildingClear(x,y,r,b.buildings) && (!b.fountain || dist2(x,y,b.fountain.x,b.fountain.y)>(r+b.fountain.r+4)**2) &&
     (!b.pond || dist2(x,y,b.pond.x,b.pond.y)>(r+b.pond.r+4)**2)){
    b.trees.push({x,y,r,s:ri(0,3)}); return true;
  }
  return false;
}
function addPropSafe(b,x,y,kind){
  const k=PROP_KINDS[kind];
  if(!k || !buildingClear(x,y,k.r,b.buildings)) return null;
  if(b.fountain && dist2(x,y,b.fountain.x,b.fountain.y)<(k.r+b.fountain.r+5)**2) return null;
  if(b.pond && dist2(x,y,b.pond.x,b.pond.y)<(k.r+b.pond.r+5)**2) return null;
  return addProp(x,y,kind);
}
function genCity(){

  city.shops=[]; city.crossings=[]; city.bridges=[]; city.parkSpots=[];
  city.lights=new Map(); city.hospital=null; city.station=null;

  /* the river runs north-south through one block column; the railway east-west through one row */
  city.river = { i:8 };
  city.rail  = { j:3, y: ROAD + 3*CELL + BLOCK*0.5, trains:[] };

  for(let j=0;j<ROWS;j++) for(let i=0;i<COLS;i++){
    const bx0 = ROAD + i*CELL, by0 = ROAD + j*CELL;
    const zone = zoneAt(i,j);
    const b = { i,j, x:bx0, y:by0, w:BLOCK, h:BLOCK, type:'city', zone, buildings:[], trees:[], deco:[], fences:[] };
    if(i===city.river.i) b.type='water';
    else if(j===city.rail.j) b.type='rail';
    else {
      const roll = rnd();
      if(zone==='agricultural'){ if(roll<0.55) b.type='farm'; else if(roll<0.66) b.type='park'; }
      else if(zone==='industrial'){ if(roll<0.20) b.type='lot'; else if(roll<0.26) b.type='park'; }
      else if(zone==='residential'){ if(roll<0.20) b.type='park'; else if(roll<0.28) b.type='lot'; }
      else { if(roll<0.10) b.type='park'; else if(roll<0.19) b.type='lot'; else if(roll<0.26) b.type='plaza'; }
    }
    city.blocks.push(b);
  }

  const setBlock=(i,j,fn)=>{ const b=city.blocks[blockIdx(i,j)]; if(b && b.type!=='water' && b.type!=='rail') fn(b); return b; };

  /* ---- mod garages: drive in through the shutter ---- */
  const gspots = [[1,1],[10,2],[3,7],[10,8],[5,5],[2,10],[6,9]];
  for(const [gi,gj] of gspots){
    setBlock(gi,gj, b=>{
      b.type='garage'; b.buildings=[]; b.trees=[];

      else if(side===2){ apron={x:inner.x,y:inner.y+18,w:52,h:inner.h-36}; shop={x:inner.x+52,y:inner.y,w:inner.w-52,h:inner.h}; }
      else if(side===1){ apron={x:inner.x+18,y:inner.y+inner.h-52,w:inner.w-36,h:52}; shop={x:inner.x,y:inner.y,w:inner.w,h:inner.h-52}; }
      else { apron={x:inner.x+18,y:inner.y,w:inner.w-36,h:52}; shop={x:inner.x,y:inner.y,w:inner.w,h:inner.h-52}; }
      b.apron=apron;
      b.buildings.push({x:shop.x,y:shop.y,w:shop.w,h:shop.h,col:'#474d5c',top:'#5c6272',hgt:30,seed:ri(0,999),garage:true,gside:side});
      city.garages.push({x:apron.x+apron.w/2, y:apron.y+apron.h/2, r:Math.min(apron.w,apron.h)*0.5+6, block:b, apron:apron});

  /* ---- landmark services ---- */

  for(const b of city.blocks){

    if(b.type==='city'){

        /* rows of small houses with yards */
        const cols=ri(2,3), rows=2, gap=5;
        const cw=(inner.w-(cols-1)*gap)/cols, ch=(inner.h-(rows-1)*gap)/rows;
        for(let cy=0;cy<rows;cy++) for(let cx=0;cx<cols;cx++){
          if(rnd()<0.14) continue;
          const pad=rr(1,4);
          const bd={x:inner.x+cx*(cw+gap)+pad, y:inner.y+cy*(ch+gap)+pad, w:cw-pad*2, h:ch-pad*2-4,

          const c=pick(Z.cols); bd.col=c[0]; bd.top=c[1];
          if(bd.w>10&&bd.h>10) b.buildings.push(bd);
        }
        for(let k=0,tries=0;k<ri(2,5)&&tries<30;tries++){ const x=inner.x+rr(6,inner.w-6), y=inner.y+rr(6,inner.h-6), r=rr(4,7); if(addTreeSafe(b,x,y,r)) k++; }

        /* wide warehouses, yards, tanks */

        for(let k=0;k<n;k++){

      } else {
        const cols = b.zone==='downtown'?ri(1,2):ri(1,2), rows = ri(1,2), gap=4;
        const cw=(inner.w-(cols-1)*gap)/cols, ch=(inner.h-(rows-1)*gap)/rows;
        for(let cy=0;cy<rows;cy++) for(let cx=0;cx<cols;cx++){
          if(rnd()<0.10) continue;
          const pad=rnd()<0.4?ri(0,5):0;
          const bd = { x: inner.x+cx*(cw+gap)+pad, y: inner.y+cy*(ch+gap)+pad,
                       w: cw-pad*2, h: ch-pad*2, hgt: rr(Z.hgt[0],Z.hgt[1]), seed: ri(0,9999) };
          const c=pick(Z.cols); bd.col=c[0]; bd.top=c[1];

      b.field = { rows: ri(6,9), crop: pick(['#8a9440','#9c8a3a','#6f8f4a']) };

      }
      if(rnd()<0.4) b.silo={x:inner.x+inner.w-rr(16,26), y:inner.y+rr(16,30), r:rr(8,11)};
      for(let k=0;k<ri(2,5);k++) addProp(inner.x+rr(10,inner.w-10), inner.y+rr(10,inner.h-10), 'haybale');
    } else if(b.type==='rail'){
      /* railway corridor: gravel bed through the middle, yard either side */
      b.railY = city.rail.y;
      for(let k=0;k<ri(2,5);k++) addProp(inner.x+rr(8,inner.w-8), b.railY+(rnd()<0.5?-1:1)*rr(26,46), pick(['crate','barrel','crate']));

    } else if(b.type==='water'){
      /* embankment walls keep you out of the drink */
      const wallT = 6;
      b.water = {x:b.x, y:b.y, w:b.w, h:b.h};
      b.buildings.push({x:b.x, y:b.y, w:b.w, h:b.h, hgt:0, seed:ri(0,999), col:'#2a4a6a', top:'#2a4a6a', water:true});

    /* street lamps at block corners */
    const off=5;
    if(b.type!=='water'){

  /* ---- billboards: rooftop in the core, roadside further out ---- */
  const ADS = [

      }
    } else if(rnd()<0.16){
      const side=ri(0,3);
      const px = side===0? b.x+b.w+4 : side===2? b.x-4 : b.x+b.w*0.5;
      const py = side===1? b.y+b.h+4 : side===3? b.y-4 : b.y+b.h*0.5;
      city.billboards.push({x:px, y:py, w:24, roof:null, ad:pick(ADS), seed:ri(0,999), vert:(side===0||side===2)});
    }
  }

  /* ---- level crossings where the railway meets each north-south road ---- */
  for(let i=0;i<=COLS;i++){
    const x=nodeX(i);
    if(i===city.river.i||i===city.river.i+1) continue;
    city.crossings.push({x, y:city.rail.y, warn:0, down:0});
  }
  /* ---- bridges where each east-west road crosses the river ---- */
  for(let j=0;j<=ROWS;j++){
    const y=nodeY(j);
    city.bridges.push({x:ROAD+city.river.i*CELL, y, w:BLOCK, h:ROAD});
  }

  /* ---- junction control: lights downtown, stop signs out in the sticks ---- */
  for(let j=0;j<=ROWS;j++) for(let i=0;i<=COLS;i++){
    const zi=clamp(i,0,COLS-1), zj=clamp(j,0,ROWS-1);
    const z=zoneAt(zi,zj);
    const ctrl = (z==='downtown'||z==='commercial') ? 'light' : (z==='residential' ? (((i*7+j*13)%3)?'light':'stop') : 'stop');
    city.lights.set(i+','+j, { ctrl, off:((i*5+j*11)%LIGHT_CYCLE_STEPS)/LIGHT_CYCLE_STEPS*LIGHT_CYCLE, ns:(i+j)%2===0 });
  }
  buildPropGrid();
}
function blockIdx(i,j){ return (i<0||j<0||i>=COLS||j>=ROWS)?-1:j*COLS+i; }
function blocksNear(x,y,r,out){
  out.length=0;
  const i0=Math.floor((x-r-ROAD)/CELL), i1=Math.floor((x+r-ROAD)/CELL);
  const j0=Math.floor((y-r-ROAD)/CELL), j1=Math.floor((y+r-ROAD)/CELL);
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){ const k=blockIdx(i,j); if(k>=0) out.push(city.blocks[k]); }
  return out;
}
function onRoad(x,y){
  const u = ((x-ROAD/2)%CELL+CELL)%CELL, v = ((y-ROAD/2)%CELL+CELL)%CELL;
  const h = ROAD/2;
  return (u<h||u>CELL-h) || (v<h||v>CELL-h);
}

const vehicles = [];
let vgrid = new Map();
const VG = 72;
function gkey(x,y){ return ((x/VG)|0) + ',' + ((y/VG)|0); }
function gridAdd(k,v){ let a = vgrid.get(k); if(!a){ a=[]; vgrid.set(k,a); } a.push(v); }
function rebuildGrid(){
  vgrid.clear();
  for(const v of vehicles){
    const k = gkey(v.x,v.y);
    gridAdd(k,v);
    if(v.spec.trailer){
      /* a rig is long: file it under its trailer's cells as well so nothing
         can drive through the back half unnoticed */
      const k2 = gkey(v.trailerX,v.trailerY);
      if(k2!==k) gridAdd(k2,v);
      const hl=v.spec.trailer.w*0.5;
      const k3 = gkey(v.trailerX-Math.cos(v.trailerA)*hl, v.trailerY-Math.sin(v.trailerA)*hl);
      if(k3!==k && k3!==k2) gridAdd(k3,v);
    }
  }
}

  _near.length=0;
